    const c = Math.cos(phi), s = Math.sin(phi);
    for(let j = 0; j < 9; j += 3){
      const x = m[j], y = m[j + 1];
      m[j]     = c * x - s * y;
      m[j + 1] = s * x + c * y;
    }
  }
  function bindAttr(loc, bo, size){
    gl.bindBuffer(gl.ARRAY_BUFFER, bo);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  }
  function draw3d(t, b){
    if(dead) return;
    // repaint only when what the canvas shows would actually change
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if(!dirty && dpr === dpr0 && b.a === lastA && b.rx === lastRx && b.ry === lastRy)
      return;
    if(dpr !== dpr0){
      dpr0 = dpr;
      el.width = el.height = Math.max(2, Math.round(side * dpr));
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    }
    m3yx(b.ry, b.rx, .985, mM);       // positions: the tumble — CSS spins the box
    m3yx(b.ry, b.rx, 1, mL);
    m3z(-b.a, mL);                    // normals: lights stay fixed on the page
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    for(const d of draws){
      const L = d.loc;
      gl.useProgram(L.prog);
      if(d.img){                      // the real baseColor arrived: upload once
        gl.bindTexture(gl.TEXTURE_2D, d.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, d.img);
        if(!(d.img.width & (d.img.width - 1)) &&
           !(d.img.height & (d.img.height - 1))){
          // the 512² r1 skin mipmaps; the 235-wide wallpaper is NPOT
          // and must stay LINEAR + CLAMP in WebGL1
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        }
        d.img = null;
      }
      gl.uniformMatrix3fv(L.uM, false, mM);
      gl.uniformMatrix3fv(L.uL, false, mL);
      if(L.uZB) gl.uniform1f(L.uZB, d.zb);
      bindAttr(L.aP, d.pos, 3);
      bindAttr(L.aN, d.nrm, 3);
      bindAttr(L.aX, d.ext, L.xSize);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.ibo);
      if(d.tex){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, d.tex); }
      gl.drawElements(gl.TRIANGLES, d.n, gl.UNSIGNED_SHORT, 0);
    }
    lastA = b.a; lastRx = b.rx; lastRy = b.ry;
    dirty = false;
  }

  return { el, w:opts.w, h:opts.h, cut:opts.cut, boxW:side, boxH:side,
           thick:opts.thick, draw3d,
           busy:bb => !dead && !bb.poseCalm };
}

function makeRabbitGL(side){
  const MSH = window.R1_MESH;
  if(!MSH || !MSH.pos || !MSH.nrm || !MSH.uv || !MSH.idx || !MSH.idx.length)
    return null;
  const rr = Math.round(side * .16);
  return makeModelGL(
    [{ pos:MSH.pos, nrm:MSH.nrm, uv:MSH.uv, idx:MSH.idx, tex:MSH.tex,
       fill:[255, 77, 6] }],          // shell orange until the JPEG lands
    side,
    { w:side, h:side, cut:rr * .75, thick:R1_THICK,
      onLost:el => {
        el.style.background = "#ff4d06";   // degrade to the flat look
        el.style.borderRadius = rr + "px";
        const bb = bodyByEl.get(el);       // a flat square has no depth: level
        if(bb){                            // the pose, restore the face-on hull
          bb.tumbles = false;
          bb.rx = bb.ry = bb.wx = bb.wy = 0;
          bb.poseCalm = true;
          if(Math.abs(bb.hullW - bb.toyW) > .5) r1SetWidth(bb, bb.toyW);
          wake(bb);
          start();
        }
      } });
}

/* the iPhone — vertex-colored body plus the textured OLED, straight
   from iphone-mesh.js. Its hull is the phone slab, narrower than the
   square canvas it draws on; its depth ratio comes from the bake
   header. No mesh, no WebGL, or a lost context: it spawns nothing and
   removes itself — there is no flat iPhone anymore. */
function makeIphoneGL(side){
  const M = window.IPHONE_MESH;
  if(!M || !M.solid || !M.screen || !M.solid.pos || !M.solid.rgb ||
     !M.solid.idx || !M.solid.idx.length || !M.screen.pos || !M.screen.uv ||
     !M.screen.idx || !M.screen.idx.length)
    return null;
  // model dims 0.9747 × 2.0, drawn at the .985 margin on a square canvas
  const h = Math.round(side * .985);
  const w = Math.round(side * .985 * .4874);
  return makeModelGL(
    [{ pos:M.solid.pos, nrm:M.solid.nrm, rgb:M.solid.rgb, idx:M.solid.idx },
     { pos:M.screen.pos, nrm:M.screen.nrm, uv:M.screen.uv, idx:M.screen.idx,
       tex:M.screen.tex, fill:[10, 10, 12],     // near-black until the wallpaper lands
       zb:.008 }],   // lift the OLED past its opaque-baked cover glass (Δz .0126)
    side,
    { w, h, cut:Math.round(w * .14), thick:M.thickness || .0886,
      onLost:el => {
        const bb = bodyByEl.get(el);       // no flat fallback: the phone bows out
        if(bb) removeBody(bb); else el.remove();
      } });
}

function spawnToy(which){
  if(!hullsBuilt) buildHulls();
  const F = fontPx();
  const cap = capHeightPx(F);
  let spec;
  if(which === "iphone"){
    spec = makeIphoneGL(Math.round(cap * IP_SIDE));
    if(!spec) return;                      // no GL, no mesh: the pile gets no phone
  } else {
    const side = Math.round(cap * 1.25);
    spec = makeRabbitGL(side) || makeRabbit(side);
  }
  const b = toyBody(spec.el, spec.w, spec.h, spec.cut, spec.boxW, spec.boxH);
  if(spec.draw3d){
    b.draw3d = spec.draw3d;
    busy3D.push(() => spec.busy(b));       // sleep must ask this toy too
    b.tumbles = true;                      // a 3D toy carries real depth —
    b.thick3d = spec.thick;                // each model knows how deep it is
    b.wx = (Math.random() - .5) * 2;       // it arrives gently mid-tumble and
    b.wy = (Math.random() - .5) * 3;       // the landing kick does the rest
    b.poseCalm = false;
  }
  b.ch = which;
  b.x = innerWidth * (which === "iphone" ? .65 : .35);
  b.y = which === "iphone" ? -(b.rad + 40) : -150;   // the slab is tall: clear the ceiling
  b.vx = 0; b.vy = 0;
  b.a = (Math.random() - .5) * .5;
  b.va = (Math.random() - .5) * 1.8;       // a small tossed-in spin
  b.entering = true;                       // the ceiling looks away while it arrives
  document.body.appendChild(spec.el);
  bodies.push(b);
  wake(b);
  render(performance.now());   // paint it above the ceiling before it moves
  start();
}

/* the toys arrive once each, a beat after the letters have found the floor */
function toyTimer(which, delay){
  setTimeout(() => {
    if(!spilled){ toyTimer(which, 600); return; }  // outwaits a collapsed viewport
    spawnToy(which);
  }, delay);
}
toyTimer("r1", 2600);
toyTimer("iphone", 3200);

/* ---- resize: seats move; nothing may leave the viewport ---- */
addEventListener("resize", () => {
  if(mode !== "seated") refreshGeometry();   // the headline size tracks vw/vh
  const W = innerWidth, H = innerHeight;
  for(const b of bodies){
    if(b.kind !== "toy" && mode === "seated") continue;   // seated UI reflows itself
    b.x = Math.min(Math.max(b.x, 2), W - 2);
    if(!b.entering) b.y = Math.min(b.y, H - 2);
  }
  wakeAll();
  start();
});

})();
</script>
