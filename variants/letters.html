/* returns the drawn canvas, or null if 2D is unavailable — the batch
   then keeps its 1px near-white stand-in and the phone shows a blank
   screen instead of throwing */
function drawRambleScreen(){
  let c = null;
  try{
    const cv = document.createElement("canvas");
    cv.width = SCR_W; cv.height = SCR_H;
    c = cv.getContext("2d");
    if(!c) return null;

    // the screen quad is SCR_ASPECT taller than this texture: draw in true
    // proportions, squash into the texture, and the quad stretches it back
    // so circles arrive round
    c.setTransform(1, 0, 0, 1 / SCR_ASPECT, 0, 0);

    c.fillStyle = SCR_PAPER;
    c.fillRect(0, 0, SCR_W, SCR_H * SCR_ASPECT);

    // status strip: a time chip and two indicators, nothing legible
    c.fillStyle = SCR_CHROME;
    scrRRect(c, 44, 30, 64, 16, 8);
    scrRRect(c, 376, 31, 36, 14, 7);
    scrRRect(c, 424, 31, 46, 14, 7);

    // the title line
    c.fillStyle = SCR_TITLE;
    scrRRect(c, 44, 104, 236, 28, 14);

    // four task rows — an open check circle, then a bar of its own width
    const ROW_W = [312, 244, 348, 208];
    c.lineWidth = 4;
    for(let i = 0; i < ROW_W.length; i++){
      const y = 212 + i * 82;
      c.strokeStyle = SCR_RING;
      c.beginPath();
      c.arc(68, y + 12, 16, 0, Math.PI * 2);
      c.stroke();
      c.fillStyle = SCR_ROW;
      scrRRect(c, 108, y, ROW_W[i], 24, 12);
    }

    // the hero: a voice-capture waveform. 18 rounded bars under a fat
    // envelope, roughened by a fixed wobble so it reads as a voice and
    // not a sine — deterministic, so every phone draws the same screen
    const BARS = 18, bw = 12, gap = 11, midY = 700, tall = 190;
    let x = (SCR_W - (BARS * bw + (BARS - 1) * gap)) / 2;
    c.fillStyle = SCR_RED;
    for(let i = 0; i < BARS; i++){
      const u = i / (BARS - 1);
      const env = .28 + .72 * Math.sin(Math.PI * u);
      const h = Math.max(bw, tall * env *
                (.55 + .45 * Math.abs(Math.sin(u * 11.3 + 1.1))));
      scrRRect(c, x, midY - h / 2, bw, h, bw / 2);
      x += bw + gap;
    }

    // …and the record button beneath it
    c.beginPath();
    c.arc(SCR_W / 2, 908, 48, 0, Math.PI * 2);
    c.fill();
    c.globalAlpha = .3;
    c.strokeStyle = SCR_RED;
    c.lineWidth = 4;
    c.beginPath();
    c.arc(SCR_W / 2, 908, 63, 0, Math.PI * 2);
    c.stroke();
    c.globalAlpha = 1;

    // home indicator
    c.fillStyle = SCR_RING;
    scrRRect(c, SCR_W / 2 - 68, 1054, 136, 10, 5);

    return cv;
  }catch(err){ return null; }
}

/* the iPhone — vertex-colored body plus the drawn OLED. The geometry
   is straight from iphone-mesh.js; only the screen's pixels are ours.
   Its hull is the phone slab, narrower than the square canvas it draws
   on; its depth ratio comes from the bake header. No mesh, no WebGL, or
   a lost context: it spawns nothing and removes itself — there is no
   flat iPhone anymore. */
function makeIphoneGL(side){
  const M = window.IPHONE_MESH;
  if(!M || !M.solid || !M.screen || !M.solid.pos || !M.solid.rgb ||
     !M.solid.idx || !M.solid.idx.length || !M.screen.pos || !M.screen.uv ||
     !M.screen.idx || !M.screen.idx.length)
    return null;
  // model dims 0.9747 × 2.0, drawn at the .985 margin inside its model box
  const h = Math.round(side * .985);
  const w = Math.round(side * .985 * .4874);
  return makeModelGL(
    [{ pos:M.solid.pos, nrm:M.solid.nrm, rgb:M.solid.rgb, idx:M.solid.idx },
     { pos:M.screen.pos, nrm:M.screen.nrm, uv:M.screen.uv, idx:M.screen.idx,
       canvas:drawRambleScreen(),               // (M.screen.tex, the baked
       fill:[253, 253, 251],                    // wallpaper, is no longer
       zb:.008 }],   // lift the OLED past its opaque-baked cover glass (Δz .0126)
                     // sampled — it stays in the generated mesh file, unused)
    side,
    { w, h, cut:Math.round(w * .14), thick:M.thickness || .0886,
      onLost:el => {
        const bb = bodyByEl.get(el);       // no flat fallback: the phone bows out
        if(bb) removeBody(bb); else el.remove();
      } });
}

/* what each object says when you pick it up — the pile is a portfolio,
   and this is the only place the pieces are named */
const TOY_LABELS = {
  r1:     "rabbit r1 — interface design, 2024",
  iphone: "Ramble for Todoist — voice capture, 2025"
};
/* the world each object drags onto the page while you hold it.
   r1: RAL 2005 Leuchtorange, the shell's own colour.
   iphone: PLACEHOLDER for Ramble's gradient — swap in the real stops. */
const TOY_FLOOD = {
  r1:     "#ff4d06",
  iphone: "linear-gradient(158deg,#ffa04d 0%,#e44332 52%,#b4275e 100%)"
};

function spawnToy(which){
  if(!hullsBuilt) buildHulls();
  const F = fontPx();
  const cap = capHeightPx(F);
  const r1side = Math.round(cap * R1_CAP);   // the anchor: everything scales off this
  let spec;
  if(which === "iphone"){
    // true scale: the DRAWN phone (model box × .985 margin) comes out
    // PHONE_H × the r1's side — a real iPhone against a real r1
    spec = makeIphoneGL(Math.round(r1side * PHONE_H / .985));
    if(!spec) return;                      // no GL, no mesh: the pile gets no phone
  } else {
    spec = makeRabbitGL(r1side) || makeRabbit(r1side);
  }
  const b = toyBody(spec.el, spec.w, spec.h, spec.cut, spec.boxW, spec.boxH);
  if(spec.draw3d){
    b.draw3d = spec.draw3d;
    busy3D.push(() => spec.busy(b));       // sleep must ask this toy too
    b.tumbles = true;                      // a 3D toy carries real depth —
    b.thick3d = spec.thick;                // each model knows how deep it is
    b.wx = (Math.random() - .5) * 2;       // it arrives gently mid-tumble and
    b.wy = (Math.random() - .5) * 3;       // the landing kick does the rest
    b.poseCalm = false;
  }
  b.ch = which;
  b.label = TOY_LABELS[which] || "";
  b.flood = TOY_FLOOD[which] || "";
  b.x = innerWidth * (which === "iphone" ? .65 : .35);
  b.y = which === "iphone" ? -(b.rad + 40) : -150;   // the slab is tall: clear the ceiling
  b.vx = 0; b.vy = 0;
  b.a = (Math.random() - .5) * .5;
  b.va = (Math.random() - .5) * 1.8;       // a small tossed-in spin
  b.entering = true;                       // the ceiling looks away while it arrives
  document.body.appendChild(spec.el);
  bodies.push(b);
  wake(b);
  render(performance.now());   // paint it above the ceiling before it moves
  start();
}

/* the toys arrive once each, a beat after the letters have found the floor */
function toyTimer(which, delay){
  setTimeout(() => {
    if(!spilled){ toyTimer(which, 600); return; }  // outwaits a collapsed viewport
    spawnToy(which);
  }, delay);
}
toyTimer("r1", 2600);
toyTimer("iphone", 3200);

/* ---- resize: seats move; nothing may leave the viewport ---- */
addEventListener("resize", () => {
  if(mode !== "seated") refreshGeometry();   // the headline size tracks vw/vh
  const W = innerWidth, H = innerHeight;
  for(const b of bodies){
    if(b.kind !== "toy" && mode === "seated") continue;   // seated UI reflows itself
    b.x = Math.min(Math.max(b.x, 2), W - 2);
    if(!b.entering) b.y = Math.min(b.y, H - 2);
  }
  wakeAll();
  start();
});

})();
</script>
