<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael Mofina — Product Designer</title>
<meta name="description" content="Michael Mofina — product designer at Todoist.">
<meta name="theme-color" content="#fdfdfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<style>
/* ============================================================
   michael mofina — "spill" variant
   The name appears mid-page, holds just long enough to be read,
   then every letter falls. Each one is a rigid body whose collider
   is traced from its own glyph outline, so letters land on their
   ink, tip over their stems, and stack like real objects. The two
   pills under the name fall with them — and still work: a clean tap
   activates, anything longer is a drag; the corner wayfinding stays
   put. A rabbit r1 drops in after the first
   spill, an iPhone follows a beat later, and neither ever leaves.
   One viewport, no scroll. Escape or double-click puts the name
   (and the pills) back together.
   ============================================================ */

@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Book.woff2") format("woff2");
  font-weight:350;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Regular.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Medium.woff2") format("woff2");
  font-weight:500;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Light.woff2") format("woff2");
  font-weight:300; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Bold.woff2") format("woff2");
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Heavy.woff2") format("woff2");
  font-weight:800; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Black.woff2") format("woff2");
  font-weight:900; font-style:normal; font-display:swap;
}

:root{
  --paper:#fdfdfb;
  --ink:22,22,22;
  --accent-l:#c2410c;            /* the palette script overwrites this pair; */
  --accent-d:#fb923c;            /* these two are the no-JS fallback */
  --accent:var(--accent-l);
  color-scheme:light dark;
}
/* the page follows the system — no toggle. Warm near-black, warm
   off-white ink, the red lifted a step so it carries on the dark ground */
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141210;
    --ink:241,238,232;
    --accent:var(--accent-d);
  }
}
/* hosted wrappers (e.g. the Claude artifact viewer) stamp their theme on
   the root — honor it in both directions so their toggle wins there;
   the real site never has data-theme and stays on the media query */
:root[data-theme="dark"]{ --paper:#141210; --ink:241,238,232; --accent:var(--accent-d); }
:root[data-theme="light"]{ --paper:#fdfdfb; --ink:22,22,22; --accent:var(--accent-l); }

*{ margin:0; padding:0; box-sizing:border-box; }

html, body{ background:var(--paper); }  /* body too: wrapper resets must not paint over us */

body{
  font-family:"KMR Apparat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400;
  font-size:.95rem;
  line-height:1.6;
  color:rgba(var(--ink),.85);
  overflow:hidden;               /* one viewport — the page never scrolls */
  overscroll-behavior:none;
  height:100svh;
}

::selection{ background:var(--accent); color:var(--paper); }

a{ color:inherit; }
a:focus-visible{ outline:2px solid rgba(var(--ink),.85); outline-offset:3px; border-radius:2px; }

.fade{
  animation:fadeUp .55s cubic-bezier(.22,.61,.36,1) both;
  animation-delay:var(--d,0ms);
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:none; }
}

/* ---- hero ---- */
.hero{
  position:relative;
  height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:clip;
}
.corner{
  position:absolute;
  top:1.75rem; left:1.5rem; right:1.5rem;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:.2rem 1.5rem;
  /* no z-index: the corner must not trap its fixed pills in a
     stacking context of its own once they go live */
}

/* the row UI is two pills — a real button and link that later fall
   with the letters and still work */
.pill{
  display:inline-block;
  font:inherit;
  font-size:.85rem;
  letter-spacing:.01em;          /* small text breathes with a touch of tracking */
  color:rgba(var(--ink),.7);
  background:var(--paper);       /* an opaque chip once it flies over letters */
  border:1px solid rgba(var(--ink),.25);
  border-radius:999px;
  padding:.3rem .85rem;
  text-decoration:none;
  cursor:pointer;
  transition:color .2s ease, border-color .2s ease, opacity .4s ease;
}
/* press feedback lands on pointer-down, not on release (seated only —
   live pills belong to the physics and its inline transforms) */
.pill:not(.live){ transition:color .2s ease, border-color .2s ease,
  opacity .4s ease, transform .1s ease-out; }
.pill:not(.live):active{ transform:scale(.96); }
.pill[hidden]{ display:none; }     /* inline-block must not defeat hidden */
a.pill:hover, button.pill:hover{ color:var(--accent); border-color:var(--accent); }
.pill:focus-visible{ outline:2px solid rgba(var(--ink),.85); outline-offset:3px; }
.pill.gone{ opacity:0; pointer-events:none; }

/* physics owns a live pill exactly the way it owns a live letter */
.pill.live{
  position:fixed;
  left:0; top:0;
  z-index:9;
  margin:0;
  cursor:grab;
  touch-action:none;
  transform-origin:0 0;
  will-change:transform;
  user-select:none;
  -webkit-user-select:none;
}
/* Get in touch — the one filled thing on the page, in the visit's accent */
.cta .lbl{
  grid-area:1 / 1;
  transition:opacity .18s ease;
}
.cta .lbl.b{ opacity:0; }        /* …the confirmation waits underneath */
.cta.copied .lbl.a{ opacity:0; }
.cta.copied .lbl.b{ opacity:1; }
.pill.cta{
  display:grid;                  /* both labels share one cell, so the chip is
                                    as wide as the wider of them — and stays */
  place-items:center;
  background:var(--accent);
  border-color:var(--accent);
  color:var(--paper);
  font-weight:500;
  padding:.28rem .8rem;
  font-size:.85rem;
  white-space:nowrap;
}
.pill.cta:hover{ color:var(--paper); border-color:var(--accent); filter:brightness(1.08); }
.pill.cta.copied{ filter:brightness(1.12); }
.pill.live.held{ cursor:grabbing; color:var(--accent); border-color:var(--accent); z-index:30; }

.row{ display:flex; align-items:center; gap:.9rem; }

/* the name — one line, sized to fit with a little bleed-proofing */
.big{
  font-weight:var(--w-name,400);   /* the weight the name has always rendered at */
  font-size:min(11vw,16vh);
  line-height:1;
  letter-spacing:-.03em;
  color:rgba(var(--ink),.87);
  white-space:nowrap;
  user-select:none;
  -webkit-user-select:none;
}
.big .word + .word{ margin-left:.38em; }

.letter{
  display:inline-block;
  will-change:transform;
}
/* once physics owns a letter it becomes a fixed-position sprite;
   transforms are composed by hand about the glyph's own centroid,
   so the origin must stay at the box corner */
.letter.live{
  position:fixed;
  left:0; top:0;
  z-index:9;
  cursor:grab;
  touch-action:none;
  transform-origin:0 0;
}
.letter.live.held{ cursor:grabbing; color:var(--accent); z-index:30; }
body.grabbing{ cursor:grabbing; user-select:none; -webkit-user-select:none; }

/* the two toys that join the pile — sized in px by the script to
   match the headline's cap height. Both render their real baked
   meshes through WebGL; the r1 falls back to a flat DOM drawing
   when it can't, the iPhone simply doesn't show up. */
.toy{
  position:fixed;
  left:0; top:0;
  z-index:8;               /* letters read in front of the toys */
  transform-origin:0 0;
  will-change:transform;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
/* the held body is the thing in your hand: it rides over the caption (z 20)
   for exactly the hold, then drops back into the resting order. The same
   z joins .letter.live.held and .pill.live.held above — letters and pills
   never have captions of their own, but one may still be fading out. */
.toy.held{ cursor:grabbing; z-index:30; }
.toy div{ position:absolute; }

/* invisible mirror of the name: always lays out naturally, so home
   seats stay correct at any viewport size */
.ghost{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  visibility:hidden;
  pointer-events:none;
}
/* name above, pill row below — and the twin must stack exactly
   like the real thing or the seats would lie */
.hero, .ghost{ flex-direction:column; gap:1.15rem; }

.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ---- what you're holding ----
   The objects in the pile are portfolio pieces; a tumbling phone can't
   say so on its own. While one is in hand a quiet line names it, low and
   centred — well below the name and its row, well below the corner, and
   out of the way of every control. Letters and pills say nothing. */
.caption{
  position:fixed;
  left:0; right:0;               /* full width, text centred — a left:50% box
                                    shrink-to-fits and wraps on a narrow phone */
  top:50%;
  transform:translateY(-50%);    /* dead centre — the middle is empty once
                                    the letters have fallen out of it */
  z-index:20;                    /* over the RESTING sprites (8–9) — a held
                                    body (30) and the dev panel (80) ride over it */
  padding:0 1.5rem;
  text-align:center;
  font-size:clamp(1rem,1.5vw,1.15rem);
  letter-spacing:0;
  line-height:1.4;
  color:rgba(var(--ink),.62);
  pointer-events:none;
  opacity:0;
  transition:opacity .35s ease;                           /* the way out */
}
.caption.on{
  opacity:1;
  
  transition:opacity .22s ease,                           /* …and the way in */
             transform .22s cubic-bezier(.22,.61,.36,1);
}
/* a short viewport puts 12% right in the middle of the pile — sit just
   above the floor there instead, under everything rather than through it */



/* An object in hand floods the page with its own world: rabbit's RAL 2005
   for the r1, Ramble's gradient for the phone. Marks go dark for the
   duration — both floods are bright, in either theme. */
.flood{
  position:fixed; inset:0;
  opacity:0; pointer-events:none;
  transition:opacity .24s ease;
}
.flood.on{ opacity:1; }
:root.flooded{ --ink:22,22,22; --accent:#161616; }
/* the floods are bright in either theme, so chips stop following the
   theme for the duration: paper chips, one dark chip, dark marks */
:root.flooded .pill{
  background:#fdfdfb; color:rgba(22,22,22,.7); border-color:rgba(22,22,22,.25);
}
:root.flooded .pill.cta{ background:#161616; color:#fdfdfb; border-color:#161616; }
.big, .who, .who a, .corner-link, .caption{ transition:color .24s ease; }

/* ---- static wayfinding ---- */
.who{ margin:0; color:rgba(var(--ink),.6); font-weight:var(--w-top,500); }
.who a{ color:var(--accent); text-decoration:none; }
.who a:hover{ text-decoration:underline; text-underline-offset:.18em; }
.reach{ display:flex; align-items:baseline; gap:1.1rem; }
.corner-link{
  font-size:.95rem; color:rgba(var(--ink),.85);
  font-weight:var(--w-top,500);
  text-decoration:none;
  transition:color .2s ease;
}
.corner-link:hover{ color:var(--accent); }

/* ---- mobile corner: one line at rest. At ≤640px the three contacts
   collapse into a single quiet “Contact” text button on the who-line;
   tapping it swaps the real items back in (they may wrap to a second
   line then — chosen, not accidental). A tap anywhere else, or grabbing
   anything, collapses it again. Desktop never displays the toggle and
   keeps today’s corner exactly. ---- */
.reach-toggle{
  display:none;                    /* only the ≤640px corner ever shows it */
  font:inherit;
  font-size:.95rem;
  color:rgba(var(--ink),.85);
  font-weight:var(--w-top,500);
  background:none; border:0; padding:0;
  cursor:pointer;
  transition:color .2s ease;
}
.reach-toggle:hover{ color:var(--accent); }
.reach-toggle:focus-visible{ outline:2px solid rgba(var(--ink),.85); outline-offset:3px; border-radius:2px; }
@media (max-width:640px){
  .corner{ flex-wrap:nowrap; }               /* a single line at rest… */
}
@media (max-width:352px){
  .corner{ left:1rem; right:1rem; gap:.2rem .75rem; }  /* the who-line + Contact
                                    need ~273px; give them the extra breathing
                                    room the 1.5rem insets were spending */
}
@media (max-width:640px){
  .corner.open{ flex-wrap:wrap; }            /* …expanded may take a second */
  .corner:not(.open) .reach{ display:none; }
  .corner:not(.open) .reach-toggle{ display:inline-block; }
  .reach{ flex-wrap:wrap; justify-content:flex-end; row-gap:.4rem; }
}


/* ---- dev weight lab: only exists when the URL says #dev ---- */
.devpanel[hidden]{ display:none; }
.devpanel{
  position:fixed; left:1rem; bottom:1rem; z-index:80;
  display:flex; flex-direction:column; gap:.35rem;
  background:var(--paper); border:1px solid rgba(var(--ink),.25);
  border-radius:10px; padding:.6rem .8rem;
  font-size:.72rem; color:rgba(var(--ink),.7);
}
.devpanel label{ display:flex; align-items:center; gap:.5rem; }
.devpanel label span:first-child{ width:2.6rem; }
.devpanel input{ width:130px; accent-color:var(--accent); }
.devsw{ display:flex; gap:.3rem; align-items:center; margin-top:.15rem; }
.devsw button{
  width:18px; height:18px; border-radius:50%; cursor:pointer;
  border:1px solid rgba(var(--ink),.25); padding:0; font:inherit; font-size:.6rem;
  color:rgba(var(--ink),.7); background:none; line-height:1;
}
.devsw button[data-on="1"]{ box-shadow:0 0 0 2px rgba(var(--ink),.5); }
.devpanel output{ width:2.2rem; text-align:right; font-variant-numeric:tabular-nums; }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
  .fade{ opacity:1; transform:none; }
}
</style>
<script>
/* The accent is a living thing: a curated palette (each hue tuned twice —
   deep for the light ground, bright for the dark), a different one each
   visit, steady while you browse. #dev can lock one. */
(() => {
  const P = [
    ["ember",  "#c2410c", "#fb923c"],
    ["gold",   "#a16207", "#fbbf24"],
    ["moss",   "#3f6212", "#a3e635"],
    ["pine",   "#0f766e", "#5eead4"],
    ["cobalt", "#1d4ed8", "#93c5fd"],
    ["plum",   "#7e22ce", "#d8b4fe"]
  ];
  const apply = i => {
    const p = P[i] || P[0], r = document.documentElement;
    r.style.setProperty("--accent-l", p[1]);
    r.style.setProperty("--accent-d", p[2]);
    r.dataset.accent = p[0];
    window.ACCENT_I = i;
  };
  let idx = null;
  try {
    const lock = localStorage.getItem("mm-accent");        // #dev lock wins
    if(lock !== null && P[+lock]) idx = +lock;
    else {
      const seen = sessionStorage.getItem("mm-accent-visit");  // steady across pages
      if(seen !== null && P[+seen]) idx = +seen;
      else {
        idx = Math.floor(Math.random() * P.length);
        sessionStorage.setItem("mm-accent-visit", idx);
      }
    }
  } catch(e){ idx = Math.floor(Math.random() * P.length); }  // private mode, etc.
  window.ACCENTS = P;
  window.applyAccent = apply;
  apply(idx);
})();
</script>
</head>
<body>

<div class="flood" id="flood" aria-hidden="true"></div>

<section class="hero">
  <div class="corner fade" style="--d:0ms">
    <p class="who">Product Designer at <a href="https://todoist.com">Todoist</a></p>
    <button class="reach-toggle" id="reachToggle" type="button" aria-expanded="false" aria-controls="reach">Contact</button>
    <nav class="reach" id="reach" aria-label="Contact">
      <a class="corner-link" href="https://twitter.com/MichaelMofina" rel="me">Twitter</a>
      <a class="corner-link" href="https://www.linkedin.com/in/michaelmofina" rel="me">LinkedIn</a>
      <button class="pill cta" id="contact" type="button" title="Copy to clipboard" aria-label="Copy email address"><span class="lbl a">info@michaelmofina.com</span><span class="lbl b" aria-hidden="true">copied &#10003;</span></button>
    </nav>
  </div>

  <h1 class="big fade" id="name" style="--d:80ms">
    <span class="sr-only">michael mofina</span><span aria-hidden="true" id="visname"><span class="word">michael</span><span class="word">mofina</span></span>
  </h1>

  <div class="row fade" id="pillrow" style="--d:160ms">
    <button class="pill" id="shake" hidden>Shake it up</button>
  </div>

  <!-- invisible twin used only to know where the letters' and pills' seats are -->
  <div class="ghost" aria-hidden="true">
    <p class="big" id="ghostname"></p>
    <div class="row" id="grow"></div>
  </div>
</section>

<!-- named on pickup: filled only while an OBJECT is held, then faded out.
     Real text, politely announced, so the label reaches a screen reader too. -->
<p class="caption" id="caption" aria-live="polite"></p>

<div class="devpanel" id="devpanel" hidden aria-hidden="true">
  <label><span>name</span><input type="range" id="devName" min="0" max="6" step="1" value="2"><output id="devNameV">400</output></label>
  <label><span>top</span><input type="range" id="devTop" min="0" max="6" step="1" value="3"><output id="devTopV">500</output></label>
  <div class="devsw" id="devAccents"></div>
</div>



<script src="r1-mesh.js"></script>
<script src="iphone-mesh.js"></script>
<script>
(() => {
"use strict";

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Filled transform animations create containing blocks for position:fixed;
// clear each entrance animation once it has played.
document.querySelectorAll(".fade").forEach(el => {
  el.addEventListener("animationend", () => { el.style.animation = "none"; }, { once:true });
});

/* ---- split the words into letter spans (visible + ghost twin) ---- */
const visname = document.getElementById("visname");
const ghostP  = document.getElementById("ghostname");
visname.querySelectorAll(".word").forEach(w => {
  w.innerHTML = w.textContent.split("")
    .map(ch => '<span class="letter">' + ch + "</span>").join("");
});
ghostP.innerHTML = visname.innerHTML;   // identical structure, invisible
const letters = [...visname.querySelectorAll(".letter")];
const seats   = [...ghostP.querySelectorAll(".letter")];



/* ---- dev weight lab (URL hash is exactly #dev — a stray "dev" in a
   query string like ?ref=devto must NOT open it): three sliders across
   the seven real Apparat cuts. The name slider re-traces the glyph
   hulls so heavier letters really are heavier objects. ---- */
const devPanel = document.getElementById("devpanel");
if(devPanel && location.hash === "#dev"){
  devPanel.hidden = false;
  const DEV_W = [300, 350, 400, 500, 700, 800, 900];
  const wire = (id, cssVar, onSet) => {
    const inp = document.getElementById(id);
    const out = document.getElementById(id + "V");
    inp.addEventListener("input", () => {
      const w = DEV_W[+inp.value];
      out.textContent = w;
      document.documentElement.style.setProperty(cssVar, w);
      if(onSet) onSet(w);
    });
  };
  wire("devName", "--w-name", reduced ? null : w => {
    FONT_WT = String(w);                  // (reduced motion: CSS var alone is enough —
    hullsBuilt = false;                   // the physics never initialized)
    for(const k in HULLS) delete HULLS[k];
    dispatchEvent(new Event("resize"));   // re-measure seats, rebuild hulls
  });
  wire("devTop",  "--w-top");

  /* accent swatches: click to lock one for good, ↻ to go back to
     a fresh colour every visit */
  const sw = document.getElementById("devAccents");
  const dark = () => document.documentElement.dataset.theme === "dark" ||
    (document.documentElement.dataset.theme !== "light" &&
     matchMedia("(prefers-color-scheme: dark)").matches);
  const paint = () => [...sw.querySelectorAll("button[data-i]")].forEach(b => {
    b.style.background = window.ACCENTS[+b.dataset.i][dark() ? 2 : 1];
    b.dataset.on = (+b.dataset.i === window.ACCENT_I) ? "1" : "0";
  });
  window.ACCENTS.forEach((p, i) => {
    const b = document.createElement("button");
    b.dataset.i = i;
    b.title = p[0];
    b.addEventListener("click", () => {
      window.applyAccent(i);
      try{ localStorage.setItem("mm-accent", i); }catch(e){}
      paint();
    });
    sw.appendChild(b);
  });
  const rnd = document.createElement("button");
  rnd.textContent = "↻";
  rnd.title = "back to a new colour each visit";
  rnd.addEventListener("click", () => {
    try{ localStorage.removeItem("mm-accent"); sessionStorage.removeItem("mm-accent-visit"); }catch(e){}
    const i = Math.floor(Math.random() * window.ACCENTS.length);
    window.applyAccent(i);
    try{ sessionStorage.setItem("mm-accent-visit", i); }catch(e){}
    paint();
  });
  sw.appendChild(rnd);
  paint();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
}

/* ---- the address copies itself. Wired before the reduced-motion gate
   so it works whether or not the physics ever starts; the pill's box is
   pinned while it's a physics body, so the confirmation never reflows
   it out of its own collider. ---- */
const EMAIL = "info@michaelmofina.com";
let copyT = 0;
function copyEmail(el){
  const done = ok => {                      // both labels are already in the
    clearTimeout(copyT);                    // chip; only their opacity moves
    el.classList.toggle("copied", ok);
    if(ok) copyT = setTimeout(() => el.classList.remove("copied"), 1600);
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(EMAIL).then(() => done(true), () => done(legacyCopy()));
      return;
    }
  }catch(e){}
  done(legacyCopy());
}
function legacyCopy(){                      // http, older Safari, denied permission
  try{
    const t = document.createElement("textarea");
    t.value = EMAIL;
    t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(t);
    t.select();
    const ok = document.execCommand("copy");

/* ================================================================
   EXPERIMENT: lift gallery — while a toy is held, a few stylised
   placeholder screens fan out around the page: over the flood, under
   the pile, behind the caption. Each card is drawn ONCE into a canvas
   at device pixel ratio (in its product’s own idiom, the way the
   phone’s OLED already is) and cached — showing, swapping and hiding
   them is pure style flipping, so the physics loop never feels them.
   They stagger in on the page’s own curve and vanish INSTANTLY with
   the flood on release. ≤640px shows at most two, smaller. Reduced
   motion never constructs any of this (the IIFE returned long ago).

   REMOVE by deleting this block and its two hooks — the galShow(held)
   line in floodOn and the galHide() line in floodOff.
   REPLACE the drawn cards with real exports here: swap each set’s
   draw functions for painters that blit a loaded PNG into the same
   canvas — geometry, stagger and both hooks stay as they are.
   ================================================================ */
const GAL_EASE = "cubic-bezier(.22,.61,.36,1)";   // the page’s own curve
const GAL_INK  = "244,240,232";     // thin light strokes on the r1 cards

function galRR(c, x, y, w, h, r, stroke){
  const k = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + k, y);
  c.arcTo(x + w, y,     x + w, y + h, k);
  c.arcTo(x + w, y + h, x,     y + h, k);
  c.arcTo(x,     y + h, x,     y,     k);
  c.arcTo(x,     y,     x + w, y,     k);
  c.closePath();
  if(stroke) c.stroke(); else c.fill();
}

/* r1 — dark ground like the device’s screen, thin light strokes; no
   orange anywhere on the cards, so they read on the RAL-orange flood */
function galR1Stack(c, w, h){        // a simple card stack + its pager dot
  const cw = w * .58, ch = h * .42, cx = (w - cw) / 2, cy = h * .27;
  c.lineWidth = 2;
  c.strokeStyle = "rgba(" + GAL_INK + ",.3)";
  galRR(c, cx + cw * .07, cy - h * .11, cw * .86, ch, 9, true);
  c.strokeStyle = "rgba(" + GAL_INK + ",.55)";
  galRR(c, cx + cw * .035, cy - h * .055, cw * .93, ch, 9, true);
  c.fillStyle = "#141416";           // the front card occludes the stack
  galRR(c, cx, cy, cw, ch, 10, false);
  c.strokeStyle = "rgba(" + GAL_INK + ",.92)";
  galRR(c, cx, cy, cw, ch, 10, true);
  const dy = cy + ch + h * .12;
  for(let i = -1; i <= 1; i++){
    c.fillStyle = "rgba(" + GAL_INK + "," + (i === 0 ? .92 : .3) + ")";
    c.beginPath();
    c.arc(w / 2 + i * w * .05, dy, i === 0 ? 3.2 : 2.4, 0, Math.PI * 2);
    c.fill();
  }
}
function galR1Dial(c, w, h){         // the big wheel arc + its tick marks
  const cx = w / 2, cy = h * .58, R = Math.min(w, h) * .33;
  const a0 = -Math.PI * 1.12, a1 = Math.PI * .12, N = 12, EM = 9;
  c.lineCap = "round";
  c.strokeStyle = "rgba(" + GAL_INK + ",.9)";
  c.lineWidth = 2.5;
  c.beginPath(); c.arc(cx, cy, R, a0, a1); c.stroke();
  for(let i = 0; i <= N; i++){
    const a = a0 + (a1 - a0) * i / N, ca = Math.cos(a), sa = Math.sin(a);
    const inn = R - (i === EM ? 16 : 9);
    c.strokeStyle = "rgba(" + GAL_INK + "," + (i === EM ? .95 : .4) + ")";
    c.lineWidth = i === EM ? 3 : 2;
    c.beginPath();
    c.moveTo(cx + ca * inn, cy + sa * inn);
    c.lineTo(cx + ca * (R - 4), cy + sa * (R - 4));
    c.stroke();
  }
  c.fillStyle = "rgba(" + GAL_INK + ",.9)";
  c.beginPath(); c.arc(cx, cy, 3.5, 0, Math.PI * 2); c.fill();
}
function galR1List(c, w, h){         // a two-line list, one line lit
  const x = w * .16, bw = w * .68;
  c.fillStyle = "rgba(" + GAL_INK + ",.16)";
  galRR(c, x - w * .05, h * .27, bw + w * .1, h * .18, 9, false);
  c.fillStyle = "rgba(" + GAL_INK + ",.92)";
  galRR(c, x, h * .325, bw * .58, h * .075, 5, false);
  c.fillStyle = "rgba(" + GAL_INK + ",.34)";
  galRR(c, x, h * .58, bw * .82, h * .075, 5, false);
}

/* Ramble — near-white ground, the OLED’s own vocabulary (the same
   reds, rings and row bars drawRambleScreen uses; they read on the
   Ramble gradient flood) */
function galRamWave(c, w, h){        // the waveform + record motif
  const BARS = 11, bw = w * .045, gap = w * .031;
  let x = (w - (BARS * bw + (BARS - 1) * gap)) / 2;
  const midY = h * .4, tall = h * .21;
  c.fillStyle = SCR_RED;
  for(let i = 0; i < BARS; i++){
    const u = i / (BARS - 1);
    const env = .28 + .72 * Math.sin(Math.PI * u);
    const bh = Math.max(bw, tall * env *
               (.55 + .45 * Math.abs(Math.sin(u * 11.3 + 1.1))));
    galRR(c, x, midY - bh / 2, bw, bh, bw / 2, false);
    x += bw + gap;
  }
  c.beginPath(); c.arc(w / 2, h * .7, w * .105, 0, Math.PI * 2); c.fill();
  c.globalAlpha = .3;
  c.strokeStyle = SCR_RED;
  c.lineWidth = 3;
  c.beginPath(); c.arc(w / 2, h * .7, w * .14, 0, Math.PI * 2); c.stroke();
  c.globalAlpha = 1;
}
function galRamTasks(c, w, h){       // the task-list card + check circles
  c.fillStyle = SCR_TITLE;
  galRR(c, w * .12, h * .085, w * .5, h * .032, h * .016, false);
  const RW = [.6, .47, .68, .4];
  c.lineWidth = 2.5;
  for(let i = 0; i < RW.length; i++){
    const y = h * (.185 + i * .105);
    c.strokeStyle = SCR_RING;
    c.beginPath();
    c.arc(w * .165, y + h * .014, w * .045, 0, Math.PI * 2);
    c.stroke();
    c.fillStyle = SCR_ROW;
    galRR(c, w * .27, y, w * RW[i], h * .028, h * .014, false);
  }
  c.fillStyle = SCR_RING;
  galRR(c, w / 2 - w * .13, h * .945, w * .26, h * .009, h * .0045, false);
}

/* which cards, where — desktop (l,t) and ≤640px (ml,mt) as viewport
   fractions, each with its own small tilt inside −6°…5°. Grounds are
   literals (SCR_PAPER lives further down — same value, no TDZ). */
const GAL_SETS = {
  r1:     { ground:"#141416", cards:[      // ~1.06:1, landscape-ish
              { draw:galR1Stack, l:.07, t:.13, ml:.06, mt:.12, rot:-5 },
              { draw:galR1Dial,  l:.64, t:.18, ml:.52, mt:.60, rot: 4 },
              { draw:galR1List,  l:.12, t:.62,                 rot:-2 } ] },
  iphone: { ground:"#fdfdfb", cards:[      // tall, phone-aspect
              { draw:galRamWave,  l:.09, t:.12, ml:.08, mt:.10, rot:-4 },
              { draw:galRamTasks, l:.63, t:.56, ml:.56, mt:.60, rot: 3 } ] }
};
function galSize(key){               // card box for the current viewport
  const mob = innerWidth <= 640;
  if(key === "r1"){
    const cw = mob ? innerWidth * .3 : Math.min(innerWidth, innerHeight) * .27;
    return { w:cw, h:cw / 1.06 };
  }
  const ch = mob ? innerWidth * .46 : Math.min(innerWidth, innerHeight) * .3;
  return { w:ch * .48, h:ch };
}

let galEl = null, galKey = "", galDirty = false;
const galCards = { r1:[], iphone:[] };

function galBuild(key){
  const spec = GAL_SETS[key], size = galSize(key);
  const mob = innerWidth <= 640;
  const n = Math.min(spec.cards.length, mob ? 2 : spec.cards.length);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  for(const el of galCards[key]) el.remove();
  galCards[key].length = 0;
  for(let i = 0; i < n; i++){
    const cd = spec.cards[i];
    const w = Math.round(size.w), h = Math.round(size.h);
    const cv = document.createElement("canvas");
    cv.width = Math.max(2, Math.round(w * dpr));
    cv.height = Math.max(2, Math.round(h * dpr));
    cv.style.cssText = "position:absolute;display:none;" +
      "left:" + ((mob && cd.ml != null ? cd.ml : cd.l) * 100).toFixed(1) + "%;" +
      "top:"  + ((mob && cd.mt != null ? cd.mt : cd.t) * 100).toFixed(1) + "%;" +
      "width:" + w + "px;height:" + h + "px;" +
      "border-radius:12px;" +          // the page’s chip-radius language
      "box-shadow:0 14px 34px rgba(0,0,0,.16),0 3px 9px rgba(0,0,0,.1);" +
      "opacity:0;transform:rotate(" + cd.rot + "deg) translateY(10px);";
    const c = cv.getContext("2d");
    if(c){
      c.scale(cv.width / w, cv.height / h);
      c.fillStyle = spec.ground;
      galRR(c, 0, 0, w, h, 12, false);
      try{ cd.draw(c, w, h); }catch(err){}
    }
    galEl.appendChild(cv);
    galCards[key].push(cv);
  }
}
function galPresent(key, stagger){
  for(const k in galCards) if(k !== key)     // a swap clears the other set
    for(const el of galCards[k]){ el.style.transition = "none"; el.style.display = "none"; }
  galEl.style.display = "block";
  const set = galCards[key], spec = GAL_SETS[key];
  for(let i = 0; i < set.length; i++){
    const el = set[i], rot = "rotate(" + spec.cards[i].rot + "deg)";
    el.style.transition = "none";
    el.style.display = "block";
    if(stagger){
      el.style.opacity = "0";
      el.style.transform = rot + " translateY(10px)";
      void el.offsetWidth;               // commit the start pose
      el.style.transition =
        "opacity .26s "   + GAL_EASE + " " + (i * 80) + "ms," +
        "transform .26s " + GAL_EASE + " " + (i * 80) + "ms";
    }
    el.style.opacity = "1";
    el.style.transform = rot;
  }
  galKey = key;
}
function galShow(b){                   // ← hook target: the grab seam (floodOn)
  const key = b && GAL_SETS[b.ch] ? b.ch : "";
  if(!key){ galHide(); return; }
  if(!galEl){
    galEl = document.createElement("div");
    galEl.setAttribute("aria-hidden", "true");
    galEl.style.cssText =              // right after the flood: above it,
      "position:fixed;inset:0;pointer-events:none;display:none;";  // below the pile
    floodEl.insertAdjacentElement("afterend", galEl);
    addEventListener("resize", () => { // self-contained — dies with the block
      if(!galEl) return;
      galDirty = true;
      if(galKey){                      // resized mid-hold: rebuild in place
        const k = galKey;
        galDirty = false;
        galBuild("r1"); galBuild("iphone");
        galPresent(k, false);
      }
    });
    galBuild("r1"); galBuild("iphone");
  } else if(galDirty){
    galDirty = false;
    galBuild("r1"); galBuild("iphone");
  }
  if(key === galKey) return;           // same object re-caught: already up
  galPresent(key, true);               // a fresh set — or a swap — staggers in
}
function galHide(){                    // ← hook target: the release seam (floodOff)
  if(!galEl || !galKey) return;
  galKey = "";
  galEl.style.display = "none";        // gone WITH the flood — instantly
  for(const k in galCards)
    for(const el of galCards[k]){ el.style.transition = "none"; el.style.display = "none"; }
}

const REST_TOY   = .16;    // the toys land nearly dead — slabs, not balls
const REST_MIN   = 230;    // impacts slower than this never bounce (px/s)
const REST_AIR   = .12;    // …and only bodies airborne at least this long (s)

const MU         = .4;     // Coulomb-ish friction coefficient
const BAUM       = .2;     // position-only correction per pass (velocities never see it)
const POS_CORR   = 1;      // px cap on that correction, per contact per pass —

const ANG_DAMP   = .35;    // faint spin drag, 1/s
const SLEEP_LIN  = 9;      // px/s — under this a body counts as still
const SLEEP_ANG  = .10;    // rad/s — same idea for spin
const SLEEP_DX   = 1.5;    // px — or: barely drifted from where it settled
const SLEEP_DA   = .03;    // rad — same idea for wobble
const SLEEP_T    = .35;    // seconds of stillness before a body may sleep

const STOP_MIN_C = 2;      // contacts bracing the body before it may grip — a

                           // a settling nudge, never a visible teleport

const AUDIT_PEN  = 2;      // px of sleeper-sleeper overlap the audit unfreezes

const HULL_PX    = 128;    // size glyphs are rasterized at for tracing
const HULL_MAXV  = 12;     // max vertices kept per glyph hull
const CHAMFER    = 3;      // raster px cut from a glyph's sharpest foot so no
                           // letter balances on a mathematical point
const TOY_DENS   = 1.4;    // toys are denser than letters
const PILL_DENS  = 1.1;    // pills are lighter chips than the toys
const TAP_PX     = 8;      // pointer travel under this…
const TAP_MS     = 350;    // …and quicker than this is a tap, not a drag

/* ---- real hardware, in millimetres — on-screen scale derives from it.
   The r1 keeps the on-screen size it has always had (R1_CAP of the
   headline's cap height) and anchors the system; every other object's
   size comes off this table, so the pile sits at true relative scale
   and future objects join the same system. iPhone 17 Pro figures are
   the 2025 hardware's published 150.0 × 71.9 × 8.75 mm. (Collider
   depth ratios stay the BAKES' own measures — R1_THICK, the phone mesh
   header — so silhouettes keep matching the drawn pixels exactly.) */
const R1_MM      = { w:78,   h:78,  d:13 };     // rabbit r1
const PHONE_MM   = { w:71.9, h:150, d:8.75 };   // iPhone 17 Pro
const R1_CAP     = 1.25;                        // r1 side ÷ cap height — the anchor
const PHONE_H    = PHONE_MM.h / R1_MM.h;        // phone height ÷ r1 side ≈ 1.923

const MODEL_PAD  = 3;      // px of transparent margin a 3D toy's canvas keeps
                           // outside its model's worst-case pose — a canvas cut
                           // to the face-on size shaves the corners off every
                           // diagonal one, which is the other half of looking
                           // trapped in a box

/* ---- the grip pin: a held body stays fully dynamic, tied to the finger
   by a stiff critically-damped spring at the exact point it was caught */
const HOLD_WN    = 40;     // pin stiffness as a frequency, rad/s (~0.1s settle)
const HOLD_ZETA  = 1;      // critical damping — tight, no rubber-banding
const HOLD_MASS  = 2.5;    // a held body counts this much heavier to the pile
const HOLD_ADAMP = 2.5;    // swing-about-the-grip damping while held, 1/s
const HOLD_SUB   = 10;     // pin substeps — the stiffness stays stable at 30fps
const HOLD_ERR   = 150;    // px of pointer error the spring acts on (yank guard)
const HOLD_WMAX  = 12;     // rad/s spin cap in the hand — no helicoptering

/* ---- depth-tumble (the WebGL toys only; the flat r1 fallback has none) ---- */
const R1_THICK      = .18;   // r1 depth ÷ height — its bake spans z ±0.1814 on a 2.0 model
const R1_DAMP_AIR   = 1.6;   // tumble decay while airborne, 1/s — heavy objects
                             // spin reluctantly; a hard fling reads ~½–1 turn
const R1_DAMP_GND   = 7;     // tumble decay while touching but still sliding, 1/s
const R1_KICK_FLING = .0014; // fling speed (px/s) → tumble (rad/s)
const R1_KICK_HIT   = .0016; // impact speed (px/s) → tumble (rad/s)
const R1_KICK_MIN   = 240;   // impacts slower than this don't tumble (px/s)
const R1_KICK_AIR   = .3;    // s a party must have genuinely FLOWN before its
                             // impact may kick a tumble (a real drop, not the
                             // 15px hop of a slab's own settling rock — those
                             // hops cleared the REST_AIR bounce gate and their
                             // corner slams re-randomized an almost-finished
                             // topple every 200ms, the last of the snapping)
const R1_W_MAX      = 5.5;   // tumble speed cap, rad/s — chunky, never fluttery
const R1_DAMP_SET   = 32;    // grounded spin die-off, 1/s — with R1_FLAT_K this
                             // is the topple's critical damping (2√(2K) = 32.2):
                             // no oscillation past flat, no residual wobble,
                             // and any grounded spin dies on arrival
const R1_FLAT_K     = 130;   // how hard gravity tips a grounded slab off its
                             // edge and onto a face, 1/s². Seen from the side,
                             // a device lying on the floor shows its profile:
                             // rx = ±90° (screen-down or back-down) is where it
                             // wants to be, upright is the ridge it falls off.
                             // Sized so a 45°-off landing is visibly flat in
                             // ~0.25s and dead in ~0.4 — a heavy slab tips
                             // DECISIVELY (11 was a seconds-long crawl that
                             // read as weightless magic)
const R1_FLAT_NUDGE = 12;    // 1/s² — breaks a perfect edge balance (scaled
                             // with K so the push off the ridge stays decisive)
const R1_FLAT_EPS   = .045;  // rad — how square to a face before it may rest
const R1_GND_V      = 110;   // px/s — slower than this while touching counts as
                             // grounded: the topple engages while the slide is
                             // still dying, so the tip reads as one motion
                             // (was 90: a landing that kept corner-walking at
                             // ~100px/s held its topple off for half a second)
const R1_COMMIT     = 1.5;   // rad/s — grounded tumble momentum past this
                             // COMMITS the topple to the face AHEAD in the
                             // direction of travel, chosen once per landing
                             // and held until that axis reaches its face or
                             // the body leaves the ground. The nearest-face
                             // pull alone flipped targets the instant a
                             // landing crossed the halfway ridge — the object
                             // visibly reversed and re-toppled the other way,
                             // the snap. A commit finishes the motion the
                             // object already has; spin below this is not
                             // real motion and is GRIPPED to zero at the
                             // topple's engage (and on sub-threshold kicks),
                             // so every turn is either a committed ride or a
                             // from-rest tip toward the nearest face — and
                             // neither can ever reverse mid-way
const R1_GRIP_T     = .07;   // s a gripped axis holds its pose before weight
                             // may tip it onward — the beat between "friction
                             // caught it" and "gravity wins". Without the
                             // dwell a grip and the from-rest tip shared one
                             // frame, and a skid's dying outbound drift read
                             // as instantly reversing — a stop the eye (and
                             // a 30Hz display) never got to see
const FACE_WN       = 15;    // rad/s — the pickup spring that turns a held toy
                             // to face the viewer (screen out, the showcase
                             // pose): critically damped, zero overshoot, and
                             // deliberately unhurried — a catch off a settled
                             // sliver (90° away) reads ≤3° at ~350ms, a
                             // back-on catch at ~400ms. The object is TURNED
                             // in the hand; 32 snapped square in a quarter
                             // second and read as a flick, not a wrist
const R1_WAKE_DW    = 3;     // px of hull GROWTH a toy may accumulate before it
                             // tells the sleepers around it. The hull itself is
                             // re-cut every single frame — a dozen verts are
                             // free, and a collider that lags the pose is the
                             // container the toys looked stuck in. What is not
                             // free is the SIDE EFFECT: a fattening hull wakes
                             // its neighbours, and doing that every frame is the
                             // old sleep-wake metronome. So growth accumulates
                             // here and only crossing it notifies anyone.
                             // Shrinking wakes no one, ever.
const R1_CHAMFER    = .3;    // of each silhouette edge, the most its corner may
                             // be cut back — at .3 a face-on slab comes out as
                             // exactly the octagon the toys always had, so
                             // nothing about a toy at rest changes
const R1_PIVOT_MAX  = 8;     // px one re-cut may drop a grounded toy so the
                             // silhouette's foot stays on the floor: a slab
                             // toppling onto its face pivots ON the contact — it
                             // does not shrink away from the floor and then fall
                             // back to it. Sized for the decisive topple (the
                             // phone's silhouette can shed ~10px a frame at the
                             // tip's fastest) — the correction hides inside that
                             // motion, and gravity closes whatever is left over.

let mode = "seated";    // seated | live | homing   (letters + pills — toys never seat)
let raf = 0, lastT = 0;
let held = null, pointerId = null;
let grabLX = 0, grabLY = 0;   // the grip anchor in BODY space — the exact caught point
let tap = null;         // pill press bookkeeping — a short, still press activates
let spilled = false;
const target = { x:0, y:0 };
const samples = [];
let gravX = 0, gravY = G;   // gravity vector — device tilt may rotate it; |g| stays G

function seatRect(i){ return seats[i].getBoundingClientRect(); }

/* ================================================================
   Glyph hulls — each unique character is rasterized once at 128px,
   its silhouette convex-hulled (Andrew's monotone chain), thinned
   to a dozen vertices, and kept in em units relative to the pen
   origin + baseline so it can be scaled to whatever size the
   headline happens to render at.
   ================================================================ */
const FONT_STACK = '"KMR Apparat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';

/* the weight the hulls are traced at — matches the headline's rendered
   400; only the #dev lab may retune it (and it retraces when it does) */
let FONT_WT = "400";
const UNIQUE = [...new Set("michaelmofina")];
const HCW = 192, HCH = 208, HPX = 28, HBY = 156;   // canvas, pen x, baseline y
const hullCanvas = document.createElement("canvas");
hullCanvas.width = HCW; hullCanvas.height = HCH;
const hctx = hullCanvas.getContext("2d", { willReadFrequently:true });
const HULLS = {};          // char -> vertices in em units, y negative above baseline
let baselineEm = .875;     // where the baseline sits inside a line-height:1 box
let hullsBuilt = false;

function cross3(ox, oy, ax, ay, bx, by){
  return (ax - ox) * (by - oy) - (ay - oy) * (bx - ox);
}

function convexHull(pts){
  pts.sort((p, q) => p.x - q.x || p.y - q.y);
  if(pts.length < 3) return pts.slice();
  const lo = [];
  for(const p of pts){
    while(lo.length >= 2 && cross3(lo[lo.length-2].x, lo[lo.length-2].y,
          lo[lo.length-1].x, lo[lo.length-1].y, p.x, p.y) <= 0) lo.pop();
    lo.push(p);
  }
  const hi = [];
  for(let i = pts.length - 1; i >= 0; i--){
    const p = pts[i];
    while(hi.length >= 2 && cross3(hi[hi.length-2].x, hi[hi.length-2].y,
          hi[hi.length-1].x, hi[hi.length-1].y, p.x, p.y) <= 0) hi.pop();
    hi.push(p);
  }
  lo.pop(); hi.pop();
  return lo.concat(hi);
}

/* thin the hull to maxN verts, but never remove the extremes —
   the true bottom of the glyph must survive or floors would lie */
function simplifyHull(h, maxN){
  while(h.length > maxN){
    let loI = 0, hiI = 0, leI = 0, riI = 0;
    for(let i = 1; i < h.length; i++){
      if(h[i].y > h[loI].y) loI = i;
      if(h[i].y < h[hiI].y) hiI = i;
      if(h[i].x < h[leI].x) leI = i;
      if(h[i].x > h[riI].x) riI = i;
    }
    let bi = -1, ba = Infinity;
    for(let i = 0; i < h.length; i++){
      if(i === loI || i === hiI || i === leI || i === riI) continue;
      const p = h[(i + h.length - 1) % h.length], c = h[i], n = h[(i + 1) % h.length];
      const a = Math.abs(cross3(p.x, p.y, c.x, c.y, n.x, n.y));
      if(a < ba){ ba = a; bi = i; }
    }
    if(bi < 0) break;
    h.splice(bi, 1);
  }
  return h;
}

function signedArea(v){
  let a = 0;
  for(let i = 0; i < v.length; i++){
    const j = (i + 1) % v.length;
    a += v[i].x * v[j].y - v[j].x * v[i].y;
  }
  return a * .5;
}

/* a glyph whose hull ends in a near-point foot (i, a, e, f, l…) balances
   on a mathematical vertex and rocks forever; cut the deepest vertex
   into a CHAMFER-wide flat so it lands on a foot, not a needle */
function chamferFoot(h){
  if(h.length < 3) return h;
  let bi = 0;
  for(let i = 1; i < h.length; i++) if(h[i].y > h[bi].y) bi = i;
  const p = h[(bi + h.length - 1) % h.length];
  const c = h[bi];
  const n = h[(bi + 1) % h.length];
  // a foot that already sits on a near-flat bottom edge needs nothing
  if(c.y - p.y < CHAMFER || c.y - n.y < CHAMFER) return h;
  const cut = q => {
    const dx = q.x - c.x, dy = q.y - c.y;
    const k = Math.min(CHAMFER / (Math.hypot(dx, dy) || 1), .45);
    return { x: c.x + dx * k, y: c.y + dy * k };
  };
  h.splice(bi, 1, cut(p), cut(n));   // order keeps the winding intact
  return h;
}

function extractHull(ch){
  hctx.clearRect(0, 0, HCW, HCH);
  hctx.font = FONT_WT + " " + HULL_PX + "px " + FONT_STACK;
  hctx.textBaseline = "alphabetic";
  hctx.fillStyle = "#000";
  hctx.fillText(ch, HPX, HBY);
  const img = hctx.getImageData(0, 0, HCW, HCH).data;
  const pts = [];
  for(let y = 0; y < HCH; y++){
    let lo = -1, hi = -1;
    for(let x = 0; x < HCW; x++){
      if(img[(y * HCW + x) * 4 + 3] > 12){ if(lo < 0) lo = x; hi = x; }
    }
    if(lo >= 0){
      // pixel corners, so the hull covers the ink to its outermost edge
      pts.push({x:lo, y}, {x:hi + 1, y}, {x:lo, y:y + 1}, {x:hi + 1, y:y + 1});
    }
  }
  if(!pts.length) return null;
  // simplify one short of the budget: the foot chamfer may add a vertex
  const h = simplifyHull(convexHull(pts), HULL_MAXV - 1);
  if(signedArea(h) < 0) h.reverse();   // keep positive winding (outward normals)
  chamferFoot(h);
  return h.map(p => ({ x:(p.x - HPX) / HULL_PX, y:(p.y - HBY) / HULL_PX }));
}

function buildHulls(){
  hctx.font = FONT_WT + " " + HULL_PX + "px " + FONT_STACK;
  const m = hctx.measureText("mh");
  const asc  = (m.fontBoundingBoxAscent  || HULL_PX * .76) / HULL_PX;
  const desc = (m.fontBoundingBoxDescent || HULL_PX * .24) / HULL_PX;
  // line-height:1 → half-leading centres the font box in the em box
  baselineEm = (1 - (asc + desc)) / 2 + asc;
  for(const ch of UNIQUE){
    let h = null;
    try{ h = extractHull(ch); }catch(err){ h = null; }
    if(h && h.length >= 3){ HULLS[ch] = h; }
    else{
      // the canvas said nothing (blocked pixels, exotic env):
      // a plain x-height box is a liveable stand-in
      const w = Math.max(.2, hctx.measureText(ch).width / HULL_PX);
      HULLS[ch] = [ {x:0, y:-.68}, {x:w, y:-.68}, {x:w, y:0}, {x:0, y:0} ];
    }
  }
  hullsBuilt = true;
}

/* ---- rigid bodies ---- */
const bodies = [];                 // 13 letters first; pills and toys join later
const bodyByEl = new Map();
let bodySeq = 0;                   // stable ids — the warm-start pair key

function mkBody(el, kind){
  const b = {
    el, kind, i:-1, ch:"", id:bodySeq++,
    x:0, y:0, a:0,               // centroid position + angle
    vx:0, vy:0, va:0,            // linear + angular velocity
    m:1, invM:1, I:1, invI:1,    // mass + moment of inertia about the centroid
    iM:0, iI:0,                  // effective inverse masses this frame (0 = immovable)
    cx:0, cy:0,                  // where the centroid sits inside the element's box
    nv:0, lv:[], wv:[],          // hull: local verts + world verts (preallocated)
    rad:20,                      // bounding radius about the centroid
    minx:0, miny:0, maxx:0, maxy:0,   // world AABB for the broadphase
    sleeping:false, still:0, sx:0, sy:0, sa:0, touch:0,
    fpx:0, fpy:0,                // last frame's pose — the sleep-frame move gate
    rest: kind === "toy" ? REST_TOY : REST_PAPER,   // per-kind bounce
    airT:9,                      // seconds since last contact (starts airborne)
    wstill:0, qx:0, qy:0, qa:0,  // drift-window stillness clock + its anchor
    sleptAt:-1e9,                // when it last fell asleep (wake hysteresis)
    penT:0, penDeep:0, penF:0,   // deep-pen stint clock + clean-streak timer
    supN:0, supLo:0, supHi:0,    // this frame's supporting contacts + their span
    cn:0, qj:0,                  // substep contact count + the frame's summed
                                 // contact-impulse change — the static stop's
                                 // bracing and quietness gates
    pinx:0, piny:0,              // plane(s) this substep's position passes had
                                 // to press it out of (squeeze propagation)
    awN:0, awX:0, awY:0,         // audit-wake counter — truly wedged pairs are
                                 // poked a few times, then left in peace
    bi:0,                        // index in bodies[] this frame (island scratch)
    isl:-1,                      // id of the island it fell asleep with
    canSleep:0,                  // passed its member stillness test this frame
    defN:0, defT:0, kx:0, ky:0,  // island-freeze deferrals (count + first-defer
                                 // time) + pre-snap pose
    homeDelay:0, homed:true, dropAt:0,
    entering:false,              // toys fall in from above the ceiling plane
    draw3d:null,                 // a WebGL toy hangs its painter here
    tumbles:false,               // a 3D toy carries real depth-tumble state:
    rx:0, ry:0, wx:0, wy:0,      //   pitch/yaw + angular velocities (rad, rad/s)
    tgtRx:NaN, tgtRy:NaN,        //   committed topple target per axis (NaN:
                                 //   nearest-face; set once per landing)
    dwX:0, dwY:0,                //   grip dwell per axis — a beat of held pose
                                 //   between the grip and the onward tip
    gnd:0,                       //   was grounded last tumble step (the topple-
                                 //   engage edge runs the momentum census)
    poseCalm:true, lastKick:0,   //   settled flag + impact-kick rate limiter
    thick3d:0,                   //   depth ÷ height, per model (r1 ≠ iPhone)
    toyW:0, toyH:0, toyCut:0,    // the face-on toy box…
    hullW:0, hullH:0,            //   …the box of the silhouette cut from it
    hullRx:NaN, hullRy:NaN,      //   …the pose that cut was made at (NaN: never)
    hullGrow:0,                  //   …and the growth not yet told to sleepers
    label:"",                    // what it says when picked up (toys only)
  };
  for(let i = 0; i < HULL_MAXV; i++){ b.lv.push({x:0, y:0}); b.wv.push({x:0, y:0}); }
  bodyByEl.set(el, b);
  return b;
}

letters.forEach((el, i) => {
  const b = mkBody(el, "letter");
  b.i = i; b.ch = el.textContent;
  bodies.push(b);
});

function wake(b){
  b.sleeping = false; b.penT = 0; b.isl = -1; b.defN = 0;
  b.still = 0;  b.sx = b.x; b.sy = b.y; b.sa = b.a;
  b.wstill = 0; b.qx = b.x; b.qy = b.y; b.qa = b.a;
}
function wakeAll(){ for(const b of bodies) wake(b); }

/* bodies sleep in islands (whole contact clusters, below) and they wake
   the same way: waking any member wakes everyone it fell asleep with, so
   neighbors can never trade sleep out of phase and pop each other awake.
   `keep` carries the impact-wake hysteresis to the whole island: gently
   woken members keep their still progress and re-sleep in WAKE_REST. */
function wakeIsland(b, keep){
  if(!b.sleeping || b.isl < 0){
    wake(b);
    if(keep) b.still = Math.max(0, SLEEP_T - WAKE_REST);
    return;
  }
  const gid = b.isl;
  for(const o of bodies){
    if(!o.sleeping || o.isl !== gid) continue;
    wake(o);
    if(keep) o.still = Math.max(0, SLEEP_T - WAKE_REST);
  }
}

/* pull a body out of the world entirely — the shake pill once tilt is
   armed, or a 3D toy whose GL context died. The element goes with it;
   everyone is woken so nothing keeps resting on a memory. */
function removeBody(b){
  if(held === b){                      // pried out of a hand: let go cleanly
    removeEventListener("pointermove", onMove);
    removeEventListener("pointerup", onUp);
    removeEventListener("pointercancel", onUp);
    document.body.classList.remove("grabbing");
    pointerId = null;
    held = null;
    tap = null;
    if(b.kind === "toy"){ hideCaption(); floodOff(); }  // pried out of the hand
  }                                       // still fades its name out normally
  const k = bodies.indexOf(b);
  if(k >= 0) bodies.splice(k, 1);
  bodyByEl.delete(b.el);
  b.el.remove();
  wakeAll();
  start();
}

/* ---- polygon mass properties: area, centroid, inertia about it ---- */
const geomOut = { area:1, cx:0, cy:0, I:1 };
function polyProps(v, n, dens){
  let A = 0, cx = 0, cy = 0;
  for(let i = 0; i < n; i++){
    const j = (i + 1) % n;
    const cr = v[i].x * v[j].y - v[j].x * v[i].y;
    A += cr; cx += (v[i].x + v[j].x) * cr; cy += (v[i].y + v[j].y) * cr;
  }
  A *= .5;
  const inv6A = 1 / (6 * A);
  cx *= inv6A; cy *= inv6A;
  let I = 0;
  for(let i = 0; i < n; i++){
    const j = (i + 1) % n;
    const x1 = v[i].x - cx, y1 = v[i].y - cy;
    const x2 = v[j].x - cx, y2 = v[j].y - cy;
    const cr = x1 * y2 - x2 * y1;
    I += cr * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
  }
  geomOut.area = Math.abs(A);
  geomOut.cx = cx; geomOut.cy = cy;
  geomOut.I = Math.max(1, Math.abs(I) * dens / 12);
  return geomOut;
}

const geomTmp = [];
for(let i = 0; i < HULL_MAXV; i++) geomTmp.push({x:0, y:0});

function fontPx(){
  return parseFloat(getComputedStyle(visname).fontSize) || 64;
}

/* scale a letter's unit hull to the rendered font size, in box coords,
   then re-express it about the centroid. An 'l' spins about its stem,
   not about the empty middle of its span. */
function setLetterGeometry(b, F){
  const unit = HULLS[b.ch];
  if(!unit) return;
  const n = Math.min(unit.length, HULL_MAXV);
  const bl = baselineEm * F;                 // baseline y inside the span box
  for(let i = 0; i < n; i++){
    geomTmp[i].x = unit[i].x * F;
    geomTmp[i].y = bl + unit[i].y * F;
  }
  const g = polyProps(geomTmp, n, 1);
  b.nv = n; b.cx = g.cx; b.cy = g.cy;
  b.m = Math.max(40, g.area); b.invM = 1 / b.m;
  b.I = g.I; b.invI = 1 / b.I;
  let r = 0;
  for(let i = 0; i < n; i++){
    b.lv[i].x = geomTmp[i].x - g.cx;
    b.lv[i].y = geomTmp[i].y - g.cy;
    r = Math.max(r, Math.hypot(b.lv[i].x, b.lv[i].y));
  }
  b.rad = r;
}

function refreshGeometry(){
  if(!hullsBuilt) buildHulls();
  const F = fontPx();
  for(const b of bodies) if(b.kind === "letter") setLetterGeometry(b, F);
}

/* ---- go live: letters leave the text flow and take physics state ---- */
function goLive(){
  if(mode !== "seated") return;
  if(innerWidth < 10 || innerHeight < 10){   // collapsed viewport: try again soon
    fallTimer = setTimeout(goLive, 500);
    return;
  }
  // Kill any still-running entrance animation NOW: a filled transform
  // animation would make an ancestor the containing block for the
  // letters' position:fixed. (They stay in the DOM so they keep
  // inheriting the headline's font size.)
  document.querySelectorAll(".fade").forEach(el => { el.style.animation = "none"; });
  const name = document.getElementById("name");
  const row  = document.getElementById("pillrow");
  name.style.height = name.getBoundingClientRect().height + "px"; // keep hero layout
  row.style.height  = row.getBoundingClientRect().height + "px";  // …row included
  refreshGeometry();                          // hulls at the rendered size
  const now = performance.now();
  for(const b of bodies){
    if(b.kind === "letter"){
      const r = b.el.getBoundingClientRect();
      b.x = r.left + b.cx;                      // the body lives at the glyph's
      b.y = r.top + b.cy;                       // centroid, not the box centre
      b.vx = (Math.random() - .5) * 60;         // a whisper of sideways drift
      b.vy = 0;
      b.a = 0;
      b.va = (Math.random() - .5) * 2.4;
      b.homed = false;
      b.airT = 9;                               // airborne again — may bounce
      b.dropAt = now + b.i * 26 + Math.random() * 90;  // ragged, not synchronized
    } else if(b.kind === "pill"){
      const r = b.el.getBoundingClientRect();
      // a pill is a rounded-rect chip: octagon cut at 3/4 of the painted
      // corner radius (the CSS 999px resolves to half the short side)
      const br = Math.min(parseFloat(getComputedStyle(b.el).borderRadius) || 0,
                          r.height / 2, r.width / 2);
      setSlabGeometry(b, r.width, r.height, br * .75, PILL_DENS);
      b.el.style.width = r.width + "px";        // frozen box: the copy
      b.el.style.height = r.height + "px";      // confirmation can't reflow it
      b.x = r.left + b.cx;
      b.y = r.top + b.cy;
      b.vx = (Math.random() - .5) * 60;
      b.vy = 0;
      b.a = 0;
      b.va = (Math.random() - .5) * 1.6;        // chips spin a touch less
      b.homed = false;
      b.airT = 9;                               // airborne again — may bounce
      b.dropAt = now + Math.random() * 380;     // inside the letters' ragged window
    }
  }
  for(const b of bodies)
    if(b.kind === "letter" || b.kind === "pill") b.el.classList.add("live");
  mode = "live";
  spilled = true;
  wakeAll();       // toys under the raining letters must notice
  render(now);     // position synchronously — no one-frame flash at the origin
  start();
}

/* the fall begins once the name has had a moment to be read */
let fallTimer = setTimeout(goLive, 1400);

/* if the first hull pass measured the fallback face, retrace once the
   real font arrives; live bodies pick up the corrected outlines */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    buildHulls();
    if(mode !== "seated"){ refreshGeometry(); wakeAll(); start(); }
  }).catch(() => {});
}

/* ---- grab / drag / fling ---- */
function pushSample(e){
  const t = performance.now();
  samples.push({ x:e.clientX, y:e.clientY, t });
  while(samples.length && t - samples[0].t > 110) samples.shift();
}
function onDown(e){
  let el = e.target.closest
    ? (e.target.closest(".letter.live") || e.target.closest(".pill.live") ||
       e.target.closest(".toy")) : null;
  if(!el && mode === "seated" && e.target.closest &&
     e.target.closest("#visname .letter")){
    clearTimeout(fallTimer);                     // grabbing the seated name spills the
    goLive();                                    // page; seated pills stay pure buttons
    el = e.target.closest("#visname .letter");
  }
  if(!el) return;
  const b = bodyByEl.get(el);
  if(!b) return;
  if(mode === "homing" && b.kind !== "toy"){
    // snatching a body mid-homecoming cancels the reassembly — everything
    // resumes live physics from exactly where it is right now
    mode = "live";
    for(const o of bodies){
      if(o.kind === "toy") continue;
      o.homed = false;
      o.dropAt = 0;
    }
  }
  if(b.kind !== "toy" && mode === "live") b.dropAt = 0;  // a grabbed body falls now
  if(held && held !== b) held.el.classList.remove("held");  // a second-finger steal:
  held = b;                                                 // the first body is no
  held.el.classList.add("held");                            // longer in any hand
  if(b.kind === "toy"){
    showCaption(b.label);                      // objects name themselves…
    floodOn(b.flood);                          // …and bring their world with them
  } else {
    hideCaption();                             // a second finger on a letter ends it
    floodOff();
  }
  // the grip is a pin: keep the caught point in body space, so the body
  // hangs, swings and is pushed about that exact point — never its centre
  {
    const gx = e.clientX - b.x, gy = e.clientY - b.y;
    const c0 = Math.cos(b.a), s0 = Math.sin(b.a);
    grabLX =  c0 * gx + s0 * gy;         // R(-angle) · (grip − centroid)
    grabLY = -s0 * gx + c0 * gy;
  }
  // a press on a pill might be a tap: remember where and when it began
  tap = b.kind === "pill"
    ? { b, t:performance.now(), x:e.clientX, y:e.clientY, path:0 }
    : null;
  pointerId = e.pointerId;
  samples.length = 0;
  pushSample(e);
  target.x = e.clientX; target.y = e.clientY;   // the pin chases the finger itself
  document.body.classList.add("grabbing");
  wakeAll();                                   // a hand in the pile disturbs everything
  addEventListener("pointermove", onMove);
  addEventListener("pointerup", onUp);
  addEventListener("pointercancel", onUp);
  e.preventDefault();
  start();
}
function onMove(e){
  if(e.pointerId !== pointerId) return;
  target.x = e.clientX; target.y = e.clientY;
  pushSample(e);
  if(tap){                                   // total travel, not net displacement
    tap.path += Math.hypot(e.clientX - tap.x, e.clientY - tap.y);
    tap.x = e.clientX; tap.y = e.clientY;
  }
}
function onUp(e){
  if(e.pointerId !== pointerId) return;
  removeEventListener("pointermove", onMove);
  removeEventListener("pointerup", onUp);
  removeEventListener("pointercancel", onUp);
  document.body.classList.remove("grabbing");
  pointerId = null;
  if(held){
    const a = samples[0], b = samples[samples.length - 1];
    if(a && b && b.t - a.t > 15){
      const dt = (b.t - a.t) / 1000;
      held.vx = (b.x - a.x) / dt;
      held.vy = (b.y - a.y) / dt;
      const sp = Math.hypot(held.vx, held.vy);
      if(sp > MAXV){ held.vx *= MAXV / sp; held.vy *= MAXV / sp; }
      // angular velocity is left alone — the body leaves the hand
      // with whatever spin the pin dynamics actually gave it
    }
    if(held.tumbles){
      // a thrown r1 leaves the hand tumbling — mostly yaw for a sideways
      // throw, mostly pitch for a vertical one, capped so it never looks
      // frantic (a full-speed fling is about one turn in the air)
      const sp = Math.hypot(held.vx, held.vy);
      if(sp > 60){
        const k = Math.min(R1_W_MAX, sp * R1_KICK_FLING);
        held.wy = clampW(rspin() * k * (.3 + .7 * Math.abs(held.vx) / sp));
        held.wx = clampW(rspin() * k * (.3 + .7 * Math.abs(held.vy) / sp) * .85);
        held.poseCalm = false;
      }
    }
    // a press that never really moved and ended quickly is a tap — the
    // pill acts; anything longer or farther was a drag and must not
    const wasTap = tap && tap.b === held && e.type === "pointerup" &&
                   tap.path <= TAP_PX && performance.now() - tap.t < TAP_MS;
    held.el.classList.remove("held");
    hideCaption();                             // …and let go of the name too
    floodOff();                                // the page comes back
                                               // (unconditional: a stolen grab
                                               // must never strand the label)
    wake(held);
    held = null;
    if(wasTap) activatePill(tap.b);
  }
  tap = null;
  start();
}
addEventListener("pointerdown", onDown);

/* what each pill does when tapped (or, seated, natively clicked) */
function activatePill(b){
  if(b.el.id === "shake") armTilt();
}

/* while a pill is physics, its native click must never fire — taps are
   resolved by hand above, and a drag that ends on the element would
   otherwise still navigate (pointer capture keeps the click on it) */
function pillClickGuard(e){
  if(this.classList.contains("live")){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}

/* ================================================================
   Tilt the world — on touch devices the phone's orientation rotates
   gravity itself, so the pile slides along the floor into a corner
   like beads in a box. Armed inside the first pointerdown (iOS only
   grants motion permission during a gesture; everyone else just gets
   the listener). Desktop never prompts, denial is silently accepted,
   and reduced-motion never even reaches this code — the whole IIFE
   returned long ago.
   ================================================================ */
const hasTouch = (navigator.maxTouchPoints || 0) > 0 ||
                 matchMedia("(pointer: coarse)").matches;
let tiltArmed = false;
let tiltDX = 0, tiltDY = 1;      // smoothed gravity direction (≈ unit)
let wakeDX = 0, wakeDY = 1;      // direction the pile last settled under
let devGamma = 0;                // smoothed roll, borrowed for the r1's idle sway
const WAKE_DOT = Math.cos(4 * Math.PI / 180);
const TILT_PIVOT = 25 * Math.PI / 180;  // neutral pitch — phones are held, not laid flat:
const TILT_GAIN  = 1.4;                 // ~50° hold reads as gentle down; ~45° back-tilt
                                        // from the hand swings gravity into reverse.
                                        // (Pivot applies to device pitch — tuned for
                                        // portrait, the way phones are actually held.)

function onTilt(e){
  if(e.beta == null || e.gamma == null) return;
  const beta  = e.beta  * Math.PI / 180;
  const gamma = e.gamma * Math.PI / 180;
  devGamma += (gamma - devGamma) * .15;
  // re-centered pitch: subtract the natural holding angle, amplify a touch
  let be = (beta - TILT_PIVOT) * TILT_GAIN;
  be = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, be));
  // in-plane gravity in portrait device coords (screen y down):
  // g_device = (cosβ'·sinγ, sinβ') of a unit earth-gravity vector
  let gx = Math.cos(be) * Math.sin(gamma);
  let gy = Math.sin(be);
  // …rotated into page coords when the UI is in landscape
  const ang = (screen.orientation && typeof screen.orientation.angle === "number")
    ? screen.orientation.angle
    : (typeof window.orientation === "number" ? window.orientation : 0);
  if(ang){
    const ar = ang * Math.PI / 180, ca = Math.cos(ar), sa = Math.sin(ar);
    const px = gx * ca + gy * sa, py = gy * ca - gx * sa;
    gx = px; gy = py;
  }
  const m = Math.hypot(gx, gy);
  // a phone lying nearly flat has no in-plane pull — level means down
  const dx = m < .15 ? 0 : gx / m;
  const dy = m < .15 ? 1 : gy / m;
  tiltDX += (dx - tiltDX) * .15;   // low-pass so the pile doesn't buzz
  tiltDY += (dy - tiltDY) * .15;
  const n = Math.hypot(tiltDX, tiltDY) || 1;
  gravX = G * tiltDX / n;          // magnitude stays exactly G
  gravY = G * tiltDY / n;
  // sleepers only stir once the world has genuinely turned (~4°)
  if((tiltDX * wakeDX + tiltDY * wakeDY) / n < WAKE_DOT){
    wakeDX = tiltDX / n; wakeDY = tiltDY / n;
    wakeAll();
    start();
  }
}

function armTilt(){
  if(tiltArmed || !hasTouch || typeof DeviceOrientationEvent === "undefined")
    return;
  tiltArmed = true;
  const done = ok => {
    if(ok) addEventListener("deviceorientation", onTilt);
    if(shakeBtn){                    // the button's job is over either way
      shakeBtn.classList.add("gone");
      shakeBtn.disabled = true;
      setTimeout(() => {             // after the fade, leave no trace: the
        const b = bodyByEl.get(shakeBtn);      // body, the element, the seat
        if(b) removeBody(b);
        else shakeBtn.remove();
        if(ghostShake) ghostShake.hidden = true;
      }, 400);
    }
  };
  const ask = DeviceOrientationEvent.requestPermission;
  if(typeof ask === "function"){
    ask.call(DeviceOrientationEvent)
      .then(state => done(state === "granted"))
      .catch(() => done(false));     // denied or frame-blocked: gravity stays down
  } else {
    done(true);
  }
}

/* "Shake it up" — motion is opt-in via an explicit tap, never a surprise
   permission prompt. The button only exists where tilt could work. */
const shakeBtn = document.getElementById("shake");
if(shakeBtn && hasTouch && typeof DeviceOrientationEvent !== "undefined"){
  shakeBtn.hidden = false;
  shakeBtn.addEventListener("click", () => {   // live taps arm via activatePill
    if(!shakeBtn.classList.contains("live")) armTilt();
  });
}

/* ================================================================
   Pills — the two chips under the name are rigid bodies too. They
   spill with the letters, drag and fling like them, and home to
   seats kept by ghost clones (a hidden shake pill's clone stays
   hidden with it, so the row's twin always lays out like the real
   one). Seated, they are plain links and buttons again; the corner
   wayfinding never falls. Reduced motion never reaches this code —
   the IIFE returned long ago.
   ================================================================ */
const pillEls = [ shakeBtn ];          // the only chip that falls; everything
                                       // else is static wayfinding in the corner
const grow    = document.getElementById("grow");
let ghostShake = null;
pillEls.forEach((el, k) => {
  const c = el.cloneNode(true);        // the ghost twin gains a pill clone
  c.removeAttribute("id");
  grow.appendChild(c);
  seats.push(c);                       // seatRect(i) now answers for pills too
  if(el === shakeBtn) ghostShake = c;
  el.addEventListener("click", pillClickGuard);
  if(el.hidden) return;                // no body for a pill that isn't shown
  const b = mkBody(el, "pill");
  b.i = letters.length + k;            // seats[13..14], a gap where a pill hides
  bodies.push(b);                      // geometry arrives at goLive, measured
});

/* ---- home: the name puts itself back together (letters only) ---- */
function goHome(){
  if(mode === "seated" || mode === "homing") return;
  clearTimeout(fallTimer);
  if(held && held.kind !== "toy"){             // the hand lets go of homers;
    held.el.classList.remove("held");          // a held toy stays held
    held = null;
    tap = null;
    if(pointerId !== null){
      removeEventListener("pointermove", onMove);
      removeEventListener("pointerup", onUp);
      removeEventListener("pointercancel", onUp);
      document.body.classList.remove("grabbing");
      pointerId = null;
    }
  }
  const now = performance.now();
  const TAU = Math.PI * 2;
  for(const b of bodies){
    if(b.kind === "toy") continue;
    b.homeDelay = now + b.i * 35;         // pills trail in after the last letter
    b.homed = false;
    b.a -= Math.round(b.a / TAU) * TAU;   // untwist the short way, not N full turns
  }
  wakeAll();          // toys must notice their bed of letters leaving
  mode = "homing";
  start();
}
function seatAll(){
  mode = "seated";
  for(const b of bodies){
    if(b.kind === "toy") continue;
    b.el.classList.remove("live");
    b.el.style.transform = "";
    if(b.kind === "pill"){ b.el.style.width = ""; b.el.style.height = ""; }
  }
  // nothing ever left its parent — dropping .live restores text flow, and
  // the pills are genuine focusable links and buttons again
  document.getElementById("name").style.height = "";
  document.getElementById("pillrow").style.height = "";
}
addEventListener("keydown", e => { if(e.key === "Escape") goHome(); });
// double-click reassembles the scene — but never from inside the open
// menu, where a double-click is just enthusiasm for a link
addEventListener("dblclick", goHome);

/* ================================================================
   Contacts — AABB broadphase, SAT narrowphase with reference-face
   clipping (up to two contact points per pair), then a small
   sequential-impulse solver with rotation, friction, warm-started
   impulses (matched across frames by body pair + feature id) and
   split-impulse positional cleanup: penetration is resolved by pure
   position projection that never feeds the velocities, so piles rest
   without buzzing. Everything below reuses preallocated objects; the
   hot loop allocates nothing.
   ================================================================ */
const contacts = [];
for(let i = 0; i < 256; i++){
  contacts.push({ a:null, b:null, px:0, py:0, nx:0, ny:0, pen:0, pen0:0, fid:0,
                  warm:-1, rax:0, ray:0, rbx:0, rby:0, mN:1, mT:1, bias:0, jn:0, jt:0,
                  jn0:0, jt0:0 });
}
let nContacts = 0;

/* last frame's impulses, keyed by (body id, body id, feature id) — and,
   when ids churn, by where the contact point actually was: each frame's
   solve starts where the last one ended instead of from zero, so stacks
   converge instead of re-shuddering every frame */
const prevA = new Int32Array(256), prevB = new Int32Array(256),
      prevF = new Int32Array(256);
const prevJn = new Float64Array(256), prevJt = new Float64Array(256);
const prevPX = new Float64Array(256), prevPY = new Float64Array(256);
const prevUsed = new Uint8Array(256);
let nPrev = 0;
let frameN = 0;                // frame counter — schedules the support audit

/* contact islands — union-find scratch over bodies[] indices, preallocated.
   Sleep is an island decision: a whole touching cluster freezes as one or
   not at all, so no member can ever sleep out of phase with a neighbor. */
const islP     = new Int32Array(ISL_MAXB);   // union-find parent per slot
const islStill = new Uint8Array(ISL_MAXB);   // every awake member still?
const islTried = new Uint8Array(ISL_MAXB);   // island already handled this frame
let islandSeq = 0;                           // ids stamped on sleeping islands
function islFind(i){
  while(islP[i] !== i){ islP[i] = islP[islP[i]]; i = islP[i]; }
  return i;
}

let gPerpX = -1, gPerpY = 0;   // unit vector across gravity (support widths)

function addContact(A, B, px, py, nx, ny, pen, fid){
  if(nContacts >= contacts.length) return;
  const c = contacts[nContacts++];
  c.a = A; c.b = B; c.px = px; c.py = py; c.nx = nx; c.ny = ny;
  c.pen = pen; c.fid = fid; c.jn = 0; c.jt = 0; c.warm = -1;
  c.jn0 = 0; c.jt0 = 0;    // a brand-new contact's whole impulse counts as change
}

function updateWorld(b){
  const s = Math.sin(b.a), c = Math.cos(b.a);
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for(let i = 0; i < b.nv; i++){
    const wx = b.x + b.lv[i].x * c - b.lv[i].y * s;
    const wy = b.y + b.lv[i].x * s + b.lv[i].y * c;
    b.wv[i].x = wx; b.wv[i].y = wy;
    if(wx < minx) minx = wx; if(wx > maxx) maxx = wx;
    if(wy < miny) miny = wy; if(wy > maxy) maxy = wy;
  }
  b.minx = minx; b.miny = miny; b.maxx = maxx; b.maxy = maxy;
}

/* SAT: the least-overlapped face of A against B (positive = separated) */
const satRes = { sep:0, edge:0 };
function maxSeparation(A, B){
  let best = -1e9, bestE = 0;
  for(let i = 0; i < A.nv; i++){
    const j = (i + 1) % A.nv;
    const ex = A.wv[j].x - A.wv[i].x, ey = A.wv[j].y - A.wv[i].y;
    const il = 1 / (Math.hypot(ex, ey) || 1);
    const nx = ey * il, ny = -ex * il;        // outward for our winding
    let minD = 1e9;
    for(let k = 0; k < B.nv; k++){
      const d = (B.wv[k].x - A.wv[i].x) * nx + (B.wv[k].y - A.wv[i].y) * ny;
      if(d < minD) minD = d;
    }
    if(minD > best){ best = minD; bestE = i; }
  }
  satRes.sep = best; satRes.edge = bestE;
}

/* what incident edge did this pair use last frame? (body-body fids only —
   bit 12 marks planes.) The incident pick below prefers it, so 2-point
   manifolds stop flickering their second clip point at display-rate dt */
function prevIncident(ida, idb, flip){
  for(let k = 0; k < nPrev; k++){
    if(prevA[k] === ida && prevB[k] === idb && (prevF[k] & 4096) === 0 &&
       ((prevF[k] & 2048) !== 0) === flip) return (prevF[k] >> 3) & 15;
  }
  return -1;
}

/* clip the incident edge to the reference face; emit 1–2 contacts */
function collidePoly(A, B){
  maxSeparation(A, B); const sepA = satRes.sep, eA = satRes.edge;
  if(sepA > 0) return;
  maxSeparation(B, A); const sepB = satRes.sep, eB = satRes.edge;
  if(sepB > 0) return;
  let R, I, edge, flip;
  if(sepB > sepA + .05){ R = B; I = A; edge = eB; flip = true; }
  else                 { R = A; I = B; edge = eA; flip = false; }

  const e2 = (edge + 1) % R.nv;
  const v1x = R.wv[edge].x, v1y = R.wv[edge].y;
  const v2x = R.wv[e2].x,   v2y = R.wv[e2].y;
  let ex = v2x - v1x, ey = v2y - v1y;
  const el0 = Math.hypot(ex, ey) || 1;
  ex /= el0; ey /= el0;
  const nx = ey, ny = -ex;                    // reference face normal, R -> I

  // incident edge: the face of I most opposed to the reference normal —
  // with hysteresis: keep last frame's pick unless clearly beaten
  let bi = 0, bd = 1e9, pd = 1e9;
  const pBi = prevIncident(A.id, B.id, flip);
  for(let i = 0; i < I.nv; i++){
    const j = (i + 1) % I.nv;
    const iex = I.wv[j].x - I.wv[i].x, iey = I.wv[j].y - I.wv[i].y;
    const il = 1 / (Math.hypot(iex, iey) || 1);
    const d = (iey * il) * nx + (-iex * il) * ny;
    if(i === pBi) pd = d;
    if(d < bd){ bd = d; bi = i; }
  }
  if(pBi >= 0 && pBi < I.nv && pd < bd + .05) bi = pBi;
  const bj = (bi + 1) % I.nv;
  let p1x = I.wv[bi].x, p1y = I.wv[bi].y;
  let p2x = I.wv[bj].x, p2y = I.wv[bj].y;

  // clip to the side plane at v1 (keep the +e side)
  let d1 = (p1x - v1x) * ex + (p1y - v1y) * ey;
  let d2 = (p2x - v1x) * ex + (p2y - v1y) * ey;
  if(d1 < 0 && d2 < 0) return;
  if(d1 < 0){ const t = d1 / (d1 - d2); p1x += (p2x - p1x) * t; p1y += (p2y - p1y) * t; }
  else if(d2 < 0){ const t = d2 / (d2 - d1); p2x += (p1x - p2x) * t; p2y += (p1y - p2y) * t; }

  // clip to the side plane at v2 (keep the -e side)
  d1 = (p1x - v2x) * -ex + (p1y - v2y) * -ey;
  d2 = (p2x - v2x) * -ex + (p2y - v2y) * -ey;
  if(d1 < 0 && d2 < 0) return;
  if(d1 < 0){ const t = d1 / (d1 - d2); p1x += (p2x - p1x) * t; p1y += (p2y - p1y) * t; }
  else if(d2 < 0){ const t = d2 / (d2 - d1); p2x += (p1x - p2x) * t; p2y += (p1y - p2y) * t; }
