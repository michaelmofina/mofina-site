<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael Mofina — Product Designer</title>
<meta name="description" content="Michael Mofina — product designer at Todoist.">
<meta name="theme-color" content="#fdfdfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<style>
/* ============================================================
   michael mofina — "spill" variant
   The name appears mid-page, holds just long enough to be read,
   then every letter falls. Each one is a rigid body whose collider
   is traced from its own glyph outline, so letters land on their
   ink, tip over their stems, and stack like real objects. The four
   UI pills fall with them — and still work: a clean tap activates,
   anything longer is a drag. A rabbit r1 drops in after the first
   spill, an iPhone follows a beat later, and neither ever leaves.
   One viewport, no scroll. Escape or double-click puts the name
   (and the pills) back together.
   ============================================================ */

@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Book.woff2") format("woff2");
  font-weight:350;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Regular.woff2") format("woff2");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Medium.woff2") format("woff2");
  font-weight:500;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Light.woff2") format("woff2");
  font-weight:300; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Bold.woff2") format("woff2");
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Heavy.woff2") format("woff2");
  font-weight:800; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"KMR Apparat";
  src:url("../assets/fonts/KMR-Apparat-Black.woff2") format("woff2");
  font-weight:900; font-style:normal; font-display:swap;
}

:root{
  --paper:#fdfdfb;
  --ink:22,22,22;
  --accent:#d96400;
  color-scheme:light dark;
}
/* the page follows the system — no toggle. Warm near-black, warm
   off-white ink, the red lifted a step so it carries on the dark ground */
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141210;
    --ink:241,238,232;
    --accent:#ffc53d;
  }
}
/* hosted wrappers (e.g. the Claude artifact viewer) stamp their theme on
   the root — honor it in both directions so their toggle wins there;
   the real site never has data-theme and stays on the media query */
:root[data-theme="dark"]{ --paper:#141210; --ink:241,238,232; --accent:#ffc53d; }
:root[data-theme="light"]{ --paper:#fdfdfb; --ink:22,22,22; --accent:#d96400; }

*{ margin:0; padding:0; box-sizing:border-box; }

html, body{ background:var(--paper); }  /* body too: wrapper resets must not paint over us */

body{
  font-family:"KMR Apparat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:500;              /* try ?w=350 (Book) or ?w=400 (Regular) */
  font-size:.95rem;
  line-height:1.6;
  color:rgba(var(--ink),.85);
  overflow:hidden;               /* one viewport — the page never scrolls */
  overscroll-behavior:none;
  height:100svh;
}

::selection{ background:var(--accent); color:var(--paper); }

a{ color:inherit; }
a:focus-visible{ outline:2px solid rgba(var(--ink),.85); outline-offset:3px; border-radius:2px; }

.fade{
  animation:fadeUp .55s cubic-bezier(.22,.61,.36,1) both;
  animation-delay:var(--d,0ms);
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:none; }
}

/* ---- hero ---- */
.hero{
  position:relative;
  height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:clip;
}
.corner{
  position:absolute;
  top:1.75rem; left:1.5rem; right:1.5rem;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:.2rem 1.5rem;
  /* no z-index: the corner must not trap its fixed pills in a
     stacking context of its own once they go live */
}

/* the page's UI text is four pills — real links and buttons that
   later fall with the letters and still work */
.pill{
  display:inline-block;
  font:inherit;
  font-size:.85rem;
  letter-spacing:.01em;          /* small text breathes with a touch of tracking */
  color:rgba(var(--ink),.7);
  background:var(--paper);       /* an opaque chip once it flies over letters */
  border:1px solid rgba(var(--ink),.25);
  border-radius:999px;
  padding:.3rem .85rem;
  text-decoration:none;
  cursor:pointer;
  transition:color .2s ease, border-color .2s ease, opacity .4s ease;
}
/* press feedback lands on pointer-down, not on release (seated only —
   live pills belong to the physics and its inline transforms) */
.pill:not(.live){ transition:color .2s ease, border-color .2s ease,
  opacity .4s ease, transform .1s ease-out; }
.pill:not(.live):active{ transform:scale(.96); }
.pill[hidden]{ display:none; }     /* inline-block must not defeat hidden */
a.pill:hover, button.pill:hover{ color:var(--accent); border-color:var(--accent); }
.pill:focus-visible{ outline:2px solid rgba(var(--ink),.85); outline-offset:3px; }
.pill.gone{ opacity:0; pointer-events:none; }

/* physics owns a live pill exactly the way it owns a live letter */
.pill.live{
  position:fixed;
  left:0; top:0;
  z-index:9;
  margin:0;
  cursor:grab;
  touch-action:none;
  transform-origin:0 0;
  will-change:transform;
  user-select:none;
  -webkit-user-select:none;
}
.pill.live.held{ cursor:grabbing; color:var(--accent); border-color:var(--accent); }

.row{ display:flex; align-items:center; gap:.9rem; }

/* the name — one line, sized to fit with a little bleed-proofing */
.big{
  font-weight:var(--w-name,400);   /* the weight the name has always rendered at */
  font-size:min(11vw,16vh);
  line-height:1;
  letter-spacing:-.03em;
  color:rgba(var(--ink),.87);
  white-space:nowrap;
  user-select:none;
  -webkit-user-select:none;
}
.big .word + .word{ margin-left:.38em; }

.letter{
  display:inline-block;
  will-change:transform;
}
/* once physics owns a letter it becomes a fixed-position sprite;
   transforms are composed by hand about the glyph's own centroid,
   so the origin must stay at the box corner */
.letter.live{
  position:fixed;
  left:0; top:0;
  z-index:9;
  cursor:grab;
  touch-action:none;
  transform-origin:0 0;
}
.letter.live.held{ cursor:grabbing; color:var(--accent); }
body.grabbing{ cursor:grabbing; user-select:none; -webkit-user-select:none; }

/* the two toys that join the pile — sized in px by the script to
   match the headline's cap height. Both render their real baked
   meshes through WebGL; the r1 falls back to a flat DOM drawing
   when it can't, the iPhone simply doesn't show up. */
.toy{
  position:fixed;
  left:0; top:0;
  z-index:8;               /* letters read in front of the toys */
  transform-origin:0 0;
  will-change:transform;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
.toy.held{ cursor:grabbing; }
.toy div{ position:absolute; }

/* invisible mirror of the name: always lays out naturally, so home
   seats stay correct at any viewport size */
.ghost{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  visibility:hidden;
  pointer-events:none;
}
/* name above, pill row below — and the twin must stack exactly
   like the real thing or the seats would lie */
.hero, .ghost{ flex-direction:column; gap:1.15rem; }

.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}



/* ---- static wayfinding + the menu ---- */
.who{ margin:0; color:rgba(var(--ink),.6); font-weight:var(--w-top,500); }
.who a{ color:var(--accent); text-decoration:none; }
.who a:hover{ text-decoration:underline; text-underline-offset:.18em; }
.menu-btn{
  font:inherit; font-size:.95rem; color:rgba(var(--ink),.85);
  font-weight:var(--w-top,500);
  background:none; border:0; padding:0; cursor:pointer;
  transition:color .2s ease;
}
.menu-btn:hover{ color:var(--accent); }
.menu[hidden]{ display:none; }   /* hidden must beat display:flex */
.menu{
  position:fixed; inset:0; z-index:60;
  background:var(--paper);
  display:flex; flex-direction:column;
  padding:1.75rem 1.5rem;
}
.menu-close{ align-self:flex-end; }
.menu-nav{ margin:auto 0; display:flex; flex-direction:column; gap:1.2rem; }
.menu-nav a{
  font-size:clamp(2.2rem,7vw,4rem); line-height:1.1; letter-spacing:-.02em;
  font-weight:var(--w-menu,350);   /* Book at rest… */
  color:rgba(var(--ink),.87); text-decoration:none; width:fit-content;
  transition:color .2s ease;
}
.menu-nav a:hover{ font-weight:var(--w-menu-hover,500); color:var(--accent); }  /* …Medium under the cursor */
.menu-nav a[aria-current="page"]{ color:rgba(var(--ink),.4); }
.menu.open .menu-nav a{ animation:fadeUp .45s cubic-bezier(.22,.61,.36,1) both; }
.menu.open .menu-nav a:nth-child(2){ animation-delay:60ms; }
.menu.open .menu-nav a:nth-child(3){ animation-delay:120ms; }


/* ---- dev weight lab: only exists when the URL says #dev ---- */
.devpanel[hidden]{ display:none; }
.devpanel{
  position:fixed; left:1rem; bottom:1rem; z-index:80;
  display:flex; flex-direction:column; gap:.35rem;
  background:var(--paper); border:1px solid rgba(var(--ink),.25);
  border-radius:10px; padding:.6rem .8rem;
  font-size:.72rem; color:rgba(var(--ink),.7);
}
.devpanel label{ display:flex; align-items:center; gap:.5rem; }
.devpanel label span:first-child{ width:2.6rem; }
.devpanel input{ width:130px; accent-color:var(--accent); }
.devpanel output{ width:2.2rem; text-align:right; font-variant-numeric:tabular-nums; }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
  .fade{ opacity:1; transform:none; }
}
</style>
</head>
<body>

<section class="hero">
  <div class="corner fade" style="--d:0ms">
    <p class="who">Product Designer at <a href="https://todoist.com">Todoist</a></p>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu">Menu</button>
  </div>

  <h1 class="big fade" id="name" style="--d:80ms">
    <span class="sr-only">michael mofina</span><span aria-hidden="true" id="visname"><span class="word">michael</span><span class="word">mofina</span></span>
  </h1>

  <div class="row fade" id="pillrow" style="--d:160ms">
    <button class="pill" id="shake" hidden>Shake it up</button>
    <a class="pill" id="contact" href="mailto:info@michaelmofina.com">Get in touch</a>
  </div>

  <!-- invisible twin used only to know where the letters' and pills' seats are -->
  <div class="ghost" aria-hidden="true">
    <div class="corner" id="gcorner"></div>
    <p class="big" id="ghostname"></p>
    <div class="row" id="grow"></div>
  </div>
</section>
<div class="menu" id="menu" hidden role="dialog" aria-modal="true" aria-label="Site menu">
  <button class="menu-btn menu-close" id="menuClose">Close</button>
  <nav class="menu-nav">
    <a href="letters.html" aria-current="page">Home</a>
    <a href="work.html">Work</a>
    <a href="mailto:info@michaelmofina.com">Get in touch</a>
  </nav>
</div>

<div class="devpanel" id="devpanel" hidden aria-hidden="true">
  <label><span>name</span><input type="range" id="devName" min="0" max="6" step="1" value="2"><output id="devNameV">400</output></label>
  <label><span>menu</span><input type="range" id="devMenu" min="0" max="6" step="1" value="1"><output id="devMenuV">350</output></label>
  <label><span>top</span><input type="range" id="devTop" min="0" max="6" step="1" value="3"><output id="devTopV">500</output></label>
</div>



<script src="r1-mesh.js"></script>
<script src="iphone-mesh.js"></script>
<script>
(() => {
"use strict";

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Filled transform animations create containing blocks for position:fixed;
// clear each entrance animation once it has played.
document.querySelectorAll(".fade").forEach(el => {
  el.addEventListener("animationend", () => { el.style.animation = "none"; }, { once:true });
});

/* ---- split the words into letter spans (visible + ghost twin) ---- */
const visname = document.getElementById("visname");
const ghostP  = document.getElementById("ghostname");
visname.querySelectorAll(".word").forEach(w => {
  w.innerHTML = w.textContent.split("")
    .map(ch => '<span class="letter">' + ch + "</span>").join("");
});
ghostP.innerHTML = visname.innerHTML;   // identical structure, invisible
const letters = [...visname.querySelectorAll(".letter")];
const seats   = [...ghostP.querySelectorAll(".letter")];


/* ---- the menu: a full-screen room of its own. Wired before the
   reduced-motion gate so it works everywhere; its Escape (capture
   phase) outranks the reassembly listener while open. ---- */
const menu = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");
const menuClose = document.getElementById("menuClose");
function setMenu(open){
  menu.hidden = !open;
  menu.classList.toggle("open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  const fc = open ? (menu.querySelector("a") || menuClose) : menuBtn;
  if(fc && fc.focus) fc.focus();
}
menuBtn.addEventListener("click", () => setMenu(true));
menuClose.addEventListener("click", () => setMenu(false));
addEventListener("keydown", e => {
  if(e.key === "Escape" && !menu.hidden){
    setMenu(false);
    e.stopImmediatePropagation();
  }
}, true);


/* ---- dev weight lab (URL contains "dev"): three sliders across the
   seven real Apparat cuts. The name slider re-traces the glyph hulls
   so heavier letters really are heavier objects. ---- */
const devPanel = document.getElementById("devpanel");
if(devPanel && /dev/.test(location.search + location.hash)){
  devPanel.hidden = false;
  const DEV_W = [300, 350, 400, 500, 700, 800, 900];
  const wire = (id, cssVar, onSet) => {
    const inp = document.getElementById(id);
    const out = document.getElementById(id + "V");
    inp.addEventListener("input", () => {
      const w = DEV_W[+inp.value];
      out.textContent = w;
      document.documentElement.style.setProperty(cssVar, w);
      if(onSet) onSet(w);
    });
  };
  wire("devName", "--w-name", reduced ? null : w => {
    FONT_WT = String(w);                  // (reduced motion: CSS var alone is enough —
    hullsBuilt = false;                   // the physics never initialized)
    for(const k in HULLS) delete HULLS[k];
    dispatchEvent(new Event("resize"));   // re-measure seats, rebuild hulls
  });
  wire("devMenu", "--w-menu");
  wire("devTop",  "--w-top");
}

if(reduced) return;   // the name simply stays a name; no toys, no handlers

/* ================================================================
   Physics — 13 rigid letters (plus four pills and two toys, later)
   whose colliders are convex hulls traced from the glyphs themselves
   or cut as rounded slabs. SAT contacts, impulse solver with full
   rotational terms, friction, sleep.
   ================================================================ */

/* ---- every physics tunable lives in this block ---- */
const G          = 2000;   // gravity, px/s²
const REST       = .35;    // restitution — a thud with a little life in it
const REST_MIN   = 110;    // impacts slower than this don't bounce (px/s)
const MU         = .4;     // Coulomb-ish friction coefficient
const BAUM       = .2;     // position-only correction per pass (velocities never see it)
const SLOP       = .5;     // px of overlap we quietly allow
const VEL_ITERS  = 6;      // velocity solver passes
const POS_ITERS  = 4;      // position solver passes
const MAXV       = 3400;   // fling speed cap, px/s
const LIN_DAMP   = .04;    // faint air drag, 1/s
const ANG_DAMP   = .35;    // faint spin drag, 1/s
const SLEEP_LIN  = 9;      // px/s — under this a body counts as still
const SLEEP_ANG  = .10;    // rad/s — same idea for spin
const SLEEP_DX   = 1.5;    // px — or: barely drifted from where it settled
const SLEEP_DA   = .03;    // rad — same idea for wobble
const SLEEP_T    = .35;    // seconds of stillness before a body sleeps
const SETTLE_ANG = 6;      // extra spin damping while slow + touching, 1/s
const SETTLE_LIN = 2;      // extra slide damping while slow + touching, 1/s
const WAKE_V     = 80;     // contact approach speed that wakes a sleeper
const HULL_PX    = 128;    // size glyphs are rasterized at for tracing
const HULL_MAXV  = 12;     // max vertices kept per glyph hull
const TOY_DENS   = 1.4;    // toys are denser than letters
const PILL_DENS  = 1.1;    // pills are lighter chips than the toys
const TAP_PX     = 8;      // pointer travel under this…
const TAP_MS     = 350;    // …and quicker than this is a tap, not a drag
const IP_SIDE    = 1.52;   // iPhone canvas ÷ cap height (≈1.5× cap tall after margin)

/* ---- the grip pin: a held body stays fully dynamic, tied to the finger
   by a stiff critically-damped spring at the exact point it was caught */
const HOLD_WN    = 40;     // pin stiffness as a frequency, rad/s (~0.1s settle)
const HOLD_ZETA  = 1;      // critical damping — tight, no rubber-banding
const HOLD_MASS  = 2.5;    // a held body counts this much heavier to the pile
const HOLD_ADAMP = 2.5;    // swing-about-the-grip damping while held, 1/s
const HOLD_SUB   = 10;     // pin substeps — the stiffness stays stable at 30fps
const HOLD_ERR   = 150;    // px of pointer error the spring acts on (yank guard)
const HOLD_WMAX  = 12;     // rad/s spin cap in the hand — no helicoptering

/* ---- depth-tumble (the WebGL toys only; the flat r1 fallback has none) ---- */
const R1_THICK      = .18;   // r1 depth ÷ height — its bake spans z ±0.1814 on a 2.0 model
const R1_DAMP_AIR   = 1.2;   // tumble decay while airborne, 1/s
const R1_DAMP_GND   = 2.6;   // tumble decay while touching but still sliding, 1/s
const R1_KICK_FLING = .002;  // fling speed (px/s) → tumble (rad/s)
const R1_KICK_HIT   = .0032; // impact speed (px/s) → tumble (rad/s)
const R1_KICK_MIN   = 140;   // impacts slower than this don't tumble (px/s)
const R1_W_MAX      = 8;     // tumble speed cap, rad/s — a max throw stays under ~1.5 turns
const R1_DAMP_SET   = 3.5;   // grounded spin die-off, 1/s — it lands where it lands
const R1_HULL_DW    = 2;     // px of width change that justifies re-cutting the collider

let mode = "seated";    // seated | live | homing   (letters + pills — toys never seat)
let raf = 0, lastT = 0;
let held = null, pointerId = null;
let grabLX = 0, grabLY = 0;   // the grip anchor in BODY space — the exact caught point
let tap = null;         // pill press bookkeeping — a short, still press activates
let spilled = false;
const target = { x:0, y:0 };
const samples = [];
let gravX = 0, gravY = G;   // gravity vector — device tilt may rotate it; |g| stays G

function seatRect(i){ return seats[i].getBoundingClientRect(); }

/* ================================================================
   Glyph hulls — each unique character is rasterized once at 128px,
   its silhouette convex-hulled (Andrew's monotone chain), thinned
   to a dozen vertices, and kept in em units relative to the pen
   origin + baseline so it can be scaled to whatever size the
   headline happens to render at.
   ================================================================ */
const FONT_STACK = '"KMR Apparat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';

/* weight A/B: ?w=350|400|500 flips the whole page (and the glyph hulls) */
let FONT_WT = (() => {
  const w = new URLSearchParams(location.search).get("w");
  return ["350", "400", "500"].includes(w) ? w : "400";
})();
if(FONT_WT !== "500") document.body.style.fontWeight = FONT_WT;
const UNIQUE = [...new Set("michaelmofina")];
const HCW = 192, HCH = 208, HPX = 28, HBY = 156;   // canvas, pen x, baseline y
const hullCanvas = document.createElement("canvas");
hullCanvas.width = HCW; hullCanvas.height = HCH;
const hctx = hullCanvas.getContext("2d", { willReadFrequently:true });
const HULLS = {};          // char -> vertices in em units, y negative above baseline
let baselineEm = .875;     // where the baseline sits inside a line-height:1 box
let hullsBuilt = false;

function cross3(ox, oy, ax, ay, bx, by){
  return (ax - ox) * (by - oy) - (ay - oy) * (bx - ox);
}

function convexHull(pts){
  pts.sort((p, q) => p.x - q.x || p.y - q.y);
  if(pts.length < 3) return pts.slice();
  const lo = [];
  for(const p of pts){
    while(lo.length >= 2 && cross3(lo[lo.length-2].x, lo[lo.length-2].y,
          lo[lo.length-1].x, lo[lo.length-1].y, p.x, p.y) <= 0) lo.pop();
    lo.push(p);
  }
  const hi = [];
  for(let i = pts.length - 1; i >= 0; i--){
    const p = pts[i];
    while(hi.length >= 2 && cross3(hi[hi.length-2].x, hi[hi.length-2].y,
          hi[hi.length-1].x, hi[hi.length-1].y, p.x, p.y) <= 0) hi.pop();
    hi.push(p);
  }
  lo.pop(); hi.pop();
  return lo.concat(hi);
}

/* thin the hull to HULL_MAXV verts, but never remove the extremes —
   the true bottom of the glyph must survive or floors would lie */
function simplifyHull(h){
  while(h.length > HULL_MAXV){
    let loI = 0, hiI = 0, leI = 0, riI = 0;
    for(let i = 1; i < h.length; i++){
      if(h[i].y > h[loI].y) loI = i;
      if(h[i].y < h[hiI].y) hiI = i;
      if(h[i].x < h[leI].x) leI = i;
      if(h[i].x > h[riI].x) riI = i;
    }
    let bi = -1, ba = Infinity;
    for(let i = 0; i < h.length; i++){
      if(i === loI || i === hiI || i === leI || i === riI) continue;
      const p = h[(i + h.length - 1) % h.length], c = h[i], n = h[(i + 1) % h.length];
      const a = Math.abs(cross3(p.x, p.y, c.x, c.y, n.x, n.y));
      if(a < ba){ ba = a; bi = i; }
    }
    if(bi < 0) break;
    h.splice(bi, 1);
  }
  return h;
}

function signedArea(v){
  let a = 0;
  for(let i = 0; i < v.length; i++){
    const j = (i + 1) % v.length;
    a += v[i].x * v[j].y - v[j].x * v[i].y;
  }
  return a * .5;
}

function extractHull(ch){
  hctx.clearRect(0, 0, HCW, HCH);
  hctx.font = FONT_WT + " " + HULL_PX + "px " + FONT_STACK;
  hctx.textBaseline = "alphabetic";
  hctx.fillStyle = "#000";
  hctx.fillText(ch, HPX, HBY);
  const img = hctx.getImageData(0, 0, HCW, HCH).data;
  const pts = [];
  for(let y = 0; y < HCH; y++){
    let lo = -1, hi = -1;
    for(let x = 0; x < HCW; x++){
      if(img[(y * HCW + x) * 4 + 3] > 12){ if(lo < 0) lo = x; hi = x; }
    }
    if(lo >= 0){
      // pixel corners, so the hull covers the ink to its outermost edge
      pts.push({x:lo, y}, {x:hi + 1, y}, {x:lo, y:y + 1}, {x:hi + 1, y:y + 1});
    }
  }
  if(!pts.length) return null;
  const h = simplifyHull(convexHull(pts));
  if(signedArea(h) < 0) h.reverse();   // keep positive winding (outward normals)
  return h.map(p => ({ x:(p.x - HPX) / HULL_PX, y:(p.y - HBY) / HULL_PX }));
}

function buildHulls(){
  hctx.font = FONT_WT + " " + HULL_PX + "px " + FONT_STACK;
  const m = hctx.measureText("mh");
  const asc  = (m.fontBoundingBoxAscent  || HULL_PX * .76) / HULL_PX;
  const desc = (m.fontBoundingBoxDescent || HULL_PX * .24) / HULL_PX;
  // line-height:1 → half-leading centres the font box in the em box
  baselineEm = (1 - (asc + desc)) / 2 + asc;
  for(const ch of UNIQUE){
    let h = null;
    try{ h = extractHull(ch); }catch(err){ h = null; }
    if(h && h.length >= 3){ HULLS[ch] = h; }
    else{
      // the canvas said nothing (blocked pixels, exotic env):
      // a plain x-height box is a liveable stand-in
      const w = Math.max(.2, hctx.measureText(ch).width / HULL_PX);
      HULLS[ch] = [ {x:0, y:-.68}, {x:w, y:-.68}, {x:w, y:0}, {x:0, y:0} ];
    }
  }
  hullsBuilt = true;
}

/* ---- rigid bodies ---- */
const bodies = [];                 // 13 letters first; pills and toys join later
const bodyByEl = new Map();
let bodySeq = 0;                   // stable ids — the warm-start pair key

function mkBody(el, kind){
  const b = {
    el, kind, i:-1, ch:"", id:bodySeq++,
    x:0, y:0, a:0,               // centroid position + angle
    vx:0, vy:0, va:0,            // linear + angular velocity
    m:1, invM:1, I:1, invI:1,    // mass + moment of inertia about the centroid
    iM:0, iI:0,                  // effective inverse masses this frame (0 = immovable)
    cx:0, cy:0,                  // where the centroid sits inside the element's box
    nv:0, lv:[], wv:[],          // hull: local verts + world verts (preallocated)
    rad:20,                      // bounding radius about the centroid
    minx:0, miny:0, maxx:0, maxy:0,   // world AABB for the broadphase
    sleeping:false, still:0, sx:0, sy:0, sa:0, touch:0,
    homeDelay:0, homed:true, dropAt:0,
    entering:false,              // toys fall in from above the ceiling plane
    draw3d:null,                 // a WebGL toy hangs its painter here
    tumbles:false,               // a 3D toy carries real depth-tumble state:
    rx:0, ry:0, wx:0, wy:0,      //   pitch/yaw + angular velocities (rad, rad/s)
    poseCalm:true, lastKick:0,   //   settled flag + impact-kick rate limiter
    thick3d:0,                   //   depth ÷ height, per model (r1 ≠ iPhone)
    toyW:0, toyH:0, toyCut:0, hullW:0,   // toy box + current depth-aware hull width
  };
  for(let i = 0; i < HULL_MAXV; i++){ b.lv.push({x:0, y:0}); b.wv.push({x:0, y:0}); }
  bodyByEl.set(el, b);
  return b;
}

letters.forEach((el, i) => {
  const b = mkBody(el, "letter");
  b.i = i; b.ch = el.textContent;
  bodies.push(b);
});

function wake(b){ b.sleeping = false; b.still = 0; b.sx = b.x; b.sy = b.y; b.sa = b.a; }
function wakeAll(){ for(const b of bodies) wake(b); }

/* pull a body out of the world entirely — the shake pill once tilt is
   armed, or a 3D toy whose GL context died. The element goes with it;
   everyone is woken so nothing keeps resting on a memory. */
function removeBody(b){
  if(held === b){                      // pried out of a hand: let go cleanly
    removeEventListener("pointermove", onMove);
    removeEventListener("pointerup", onUp);
    removeEventListener("pointercancel", onUp);
    document.body.classList.remove("grabbing");
    pointerId = null;
    held = null;
    tap = null;
  }
  const k = bodies.indexOf(b);
  if(k >= 0) bodies.splice(k, 1);
  bodyByEl.delete(b.el);
  b.el.remove();
  wakeAll();
  start();
}

/* ---- polygon mass properties: area, centroid, inertia about it ---- */
const geomOut = { area:1, cx:0, cy:0, I:1 };
function polyProps(v, n, dens){
  let A = 0, cx = 0, cy = 0;
  for(let i = 0; i < n; i++){
    const j = (i + 1) % n;
    const cr = v[i].x * v[j].y - v[j].x * v[i].y;
    A += cr; cx += (v[i].x + v[j].x) * cr; cy += (v[i].y + v[j].y) * cr;
  }
  A *= .5;
  const inv6A = 1 / (6 * A);
  cx *= inv6A; cy *= inv6A;
  let I = 0;
  for(let i = 0; i < n; i++){
    const j = (i + 1) % n;
    const x1 = v[i].x - cx, y1 = v[i].y - cy;
    const x2 = v[j].x - cx, y2 = v[j].y - cy;
    const cr = x1 * y2 - x2 * y1;
    I += cr * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
  }
  geomOut.area = Math.abs(A);
  geomOut.cx = cx; geomOut.cy = cy;
  geomOut.I = Math.max(1, Math.abs(I) * dens / 12);
  return geomOut;
}

const geomTmp = [];
for(let i = 0; i < HULL_MAXV; i++) geomTmp.push({x:0, y:0});

function fontPx(){
  return parseFloat(getComputedStyle(visname).fontSize) || 64;
}

/* scale a letter's unit hull to the rendered font size, in box coords,
   then re-express it about the centroid. An 'l' spins about its stem,
   not about the empty middle of its span. */
function setLetterGeometry(b, F){
  const unit = HULLS[b.ch];
  if(!unit) return;
  const n = Math.min(unit.length, HULL_MAXV);
  const bl = baselineEm * F;                 // baseline y inside the span box
  for(let i = 0; i < n; i++){
    geomTmp[i].x = unit[i].x * F;
    geomTmp[i].y = bl + unit[i].y * F;
  }
  const g = polyProps(geomTmp, n, 1);
  b.nv = n; b.cx = g.cx; b.cy = g.cy;
  b.m = Math.max(40, g.area); b.invM = 1 / b.m;
  b.I = g.I; b.invI = 1 / b.I;
  let r = 0;
  for(let i = 0; i < n; i++){
    b.lv[i].x = geomTmp[i].x - g.cx;
    b.lv[i].y = geomTmp[i].y - g.cy;
    r = Math.max(r, Math.hypot(b.lv[i].x, b.lv[i].y));
  }
  b.rad = r;
}

function refreshGeometry(){
  if(!hullsBuilt) buildHulls();
  const F = fontPx();
  for(const b of bodies) if(b.kind === "letter") setLetterGeometry(b, F);
}

/* ---- go live: letters leave the text flow and take physics state ---- */
function goLive(){
  if(mode !== "seated") return;
  if(innerWidth < 10 || innerHeight < 10){   // collapsed viewport: try again soon
    fallTimer = setTimeout(goLive, 500);
    return;
  }
  // Kill any still-running entrance animation NOW: a filled transform
  // animation would make an ancestor the containing block for the
  // letters' position:fixed. (They stay in the DOM so they keep
  // inheriting the headline's font size.)
  document.querySelectorAll(".fade").forEach(el => { el.style.animation = "none"; });
  const name = document.getElementById("name");
  const row  = document.getElementById("pillrow");
  name.style.height = name.getBoundingClientRect().height + "px"; // keep hero layout
  row.style.height  = row.getBoundingClientRect().height + "px";  // …row included
  refreshGeometry();                          // hulls at the rendered size
  const now = performance.now();
  for(const b of bodies){
    if(b.kind === "letter"){
      const r = b.el.getBoundingClientRect();
      b.x = r.left + b.cx;                      // the body lives at the glyph's
      b.y = r.top + b.cy;                       // centroid, not the box centre
      b.vx = (Math.random() - .5) * 60;         // a whisper of sideways drift
      b.vy = 0;
      b.a = 0;
      b.va = (Math.random() - .5) * 2.4;
      b.homed = false;
      b.dropAt = now + b.i * 26 + Math.random() * 90;  // ragged, not synchronized
    } else if(b.kind === "pill"){
      const r = b.el.getBoundingClientRect();
      // a pill is a rounded-rect chip: octagon cut at 3/4 of the painted
      // corner radius (the CSS 999px resolves to half the short side)
      const br = Math.min(parseFloat(getComputedStyle(b.el).borderRadius) || 0,
                          r.height / 2, r.width / 2);
      setSlabGeometry(b, r.width, r.height, br * .75, PILL_DENS);
      b.x = r.left + b.cx;
      b.y = r.top + b.cy;
      b.vx = (Math.random() - .5) * 60;
      b.vy = 0;
      b.a = 0;
      b.va = (Math.random() - .5) * 1.6;        // chips spin a touch less
      b.homed = false;
      b.dropAt = now + Math.random() * 380;     // inside the letters' ragged window
    }
  }
  for(const b of bodies)
    if(b.kind === "letter" || b.kind === "pill") b.el.classList.add("live");
  mode = "live";
  spilled = true;
  wakeAll();       // toys under the raining letters must notice
  render(now);     // position synchronously — no one-frame flash at the origin
  start();
}

/* the fall begins once the name has had a moment to be read */
let fallTimer = setTimeout(goLive, 1400);

/* if the first hull pass measured the fallback face, retrace once the
   real font arrives; live bodies pick up the corrected outlines */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    buildHulls();
    if(mode !== "seated"){ refreshGeometry(); wakeAll(); start(); }
  }).catch(() => {});
}

/* ---- grab / drag / fling ---- */
function pushSample(e){
  const t = performance.now();
  samples.push({ x:e.clientX, y:e.clientY, t });
  while(samples.length && t - samples[0].t > 110) samples.shift();
}
function onDown(e){
  let el = e.target.closest
    ? (e.target.closest(".letter.live") || e.target.closest(".pill.live") ||
       e.target.closest(".toy")) : null;
  if(!el && mode === "seated" && e.target.closest &&
     e.target.closest("#visname .letter")){
    clearTimeout(fallTimer);                     // grabbing the seated name spills the
    goLive();                                    // page; seated pills stay pure buttons
    el = e.target.closest("#visname .letter");
  }
  if(!el) return;
  const b = bodyByEl.get(el);
  if(!b) return;
  if(mode === "homing" && b.kind !== "toy"){
    // snatching a body mid-homecoming cancels the reassembly — everything
    // resumes live physics from exactly where it is right now
    mode = "live";
    for(const o of bodies){
      if(o.kind === "toy") continue;
      o.homed = false;
      o.dropAt = 0;
    }
  }
  if(b.kind !== "toy" && mode === "live") b.dropAt = 0;  // a grabbed body falls now
  held = b;
  held.el.classList.add("held");
  // the grip is a pin: keep the caught point in body space, so the body
  // hangs, swings and is pushed about that exact point — never its centre
  {
    const gx = e.clientX - b.x, gy = e.clientY - b.y;
    const c0 = Math.cos(b.a), s0 = Math.sin(b.a);
    grabLX =  c0 * gx + s0 * gy;         // R(-angle) · (grip − centroid)
    grabLY = -s0 * gx + c0 * gy;
  }
  // a press on a pill might be a tap: remember where and when it began
  tap = b.kind === "pill"
    ? { b, t:performance.now(), x:e.clientX, y:e.clientY, path:0 }
    : null;
  pointerId = e.pointerId;
  samples.length = 0;
  pushSample(e);
  target.x = e.clientX; target.y = e.clientY;   // the pin chases the finger itself
  document.body.classList.add("grabbing");
  wakeAll();                                   // a hand in the pile disturbs everything
  addEventListener("pointermove", onMove);
  addEventListener("pointerup", onUp);
  addEventListener("pointercancel", onUp);
  e.preventDefault();
  start();
}
function onMove(e){
  if(e.pointerId !== pointerId) return;
  target.x = e.clientX; target.y = e.clientY;
  pushSample(e);
  if(tap){                                   // total travel, not net displacement
    tap.path += Math.hypot(e.clientX - tap.x, e.clientY - tap.y);
    tap.x = e.clientX; tap.y = e.clientY;
  }
}
function onUp(e){
  if(e.pointerId !== pointerId) return;
  removeEventListener("pointermove", onMove);
  removeEventListener("pointerup", onUp);
  removeEventListener("pointercancel", onUp);
  document.body.classList.remove("grabbing");
  pointerId = null;
  if(held){
    const a = samples[0], b = samples[samples.length - 1];
    if(a && b && b.t - a.t > 15){
      const dt = (b.t - a.t) / 1000;
      held.vx = (b.x - a.x) / dt;
      held.vy = (b.y - a.y) / dt;
      const sp = Math.hypot(held.vx, held.vy);
      if(sp > MAXV){ held.vx *= MAXV / sp; held.vy *= MAXV / sp; }
      // angular velocity is left alone — the body leaves the hand
      // with whatever spin the pin dynamics actually gave it
    }
    if(held.tumbles){
      // a thrown r1 leaves the hand tumbling — mostly yaw for a sideways
      // throw, mostly pitch for a vertical one, capped so it never looks
      // frantic (a full-speed fling is about one turn in the air)
      const sp = Math.hypot(held.vx, held.vy);
      if(sp > 60){
        const k = Math.min(R1_W_MAX, sp * R1_KICK_FLING);
        held.wy = clampW(rspin() * k * (.3 + .7 * Math.abs(held.vx) / sp));
        held.wx = clampW(rspin() * k * (.3 + .7 * Math.abs(held.vy) / sp) * .85);
        held.poseCalm = false;
      }
    }
    // a press that never really moved and ended quickly is a tap — the
    // pill acts; anything longer or farther was a drag and must not
    const wasTap = tap && tap.b === held && e.type === "pointerup" &&
                   tap.path <= TAP_PX && performance.now() - tap.t < TAP_MS;
    held.el.classList.remove("held");
    wake(held);
    held = null;
    if(wasTap) activatePill(tap.b);
  }
  tap = null;
  start();
}
addEventListener("pointerdown", onDown);

/* what each pill does when tapped (or, seated, natively clicked) */
function activatePill(b){
  const el = b.el;
  if(el.id === "contact") location.href = el.href;
  else if(el.id === "shake") armTilt();
}

/* while a pill is physics, its native click must never fire — taps are
   resolved by hand above, and a drag that ends on the element would
   otherwise still navigate (pointer capture keeps the click on it) */
function pillClickGuard(e){
  if(this.classList.contains("live")){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}

/* ================================================================
   Tilt the world — on touch devices the phone's orientation rotates
   gravity itself, so the pile slides along the floor into a corner
   like beads in a box. Armed inside the first pointerdown (iOS only
   grants motion permission during a gesture; everyone else just gets
   the listener). Desktop never prompts, denial is silently accepted,
   and reduced-motion never even reaches this code — the whole IIFE
   returned long ago.
   ================================================================ */
const hasTouch = (navigator.maxTouchPoints || 0) > 0 ||
                 matchMedia("(pointer: coarse)").matches;
let tiltArmed = false;
let tiltDX = 0, tiltDY = 1;      // smoothed gravity direction (≈ unit)
let wakeDX = 0, wakeDY = 1;      // direction the pile last settled under
let devGamma = 0;                // smoothed roll, borrowed for the r1's idle sway
const WAKE_DOT = Math.cos(4 * Math.PI / 180);
const TILT_PIVOT = 25 * Math.PI / 180;  // neutral pitch — phones are held, not laid flat:
const TILT_GAIN  = 1.4;                 // ~50° hold reads as gentle down; ~45° back-tilt
                                        // from the hand swings gravity into reverse.
                                        // (Pivot applies to device pitch — tuned for
                                        // portrait, the way phones are actually held.)

function onTilt(e){
  if(e.beta == null || e.gamma == null) return;
  const beta  = e.beta  * Math.PI / 180;
  const gamma = e.gamma * Math.PI / 180;
  devGamma += (gamma - devGamma) * .15;
  // re-centered pitch: subtract the natural holding angle, amplify a touch
  let be = (beta - TILT_PIVOT) * TILT_GAIN;
  be = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, be));
  // in-plane gravity in portrait device coords (screen y down):
  // g_device = (cosβ'·sinγ, sinβ') of a unit earth-gravity vector
  let gx = Math.cos(be) * Math.sin(gamma);
  let gy = Math.sin(be);
  // …rotated into page coords when the UI is in landscape
  const ang = (screen.orientation && typeof screen.orientation.angle === "number")
    ? screen.orientation.angle
    : (typeof window.orientation === "number" ? window.orientation : 0);
  if(ang){
    const ar = ang * Math.PI / 180, ca = Math.cos(ar), sa = Math.sin(ar);
    const px = gx * ca + gy * sa, py = gy * ca - gx * sa;
    gx = px; gy = py;
  }
  const m = Math.hypot(gx, gy);
  // a phone lying nearly flat has no in-plane pull — level means down
  const dx = m < .15 ? 0 : gx / m;
  const dy = m < .15 ? 1 : gy / m;
  tiltDX += (dx - tiltDX) * .15;   // low-pass so the pile doesn't buzz
  tiltDY += (dy - tiltDY) * .15;
  const n = Math.hypot(tiltDX, tiltDY) || 1;
  gravX = G * tiltDX / n;          // magnitude stays exactly G
  gravY = G * tiltDY / n;
  // sleepers only stir once the world has genuinely turned (~4°)
  if((tiltDX * wakeDX + tiltDY * wakeDY) / n < WAKE_DOT){
    wakeDX = tiltDX / n; wakeDY = tiltDY / n;
    wakeAll();
    start();
  }
}

function armTilt(){
  if(tiltArmed || !hasTouch || typeof DeviceOrientationEvent === "undefined")
    return;
  tiltArmed = true;
  const done = ok => {
    if(ok) addEventListener("deviceorientation", onTilt);
    if(shakeBtn){                    // the button's job is over either way
      shakeBtn.classList.add("gone");
      shakeBtn.disabled = true;
      setTimeout(() => {             // after the fade, leave no trace: the
        const b = bodyByEl.get(shakeBtn);      // body, the element, the seat
        if(b) removeBody(b);
        else shakeBtn.remove();
        if(ghostShake) ghostShake.hidden = true;
      }, 400);
    }
  };
  const ask = DeviceOrientationEvent.requestPermission;
  if(typeof ask === "function"){
    ask.call(DeviceOrientationEvent)
      .then(state => done(state === "granted"))
      .catch(() => done(false));     // denied or frame-blocked: gravity stays down
  } else {
    done(true);
  }
}

/* "Shake it up" — motion is opt-in via an explicit tap, never a surprise
   permission prompt. The button only exists where tilt could work. */
const shakeBtn = document.getElementById("shake");
if(shakeBtn && hasTouch && typeof DeviceOrientationEvent !== "undefined"){
  shakeBtn.hidden = false;
  shakeBtn.addEventListener("click", () => {   // live taps arm via activatePill
    if(!shakeBtn.classList.contains("live")) armTilt();
  });
}

/* ================================================================
   Pills — the four bits of page UI are rigid bodies too. They spill
   with the letters, drag and fling like them, and home to seats kept
   by ghost clones (a hidden shake pill's clone stays hidden with it,
   so the row's twin always lays out like the real one). Seated, they
   are plain links and buttons again. Reduced motion never reaches
   this code — the IIFE returned long ago.
   ================================================================ */
const pillEls = [                      // only the under-name row falls now —
  shakeBtn,                            // the corner is static wayfinding
  document.getElementById("contact"),
];
const grow    = document.getElementById("grow");
let ghostShake = null;
pillEls.forEach((el, k) => {
  const c = el.cloneNode(true);        // the ghost twin gains a pill clone
  c.removeAttribute("id");
  grow.appendChild(c);
  seats.push(c);                       // seatRect(i) now answers for pills too
  if(el === shakeBtn) ghostShake = c;
  el.addEventListener("click", pillClickGuard);
  if(el.hidden) return;                // no body for a pill that isn't shown
  const b = mkBody(el, "pill");
  b.i = letters.length + k;            // seats[13..16], gaps where pills hide
  bodies.push(b);                      // geometry arrives at goLive, measured
});

/* ---- home: the name puts itself back together (letters only) ---- */
function goHome(){
  if(mode === "seated" || mode === "homing") return;
  clearTimeout(fallTimer);
  if(held && held.kind !== "toy"){             // the hand lets go of homers;
    held.el.classList.remove("held");          // a held toy stays held
    held = null;
    tap = null;
    if(pointerId !== null){
      removeEventListener("pointermove", onMove);
      removeEventListener("pointerup", onUp);
      removeEventListener("pointercancel", onUp);
      document.body.classList.remove("grabbing");
      pointerId = null;
    }
  }
  const now = performance.now();
  const TAU = Math.PI * 2;
  for(const b of bodies){
    if(b.kind === "toy") continue;
    b.homeDelay = now + b.i * 35;         // pills trail in after the last letter
    b.homed = false;
    b.a -= Math.round(b.a / TAU) * TAU;   // untwist the short way, not N full turns
  }
  wakeAll();          // toys must notice their bed of letters leaving
  mode = "homing";
  start();
}
function seatAll(){
  mode = "seated";
  for(const b of bodies){
    if(b.kind === "toy") continue;
    b.el.classList.remove("live");
    b.el.style.transform = "";
  }
  // nothing ever left its parent — dropping .live restores text flow, and
  // the pills are genuine focusable links and buttons again
  document.getElementById("name").style.height = "";
  document.getElementById("pillrow").style.height = "";
}
addEventListener("keydown", e => { if(e.key === "Escape") goHome(); });
addEventListener("dblclick", goHome);

/* ================================================================
   Contacts — AABB broadphase, SAT narrowphase with reference-face
   clipping (up to two contact points per pair), then a small
   sequential-impulse solver with rotation, friction, warm-started
   impulses (matched across frames by body pair + feature id) and
   split-impulse positional cleanup: penetration is resolved by pure
   position projection that never feeds the velocities, so piles rest
   without buzzing. Everything below reuses preallocated objects; the
   hot loop allocates nothing.
   ================================================================ */
const contacts = [];
for(let i = 0; i < 256; i++){
  contacts.push({ a:null, b:null, px:0, py:0, nx:0, ny:0, pen:0, fid:0,
                  rax:0, ray:0, rbx:0, rby:0, mN:1, mT:1, bias:0, jn:0, jt:0 });
}
let nContacts = 0;

/* last frame's impulses, keyed by (body id, body id, feature id): each
   frame's solve starts where the last one ended instead of from zero,
   so stacks converge instead of re-shuddering every frame */
const prevA = new Int32Array(256), prevB = new Int32Array(256),
      prevF = new Int32Array(256);
const prevJn = new Float64Array(256), prevJt = new Float64Array(256);
let nPrev = 0;

function addContact(A, B, px, py, nx, ny, pen, fid){
  if(nContacts >= contacts.length) return;
  const c = contacts[nContacts++];
  c.a = A; c.b = B; c.px = px; c.py = py; c.nx = nx; c.ny = ny;
  c.pen = pen; c.fid = fid; c.jn = 0; c.jt = 0;
}

function updateWorld(b){
  const s = Math.sin(b.a), c = Math.cos(b.a);
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for(let i = 0; i < b.nv; i++){
    const wx = b.x + b.lv[i].x * c - b.lv[i].y * s;
    const wy = b.y + b.lv[i].x * s + b.lv[i].y * c;
    b.wv[i].x = wx; b.wv[i].y = wy;
    if(wx < minx) minx = wx; if(wx > maxx) maxx = wx;
    if(wy < miny) miny = wy; if(wy > maxy) maxy = wy;
  }
  b.minx = minx; b.miny = miny; b.maxx = maxx; b.maxy = maxy;
}

/* SAT: the least-overlapped face of A against B (positive = separated) */
const satRes = { sep:0, edge:0 };
function maxSeparation(A, B){
  let best = -1e9, bestE = 0;
  for(let i = 0; i < A.nv; i++){
    const j = (i + 1) % A.nv;
    const ex = A.wv[j].x - A.wv[i].x, ey = A.wv[j].y - A.wv[i].y;
    const il = 1 / (Math.hypot(ex, ey) || 1);
    const nx = ey * il, ny = -ex * il;        // outward for our winding
    let minD = 1e9;
    for(let k = 0; k < B.nv; k++){
      const d = (B.wv[k].x - A.wv[i].x) * nx + (B.wv[k].y - A.wv[i].y) * ny;
      if(d < minD) minD = d;
    }
    if(minD > best){ best = minD; bestE = i; }
  }
  satRes.sep = best; satRes.edge = bestE;
}

/* clip the incident edge to the reference face; emit 1–2 contacts */
function collidePoly(A, B){
  maxSeparation(A, B); const sepA = satRes.sep, eA = satRes.edge;
  if(sepA > 0) return;
  maxSeparation(B, A); const sepB = satRes.sep, eB = satRes.edge;
  if(sepB > 0) return;
  let R, I, edge, flip;
  if(sepB > sepA + .05){ R = B; I = A; edge = eB; flip = true; }
  else                 { R = A; I = B; edge = eA; flip = false; }

  const e2 = (edge + 1) % R.nv;
  const v1x = R.wv[edge].x, v1y = R.wv[edge].y;
  const v2x = R.wv[e2].x,   v2y = R.wv[e2].y;
  let ex = v2x - v1x, ey = v2y - v1y;
  const el0 = Math.hypot(ex, ey) || 1;
  ex /= el0; ey /= el0;
  const nx = ey, ny = -ex;                    // reference face normal, R -> I

  // incident edge: the face of I most opposed to the reference normal
  let bi = 0, bd = 1e9;
  for(let i = 0; i < I.nv; i++){
    const j = (i + 1) % I.nv;
    const iex = I.wv[j].x - I.wv[i].x, iey = I.wv[j].y - I.wv[i].y;
    const il = 1 / (Math.hypot(iex, iey) || 1);
    const d = (iey * il) * nx + (-iex * il) * ny;
    if(d < bd){ bd = d; bi = i; }
  }
  const bj = (bi + 1) % I.nv;
  let p1x = I.wv[bi].x, p1y = I.wv[bi].y;
  let p2x = I.wv[bj].x, p2y = I.wv[bj].y;

  // clip to the side plane at v1 (keep the +e side)
  let d1 = (p1x - v1x) * ex + (p1y - v1y) * ey;
  let d2 = (p2x - v1x) * ex + (p2y - v1y) * ey;
  if(d1 < 0 && d2 < 0) return;
  if(d1 < 0){ const t = d1 / (d1 - d2); p1x += (p2x - p1x) * t; p1y += (p2y - p1y) * t; }
  else if(d2 < 0){ const t = d2 / (d2 - d1); p2x += (p1x - p2x) * t; p2y += (p1y - p2y) * t; }

  // clip to the side plane at v2 (keep the -e side)
  d1 = (p1x - v2x) * -ex + (p1y - v2y) * -ey;
  d2 = (p2x - v2x) * -ex + (p2y - v2y) * -ey;
  if(d1 < 0 && d2 < 0) return;
  if(d1 < 0){ const t = d1 / (d1 - d2); p1x += (p2x - p1x) * t; p1y += (p2y - p1y) * t; }
  else if(d2 < 0){ const t = d2 / (d2 - d1); p2x += (p1x - p2x) * t; p2y += (p1y - p2y) * t; }

  // keep whatever ended up behind the face; normal must point A -> B.
  // The feature id records which faces made each point — the warm-start key.
  const cnx = flip ? -nx : nx, cny = flip ? -ny : ny;
  const fid = (flip ? 2048 : 0) | (edge << 7) | (bi << 3);
  let s1 = (p1x - v1x) * nx + (p1y - v1y) * ny;
  if(s1 <= 0) addContact(A, B, p1x, p1y, cnx, cny, -s1, fid);
  let s2 = (p2x - v1x) * nx + (p2y - v1y) * ny;
  if(s2 <= 0) addContact(A, B, p2x, p2y, cnx, cny, -s2, fid | 1);
}

/* walls and floor as planes; up to two deepest vertices per plane so a
   flat landing rests on both corners of its bottom edge */
let pd1 = 0, pd2 = 0, pi1 = -1, pi2 = -1;
function planePick(b, sideX, sideY, offset){
  pd1 = -1e9; pd2 = -1e9; pi1 = -1; pi2 = -1;
  for(let i = 0; i < b.nv; i++){
    const d = b.wv[i].x * sideX + b.wv[i].y * sideY - offset;   // penetration depth
    if(d > pd1){ pd2 = pd1; pi2 = pi1; pd1 = d; pi1 = i; }
    else if(d > pd2){ pd2 = d; pi2 = i; }
  }
}
function planeContacts(b, W, H){
  // (plane feature ids live above 4096: plane index << 4, plus the vertex)
  // floor — the line the critique was about: hull verts, not a circle
  planePick(b, 0, 1, H);
  if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, 0, 1, Math.max(pd1, 0), 4096 | pi1);
  if(pd2 > -1 && pi2 !== pi1) addContact(b, null, b.wv[pi2].x, b.wv[pi2].y, 0, 1, Math.max(pd2, 0), 4096 | pi2);
  // left wall
  planePick(b, -1, 0, 0);
  if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, -1, 0, Math.max(pd1, 0), 4096 | 16 | pi1);
  // right wall
  planePick(b, 1, 0, W);
  if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, 1, 0, Math.max(pd1, 0), 4096 | 32 | pi1);
  // ceiling — off while a toy is still dropping in from above
  if(!b.entering){
    planePick(b, 0, -1, 0);
    if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, 0, -1, Math.max(pd1, 0), 4096 | 48 | pi1);
  }
}

/* precompute effective masses + restitution bias; apply warm-start impulses */
function prepContact(c){
  const A = c.a, B = c.b;
  A.touch = 1; if(B) B.touch = 1;
  c.rax = c.px - A.x; c.ray = c.py - A.y;
  if(B){ c.rbx = c.px - B.x; c.rby = c.py - B.y; }
  const raN = c.rax * c.ny - c.ray * c.nx;
  const rbN = B ? (c.rbx * c.ny - c.rby * c.nx) : 0;
  const iMb = B ? B.iM : 0, iIb = B ? B.iI : 0;
  const kn = A.iM + iMb + A.iI * raN * raN + iIb * rbN * rbN;
  c.mN = kn > 1e-9 ? 1 / kn : 0;      // two immovables: no impulse, no drama
  const tx = -c.ny, ty = c.nx;
  const raT = c.rax * ty - c.ray * tx;
  const rbT = B ? (c.rbx * ty - c.rby * tx) : 0;
  const kt = A.iM + iMb + A.iI * raT * raT + iIb * rbT * rbT;
  c.mT = kt > 1e-9 ? 1 / kt : 0;

  let rvx = -(A.vx - A.va * c.ray), rvy = -(A.vy + A.va * c.rax);
  if(B){ rvx += B.vx - B.va * c.rby; rvy += B.vy + B.va * c.rbx; }
  const vn = rvx * c.nx + rvy * c.ny;
  c.bias = vn < -REST_MIN ? -REST * vn : 0;   // resting contact: zero bounce

  // an arriving impact wakes sleepers
  if(vn < -WAKE_V){
    if(A.sleeping) wake(A);
    if(B && B.sleeping) wake(B);
  }
  // a hard-enough hit sends a 3D toy tumbling in depth (it rides the
  // solver's contacts — no collision detection of its own)
  if(vn < -R1_KICK_MIN){
    if(A.tumbles) kickTumble(A, -vn, c.nx, c.ny);
    else if(B && B.tumbles) kickTumble(B, -vn, c.nx, c.ny);
  }

  // warm start: begin from the impulse this same contact carried last
  // frame, applied up front, so the stack holds itself without re-impact
  const ida = A.id, idb = B ? B.id : -1;
  for(let k = 0; k < nPrev; k++){
    if(prevA[k] === ida && prevB[k] === idb && prevF[k] === c.fid){
      c.jn = prevJn[k]; c.jt = prevJt[k];
      const px = c.jn * c.nx + c.jt * tx, py = c.jn * c.ny + c.jt * ty;
      A.vx -= px * A.iM; A.vy -= py * A.iM;
      A.va -= (c.rax * py - c.ray * px) * A.iI;
      if(B){
        B.vx += px * B.iM; B.vy += py * B.iM;
        B.va += (c.rbx * py - c.rby * px) * B.iI;
      }
      break;
    }
  }
}

function solveVel(c){
  const A = c.a, B = c.b;
  let rvx = -(A.vx - A.va * c.ray), rvy = -(A.vy + A.va * c.rax);
  if(B){ rvx += B.vx - B.va * c.rby; rvy += B.vy + B.va * c.rbx; }
  const vn = rvx * c.nx + rvy * c.ny;
  let dj = -(vn - c.bias) * c.mN;
  const oj = c.jn;
  c.jn = Math.max(oj + dj, 0);
  dj = c.jn - oj;
  let px = dj * c.nx, py = dj * c.ny;
  A.vx -= px * A.iM; A.vy -= py * A.iM;
  A.va -= (c.rax * py - c.ray * px) * A.iI;
  if(B){
    B.vx += px * B.iM; B.vy += py * B.iM;
    B.va += (c.rbx * py - c.rby * px) * B.iI;
  }
  // Coulomb-ish friction: tangential impulse clamped to mu * normal
  rvx = -(A.vx - A.va * c.ray); rvy = -(A.vy + A.va * c.rax);
  if(B){ rvx += B.vx - B.va * c.rby; rvy += B.vy + B.va * c.rbx; }
  const tx = -c.ny, ty = c.nx;
  const vt = rvx * tx + rvy * ty;
  let djt = -vt * c.mT;
  const maxF = MU * c.jn, ot = c.jt;
  c.jt = Math.min(Math.max(ot + djt, -maxF), maxF);
  djt = c.jt - ot;
  px = djt * tx; py = djt * ty;
  A.vx -= px * A.iM; A.vy -= py * A.iM;
  A.va -= (c.rax * py - c.ray * px) * A.iI;
  if(B){
    B.vx += px * B.iM; B.vy += py * B.iM;
    B.va += (c.rbx * py - c.rby * px) * B.iI;
  }
}

function solvePos(c){
  if(c.pen <= SLOP) return;
  const A = c.a, B = c.b;
  const iMb = B ? B.iM : 0;
  const total = A.iM + iMb;
  if(total <= 0) return;
  const corr = BAUM * (c.pen - SLOP) / total;
  A.x -= c.nx * corr * A.iM; A.y -= c.ny * corr * A.iM;
  if(B){ B.x += c.nx * corr * iMb; B.y += c.ny * corr * iMb; }
  c.pen -= BAUM * (c.pen - SLOP);
}

/* ---- the loop ---- */
function start(){
  if(!raf){ lastT = performance.now(); raf = requestAnimationFrame(step); }
}

function simActive(b, t){
  if(b.kind === "toy") return true;          // toys never stop being physical
  if(mode === "live") return t >= b.dropAt || b === held;
  return false;                              // seated / homing letters go elsewhere
}

function floorSnap(b, H){
  // asleep means at rest — put the lowest hull vertex exactly ON the line
  updateWorld(b);
  let maxy = -1e9;
  for(let i = 0; i < b.nv; i++) if(b.wv[i].y > maxy) maxy = b.wv[i].y;
  const d = H - maxy;
  if(d > -3 && d < 3) b.y += d;
}

/* one last de-penetration before a body sleeps: project it clear of the
   walls and of everything nearby so nothing ever sleeps overlapping.
   Position-only, moves only the sleeper-to-be, and measures TRUE overlap
   with the SAT (clip points under-report angled overlaps). Planes go
   last within each pass so the floor always has the final word.
   (Sleeping bodies stay immovable to the position pass, so live bodies
   are pushed OUT of them, never through.) */
const depN = { x:0, y:0 };
function depFaceNormal(A, e){
  const j = (e + 1) % A.nv;
  const ex = A.wv[j].x - A.wv[e].x, ey = A.wv[j].y - A.wv[e].y;
  const il = 1 / (Math.hypot(ex, ey) || 1);
  depN.x = ey * il; depN.y = -ex * il;
}
function depenetrate(b, W, H){
  for(let pass = 0; pass < 6; pass++){
    updateWorld(b);
    let moved = false;
    for(const o of bodies){
      if(o === b || !o.col) continue;
      if(b.minx > o.maxx || o.minx > b.maxx ||
         b.miny > o.maxy || o.miny > b.maxy) continue;
      maxSeparation(b, o); const sA = satRes.sep, eA = satRes.edge;
      if(sA >= -.1) continue;
      maxSeparation(o, b); const sB = satRes.sep, eB = satRes.edge;
      if(sB >= -.1) continue;
      // slide b out along the least-overlap axis, leaving a .1px kiss
      if(sA >= sB){ depFaceNormal(b, eA); b.x -= depN.x * (-sA - .1); b.y -= depN.y * (-sA - .1); }
      else        { depFaceNormal(o, eB); b.x += depN.x * (-sB - .1); b.y += depN.y * (-sB - .1); }
      moved = true;
      updateWorld(b);
    }
    // walls and floor, hard: flush is fine, inside is not
    let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    for(let i = 0; i < b.nv; i++){
      const p = b.wv[i];
      if(p.x < minx) minx = p.x; if(p.x > maxx) maxx = p.x;
      if(p.y < miny) miny = p.y; if(p.y > maxy) maxy = p.y;
    }
    if(maxy > H){ b.y -= maxy - H; moved = true; }
    if(minx < 0){ b.x -= minx; moved = true; }
    if(maxx > W){ b.x -= maxx - W; moved = true; }
    if(miny < 0 && !b.entering){ b.y -= miny; moved = true; }
    if(!moved) break;
  }
}

function step(t){
  raf = 0;
  const dt = Math.min(Math.max((t - lastT) / 1000, .0005), 1 / 30);
  lastT = t;
  const W = innerWidth, H = innerHeight;

  // gravity + drag on everything awake — the held body included: it
  // stays fully dynamic, and the pin below is what carries it
  for(const b of bodies){
    b.sim = simActive(b, t);
    b.touch = 0;
    // held is never immovable — just modestly heavier to the pile, so a
    // shove nudges it in the hand instead of knocking it off the finger
    b.iM = b.sleeping ? 0 : (b === held ? b.invM / HOLD_MASS : b.invM);
    b.iI = b.sleeping ? 0 : (b === held ? b.invI / HOLD_MASS : b.invI);
    if(!b.sim || b.sleeping) continue;
    b.vx += gravX * dt;
    b.vy += gravY * dt;
    const dmp = 1 - LIN_DAMP * dt;
    b.vx *= dmp; b.vy *= dmp;
    b.va *= 1 - ANG_DAMP * dt;
    const sp = Math.hypot(b.vx, b.vy);
    if(sp > MAXV * 1.8){ b.vx *= MAXV * 1.8 / sp; b.vy *= MAXV * 1.8 / sp; }
  }

  // the grip is a pin: a stiff critically-damped spring at the exact
  // caught point. Grabbed by the end of a stem, gravity torques the
  // letter to hang and swing below the finger; grabbed at the centroid
  // it carries with almost no turn. Velocity-substepped so the
  // stiffness stays stable even at the 30fps dt clamp.
  if(held){
    const hb = held;
    const c0 = Math.cos(hb.a), s0 = Math.sin(hb.a);
    const rx = c0 * grabLX - s0 * grabLY;      // r = R(angle) · anchor
    const ry = s0 * grabLX + c0 * grabLY;
    let px = hb.x + rx, py = hb.y + ry;        // world anchor, advanced below
    const mi = hb.invI / hb.invM;              // m/I — force at r into spin
    const K2 = HOLD_WN * HOLD_WN, DD = 2 * HOLD_ZETA * HOLD_WN;
    const h = dt / HOLD_SUB;
    for(let s = 0; s < HOLD_SUB; s++){
      let ex = target.x - px, ey = target.y - py;
      const el = Math.hypot(ex, ey);           // yank guard: a pointer teleport
      if(el > HOLD_ERR){ ex *= HOLD_ERR / el; ey *= HOLD_ERR / el; }
      const vax = hb.vx - hb.va * ry;          // velocity of the anchor point
      const vay = hb.vy + hb.va * rx;
      const ax = K2 * ex - DD * vax;           // F/m at the anchor
      const ay = K2 * ey - DD * vay;
      hb.vx += ax * h;
      hb.vy += ay * h;
      hb.va += (rx * ay - ry * ax) * mi * h;   // (r × F)/I
      px += (hb.vx - hb.va * ry) * h;          // virtual anchor keeps the spring
      py += (hb.vy + hb.va * rx) * h;          // pointed right within the frame
    }
    // damp the swing ABOUT THE GRIP: shed the paired linear velocity too,
    // or the pin just converts it back into spin — pendulums die politely
    {
      const dw = -HOLD_ADAMP * dt * hb.va;
      hb.va += dw;
      hb.vx += dw * ry;
      hb.vy -= dw * rx;
      if(hb.va >  HOLD_WMAX) hb.va =  HOLD_WMAX;
      if(hb.va < -HOLD_WMAX) hb.va = -HOLD_WMAX;
    }
    if(hb.tumbles){
      // carried: no posed tilt — residual spin just dies out in the hand
      // and the toy hangs at whatever angle you caught it at
      const dk = Math.exp(-dt * 4);
      hb.wx *= dk; hb.wy *= dk;
      hb.rx = dAng(hb.rx + hb.wx * dt);
      hb.ry = dAng(hb.ry + hb.wy * dt);
      hb.poseCalm = false;                     // it re-settles after release
    }
  }

  // homing letters: simple kinematic springs to their seats, no collision —
  // the toys keep their ordinary physics underneath
  if(mode === "homing"){
    let allHome = true;
    for(const b of bodies){
      if(b.kind === "toy" || b.homed) continue;
      if(t < b.homeDelay){ allHome = false; continue; }
      const s = seatRect(b.i);
      const hx = s.left + b.cx, hy = s.top + b.cy;
      const K = 170, D = 20;
      b.vx += (-K * (b.x - hx) - D * b.vx) * dt;
      b.vy += (-K * (b.y - hy) - D * b.vy) * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.a += (0 - b.a) * Math.min(1, dt * 9);   // untwist on the way home
      if(Math.hypot(b.x - hx, b.y - hy) < 1 && Math.hypot(b.vx, b.vy) < 30
         && Math.abs(b.a) < .02){
        b.x = hx; b.y = hy; b.vx = b.vy = 0; b.a = 0; b.va = 0; b.homed = true;
      } else allHome = false;
    }
    if(allHome) seatAll();       // letters return to text; toys carry on below
  }

  // a 3D toy's collider width tracks its yaw — face-on the full octagon,
  // edge-on a thin slab (a fattening hull pushes, never teleports)
  for(const b of bodies) if(b.tumbles) r1TrackWidth(b);

  // broadphase + narrowphase
  nContacts = 0;
  for(const b of bodies){
    b.col = b.sim && !(b.kind !== "toy" && mode === "homing");
    if(b.col) updateWorld(b);
  }
  for(let i = 0; i < bodies.length; i++){
    const A = bodies[i];
    if(!A.col) continue;
    for(let j = i + 1; j < bodies.length; j++){
      const B = bodies[j];
      if(!B.col) continue;
      if(A.sleeping && B.sleeping) continue;
      if(A.minx > B.maxx || B.minx > A.maxx || A.miny > B.maxy || B.miny > A.maxy) continue;
      if(A === held && B.sleeping) wake(B);   // the hand shoves sleepers awake
      if(B === held && A.sleeping) wake(A);
      collidePoly(A, B);
    }
    if(!A.sleeping || A === held) planeContacts(A, W, H);
  }

  for(let i = 0; i < nContacts; i++) prepContact(contacts[i]);
  for(let it = 0; it < VEL_ITERS; it++)
    for(let i = 0; i < nContacts; i++) solveVel(contacts[i]);

  // a body that is slow AND touching something is trying to settle:
  // bleed off the residual rock so thin letters stop teetering
  for(const b of bodies){
    if(!b.sim || b === held || b.sleeping || !b.touch) continue;
    if(Math.hypot(b.vx, b.vy) < 50){
      b.va *= Math.max(0, 1 - SETTLE_ANG * dt);
      b.vx *= Math.max(0, 1 - SETTLE_LIN * dt);
    }
  }

  // integrate positions — the held body too: the pin is a force, not a
  // hand of god, so the grab point tracks the finger through real motion
  for(const b of bodies){
    if(!b.sim || b.sleeping) continue;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.a += b.va * dt;
    if(b.tumbles && b !== held) tumbleStep(b, dt);  // held tumble damps above
    if(b.entering && b.y > b.rad + 6) b.entering = false;  // fully inside now
  }

  for(let it = 0; it < POS_ITERS; it++)
    for(let i = 0; i < nContacts; i++) solvePos(contacts[i]);

  // remember this frame's impulses for next frame's warm start
  nPrev = nContacts;
  for(let i = 0; i < nContacts; i++){
    const c = contacts[i];
    prevA[i] = c.a.id; prevB[i] = c.b ? c.b.id : -1;
    prevF[i] = c.fid; prevJn[i] = c.jn; prevJt[i] = c.jt;
  }

  /* nothing may ever be lost */
  for(const b of bodies){
    if(!isFinite(b.x + b.y + b.vx + b.vy + b.a + b.va)){
      if(b.kind !== "toy"){
        const s = seatRect(b.i);
        b.x = s.left + b.cx; b.y = s.top + b.cy;
      } else {
        b.x = W / 2; b.y = H - b.rad - 2;
      }
      b.vx = b.vy = b.a = b.va = 0;
    }
    if(b.tumbles && !isFinite(b.rx + b.ry + b.wx + b.wy)){
      b.rx = b.ry = b.wx = b.wy = 0;      // level the pose; the hull re-fattens next track
      b.poseCalm = true;
    }
    if(b.sim && b !== held){
      if(b.x < 2) b.x = 2;
      if(b.x > W - 2) b.x = W - 2;
      if(b.y > H - 2) b.y = H - 2;
      if(!b.entering && b.y < -b.rad * 2) b.y = -b.rad * 2;
    }
  }

  render(t);

  // per-body sleep: genuinely still for a beat, then out cold —
  // a throw's apex (speed ~0 for a frame) never freezes anything
  let anyAwake = false, anyWaiting = false, justSnapped = false;
  for(const b of bodies){
    if(!b.sim){
      if(b.kind !== "toy" && mode === "live" && t < b.dropAt) anyWaiting = true;
      continue;
    }
    if(b === held){ anyAwake = true; continue; }
    if(b.sleeping) continue;
    const slowV = Math.hypot(b.vx, b.vy) < SLEEP_LIN && Math.abs(b.va) < SLEEP_ANG;
    const nearAnchor = Math.abs(b.x - b.sx) < SLEEP_DX &&
                       Math.abs(b.y - b.sy) < SLEEP_DX &&
                       Math.abs(b.a - b.sa) < SLEEP_DA;
    // (the r1 also may not sleep while its pose spring is still rocking)
    if((slowV || nearAnchor) && !b.entering && (!b.tumbles || b.poseCalm)){
      // resting bodies still show spiky per-frame speeds (the solver's
      // heartbeat), so "hasn't actually gone anywhere" also counts as still
      b.still += dt;
      if(b.still > SLEEP_T){
        b.sleeping = true;
        b.vx = b.vy = b.va = 0;
        floorSnap(b, H);
        depenetrate(b, W, H);   // nothing ever sleeps overlapping
        justSnapped = true;
        continue;
      }
    } else {
      b.sx = b.x; b.sy = b.y; b.sa = b.a;
      b.still = 0;
    }
    anyAwake = true;
  }

  // a body snapped flush this frame was already painted pre-snap;
  // repaint so the loop never stops on a stale, ~1px-off frame
  if(justSnapped) render(t);

  const busy = held || mode === "homing" || anyAwake || anyWaiting ||
               any3DBusy();            // a 3D toy's pose may still be settling
  if(busy) raf = requestAnimationFrame(step);
}

function render(t){
  for(const b of bodies){
    if(b.kind !== "toy"){
      if(mode === "seated") continue;
      if(mode === "live" && t < b.dropAt && b !== held){
        // waiting letters (and pills) hold their seat, pixel-perfect
        b.el.style.transform = "translate3d(" + (b.x - b.cx).toFixed(2) + "px," +
                               (b.y - b.cy).toFixed(2) + "px,0)";
        continue;
      }
    }
    // place the centroid, rotate about it, then offset back to the box corner
    b.el.style.transform = "translate3d(" + b.x.toFixed(2) + "px," + b.y.toFixed(2) +
      "px,0) rotate(" + b.a.toFixed(3) + "rad)" + " translate(" +
      (-b.cx).toFixed(2) + "px," + (-b.cy).toFixed(2) + "px)";
    if(b.draw3d) b.draw3d(t, b);   // repaint the canvas sprite if it changed
  }
}

/* ================================================================
   The toys — a rabbit r1 and an iPhone 17 Pro, each rendering its
   real baked mesh through WebGL. The r1 degrades to flat divs when
   it can't; the iPhone simply stays home. They crash the pile a
   beat after the first spill and then live on this page forever:
   reassembly ignores them, re-spills rain letters onto them, and
   they drag and fling like everything else.
   ================================================================ */
/* a rounded-slab octagon about the centroid — shared by the toys and
   the pills. w/h/cut describe the HULL; bw/bh (default w/h) are the
   element box the centroid sits in, because the iPhone draws on a
   square canvas wider than the slab it actually is. */
function setSlabGeometry(b, w, h, cut, dens, bw, bh){
  const w2 = w / 2, h2 = h / 2, c = cut;
  const oct = [
    {x:-w2 + c, y:-h2}, {x:w2 - c, y:-h2}, {x:w2, y:-h2 + c}, {x:w2, y:h2 - c},
    {x:w2 - c, y:h2}, {x:-w2 + c, y:h2}, {x:-w2, y:h2 - c}, {x:-w2, y:-h2 + c},
  ];
  const g = polyProps(oct, 8, dens);
  b.nv = 8;
  b.cx = (bw || w) / 2; b.cy = (bh || h) / 2;   // symmetric: centroid = box centre
  b.m = Math.max(60, g.area * dens); b.invM = 1 / b.m;
  b.I = g.I; b.invI = 1 / b.I;
  let r = 0;
  for(let i = 0; i < 8; i++){
    b.lv[i].x = oct[i].x; b.lv[i].y = oct[i].y;
    r = Math.max(r, Math.hypot(oct[i].x, oct[i].y));
  }
  b.rad = r;
  b.toyW = w; b.toyH = h; b.toyCut = cut;   // the depth-aware hull re-cuts from these
  b.hullW = w;
}
function toyBody(el, w, h, cut, bw, bh){
  const b = mkBody(el, "toy");
  setSlabGeometry(b, w, h, cut, TOY_DENS, bw, bh);
  return b;
}

/* ---- the 3D toys' depth tumble --------------------------------------
   Real angular state in depth: pitch rx and yaw ry (rad) with angular
   velocities wx, wy — while the solver's in-plane angle b.a stays
   untouched. Flings and impacts kick it, air and ground drag calm it,
   and once the body is down and slow a lightly under-damped spring
   rocks it onto the nearest stable pose: face (0), back (±PI), or
   standing edge-on like a coin (±PI/2). The collision hull narrows to
   match the silhouette as it turns. Only the WebGL toys set b.tumbles —
   the flat CSS r1 fallback has no depth to tumble through. */
function dAng(d){          // wrap any angle difference into [-PI, PI)
  d = (d + Math.PI) % (2 * Math.PI);
  if(d < 0) d += 2 * Math.PI;
  return d - Math.PI;
}
function rspin(){ return Math.random() < .5 ? -1 : 1; }
function clampW(v){ return Math.max(-R1_W_MAX, Math.min(R1_W_MAX, v)); }

/* an impact converts approach speed into tumble; the contact normal
   picks the axis mix (floors mostly pitch, walls mostly yaw), a little
   randomness keeps repeats from looking mechanical, and part of the
   old spin is scrubbed the way a real hit would. Rate-limited so a
   two-point landing kicks once, not twice. */
function kickTumble(b, speed, nx, ny){
  const now = performance.now();
  if(now - b.lastKick < 70) return;
  b.lastKick = now;
  b.poseCalm = false;
  const k = Math.min(R1_W_MAX, speed * R1_KICK_HIT);
  b.wx = clampW(b.wx * .6 + rspin() * k * (.25 + .75 * Math.abs(ny)) * (.6 + Math.random() * .4));
  b.wy = clampW(b.wy * .6 + rspin() * k * (.25 + .75 * Math.abs(nx)) * (.6 + Math.random() * .4));
}

/* nearest stable pose — but edge-on only when the tumble genuinely stops
   near ±90°: a slab rarely balances on its edge, so the coin stance stays rare */
/* integrate the tumble each awake frame (the held case lives in step).
   Fully organic: no target poses, no settle spring — spin just damps
   away and the r1 stays at whatever angle it stopped at. It lands
   where it lands. */
function tumbleStep(b, dt){
  if(b.poseCalm) return;                 // frozen mid-pose until the next kick
  const grounded = b.touch && Math.hypot(b.vx, b.vy) < 50;
  const dk = Math.exp(-(grounded ? R1_DAMP_SET
                       : b.touch ? R1_DAMP_GND : R1_DAMP_AIR) * dt);
  b.wx *= dk; b.wy *= dk;
  if(grounded && Math.abs(b.wx) < .04 && Math.abs(b.wy) < .04){
    b.wx = 0; b.wy = 0;
    b.poseCalm = true;                   // sleep may proceed; rAF may stop
    return;
  }
  b.rx = dAng(b.rx + b.wx * dt);
  b.ry = dAng(b.ry + b.wy * dt);
}

/* re-cut the octagon at a new effective width. Verts only — mass and
   inertia stay the face-on values. Fattening back up must shove
   neighbours through the solver, so sleepers within reach are woken
   rather than teleported through. */
function r1SetWidth(b, w){
  b.hullW = w;
  const w2 = w / 2, h2 = b.toyH / 2;
  const cx = Math.min(b.toyCut, w2 * .6);   // corners shrink so the slab stays convex
  const cy = b.toyCut;
  const v = b.lv;
  v[0].x = -w2 + cx; v[0].y = -h2;
  v[1].x =  w2 - cx; v[1].y = -h2;
  v[2].x =  w2;      v[2].y = -h2 + cy;
  v[3].x =  w2;      v[3].y =  h2 - cy;
  v[4].x =  w2 - cx; v[4].y =  h2;
  v[5].x = -w2 + cx; v[5].y =  h2;
  v[6].x = -w2;      v[6].y =  h2 - cy;
  v[7].x = -w2;      v[7].y = -h2 + cy;
  for(const o of bodies){
    if(o === b || !o.sleeping) continue;
    if(Math.hypot(o.x - b.x, o.y - b.y) < o.rad + b.rad + 6) wake(o);
  }
}
function r1TrackWidth(b){
  const thick = b.toyH * (b.thick3d || R1_THICK);  // never thinner than it is deep
  const eff = Math.max(thick,
    thick + (b.toyW - thick) * Math.abs(Math.cos(b.ry)));
  if(Math.abs(eff - b.hullW) > R1_HULL_DW) r1SetWidth(b, eff);
}

function capHeightPx(F){
  const h = HULLS["h"];               // the 'h' ascender stands in for cap height
  if(!h) return F * .72;
  let top = 0;
  for(const p of h) top = Math.min(top, p.y);
  return Math.max(F * .3, -top * F);
}

function makeRabbit(side){
  const el = document.createElement("div");
  el.className = "toy";
  el.setAttribute("aria-hidden", "true");
  const rr = Math.round(side * .16);
  el.style.cssText = "width:" + side + "px;height:" + side + "px;" +
    "background:#ff4d06;border-radius:" + rr + "px;";
  const screen = document.createElement("div");
  screen.style.cssText = "left:" + Math.round(side * .10) + "px;top:" +
    Math.round(side * .16) + "px;width:" + Math.round(side * .46) + "px;height:" +
    Math.round(side * .68) + "px;background:#141416;border-radius:" +
    Math.max(2, Math.round(side * .05)) + "px;";
  const wheel = document.createElement("div");
  const wd = Math.round(side * .30);
  wheel.style.cssText = "right:" + Math.round(side * .11) + "px;top:" +
    Math.round((side - wd) / 2) + "px;width:" + wd + "px;height:" + wd + "px;" +
    "background:#d83c00;border-radius:50%;";
  el.append(screen, wheel);
  return { el, w:side, h:side, cut:rr * .75 };
}

/* ================================================================
   The 3D toys — baked meshes drawn by a tiny hand-rolled WebGL1
   renderer, one shader family, two paths: a textured path (the
   r1's baseColor skin, the iPhone's wallpaper OLED) and a
   vertex-colored path (the iPhone's body, whose 17 materials were
   baked to per-vertex sRGB). Two-light lambert plus a soft rim so
   black faces still read. The solver's in-plane angle is untouched
   — each canvas is CSS-positioned and CSS-rotated by the body
   angle exactly like the flat toy it replaces. Depth, though, is
   real state: the body carries pitch/yaw (b.rx, b.ry) with angular
   velocity, kicked by flings and impacts, damping out wherever it
   stops, while the collision hull narrows to match (all of that
   lives up in the physics section; these painters just draw
   whatever pose the body holds). A second matrix folds the body
   angle back into the normals so the lights stay fixed on the page
   while the model tumbles. Missing mesh, no WebGL, or any failure
   at all: return null — the r1 then ships its flat CSS stand-in,
   the iPhone simply stays home.
   ================================================================ */
const busy3D = [];         // step() asks every 3D toy whether its pose settled
function any3DBusy(){
  for(let i = 0; i < busy3D.length; i++) if(busy3D[i]()) return true;
  return false;
}

function makeModelGL(batches, side, opts){
  const el = document.createElement("canvas");
  el.className = "toy";
  el.setAttribute("aria-hidden", "true");
  el.style.width = side + "px";
  el.style.height = side + "px";
  const glOpts = { alpha:true, antialias:true, premultipliedAlpha:true };
  let gl = null;
  try{
    gl = el.getContext("webgl", glOpts) || el.getContext("experimental-webgl", glOpts);
  }catch(err){ gl = null; }
  if(!gl) return null;

  function sh(kind, src){
    const s = gl.createShader(kind);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
  }
  function mkProg(vsSrc, fsSrc){
    const vs = sh(gl.VERTEX_SHADER, vsSrc), fs = sh(gl.FRAGMENT_SHADER, fsSrc);
    if(!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    return gl.getProgramParameter(p, gl.LINK_STATUS) ? p : null;
  }
  // the same lambert+rim tail for both paths; only where c comes from differs
  const LIGHT =
    "float ka=max(dot(n,vec3(-.42,.61,.67)),0.);" +      // key light, upper left front
    "float kb=max(dot(n,vec3(.79,-.33,.52)),0.);" +      // fill, lower right
    "float rim=pow(max(1.-abs(n.z),0.),2.6)*.3;" +       // fresnel-ish edge (max: no NaN on mediump rounding)
    "gl_FragColor=vec4(c*(.34+.66*ka+.2*kb)+rim,1.);";
  let progTex = null, locTex = null;
  if(batches.some(bt => bt.uv)){
    // uZB nudges a batch toward the viewer: the iPhone's OLED sits behind
    // its own cover glass, baked opaque black — without the nudge the
    // wallpaper loses the depth test to it. The r1 passes 0 (a no-op).
    progTex = mkProg(
      "attribute vec3 aP;attribute vec3 aN;attribute vec2 aT;" +
      "uniform mat3 uM;uniform mat3 uL;uniform float uZB;" +
      "varying vec3 vN;varying vec2 vT;" +
      "void main(){vec3 p=uM*aP;gl_Position=vec4(p.xy,-p.z*.35-uZB,1.);vN=uL*aN;vT=aT;}",
      "precision mediump float;uniform sampler2D uT;varying vec3 vN;varying vec2 vT;" +
      "void main(){vec3 n=normalize(vN);vec3 c=texture2D(uT,vT).rgb;" + LIGHT + "}");
    if(!progTex) return null;
    gl.useProgram(progTex);
    gl.uniform1i(gl.getUniformLocation(progTex, "uT"), 0);
    locTex = { prog:progTex,
               aP:gl.getAttribLocation(progTex, "aP"),
               aN:gl.getAttribLocation(progTex, "aN"),
               aX:gl.getAttribLocation(progTex, "aT"), xSize:2,
               uM:gl.getUniformLocation(progTex, "uM"),
               uL:gl.getUniformLocation(progTex, "uL"),
               uZB:gl.getUniformLocation(progTex, "uZB") };
  }
  let progCol = null, locCol = null;
  if(batches.some(bt => bt.rgb)){
    progCol = mkProg(
      "attribute vec3 aP;attribute vec3 aN;attribute vec3 aVertexColor;" +
      "uniform mat3 uM;uniform mat3 uL;varying vec3 vN;varying vec3 vC;" +
      "void main(){vec3 p=uM*aP;gl_Position=vec4(p.xy,-p.z*.35,1.);vN=uL*aN;vC=aVertexColor;}",
      "precision mediump float;varying vec3 vN;varying vec3 vC;" +
      "void main(){vec3 n=normalize(vN);vec3 c=vC;" + LIGHT + "}");
    if(!progCol) return null;
    locCol = { prog:progCol,
               aP:gl.getAttribLocation(progCol, "aP"),
               aN:gl.getAttribLocation(progCol, "aN"),
               aX:gl.getAttribLocation(progCol, "aVertexColor"), xSize:3,
               uM:gl.getUniformLocation(progCol, "uM"),
               uL:gl.getUniformLocation(progCol, "uL") };
  }

  /* painter state — the tumble itself lives on the body (b.rx, b.ry) */
  const mM = new Float32Array(9), mL = new Float32Array(9);
  let dirty = true, dead = false;
  let dpr0 = 0, lastA = 1e9, lastRx = 1e9, lastRy = 1e9;

  function vbo(data){
    const bo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bo);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    return bo;
  }
  const draws = batches.map(bt => {
    const d = { loc:bt.uv ? locTex : locCol,
                pos:vbo(bt.pos), nrm:vbo(bt.nrm), ext:vbo(bt.uv || bt.rgb),
                ibo:gl.createBuffer(), n:bt.idx.length, tex:null, img:null,
                zb:bt.zb || 0 };
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, bt.idx, gl.STATIC_DRAW);
    if(bt.tex){
      // 1px stand-in until the embedded JPEG decodes (ms)
      d.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, d.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE,
                    new Uint8Array(bt.fill));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const img = new Image();
      img.onload = () => { d.img = img; dirty = true; start(); };
      img.src = bt.tex;
    }
    return d;
  });
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 0);

  el.addEventListener("webglcontextlost", e => {
    e.preventDefault();
    dead = true;
    if(opts.onLost) opts.onLost(el);   // each model knows its own way down
  });

  function m3yx(ry, rx, s, out){      // column-major s · RotY(ry) · RotX(rx)
    const cy = Math.cos(ry), sy = Math.sin(ry);
    const cx = Math.cos(rx), sx = Math.sin(rx);
    out[0] = cy * s;      out[1] = 0;       out[2] = -sy * s;
    out[3] = sy * sx * s; out[4] = cx * s;  out[5] = cy * sx * s;
    out[6] = sy * cx * s; out[7] = -sx * s; out[8] = cy * cx * s;
  }
  function m3z(phi, m){               // m ← RotZ(phi) · m, in place
