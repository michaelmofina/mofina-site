  // keep whatever ended up behind the face; normal must point A -> B.
  // The feature id records which faces made each point — the warm-start key.
  const cnx = flip ? -nx : nx, cny = flip ? -ny : ny;
  const fid = (flip ? 2048 : 0) | (edge << 7) | (bi << 3);
  let s1 = (p1x - v1x) * nx + (p1y - v1y) * ny;
  if(s1 <= 0) addContact(A, B, p1x, p1y, cnx, cny, -s1, fid);
  let s2 = (p2x - v1x) * nx + (p2y - v1y) * ny;
  if(s2 <= 0) addContact(A, B, p2x, p2y, cnx, cny, -s2, fid | 1);
}

/* walls and floor as planes; up to two deepest vertices per plane so a
   flat landing rests on both corners of its bottom edge */
let pd1 = 0, pd2 = 0, pi1 = -1, pi2 = -1;
function planePick(b, sideX, sideY, offset){
  pd1 = -1e9; pd2 = -1e9; pi1 = -1; pi2 = -1;
  for(let i = 0; i < b.nv; i++){
    const d = b.wv[i].x * sideX + b.wv[i].y * sideY - offset;   // penetration depth
    if(d > pd1){ pd2 = pd1; pi2 = pi1; pd1 = d; pi1 = i; }
    else if(d > pd2){ pd2 = d; pi2 = i; }
  }
}
function planeContacts(b, W, H){
  // (plane feature ids live above 4096: plane index << 4, plus the vertex)
  // floor — the line the critique was about: hull verts, not a circle
  planePick(b, 0, 1, H);
  if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, 0, 1, Math.max(pd1, 0), 4096 | pi1);
  if(pd2 > -1 && pi2 !== pi1) addContact(b, null, b.wv[pi2].x, b.wv[pi2].y, 0, 1, Math.max(pd2, 0), 4096 | pi2);
  // left wall
  planePick(b, -1, 0, 0);
  if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, -1, 0, Math.max(pd1, 0), 4096 | 16 | pi1);
  // right wall
  planePick(b, 1, 0, W);
  if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, 1, 0, Math.max(pd1, 0), 4096 | 32 | pi1);
  // ceiling — off while a toy is still dropping in from above
  if(!b.entering){
    planePick(b, 0, -1, 0);
    if(pd1 > -1) addContact(b, null, b.wv[pi1].x, b.wv[pi1].y, 0, -1, Math.max(pd1, 0), 4096 | 48 | pi1);
  }
}

/* match this frame's contacts to last frame's impulses BEFORE any are
   applied: exact feature id first, then — for pairs whose points
   survived but changed ids (a rocking 2-point manifold flickers its
   second clip point at display-rate dt) — nearest same-pair point
   within WARM_R. Each stored impulse is spent at most once. */
function matchWarm(){
  for(let k = 0; k < nPrev; k++) prevUsed[k] = 0;
  for(let i = 0; i < nContacts; i++){
    const c = contacts[i];
    const ida = c.a.id, idb = c.b ? c.b.id : -1;
    for(let k = 0; k < nPrev; k++){
      if(!prevUsed[k] && prevA[k] === ida && prevB[k] === idb &&
         prevF[k] === c.fid){ c.warm = k; prevUsed[k] = 1; break; }
    }
  }
  for(let i = 0; i < nContacts; i++){
    const c = contacts[i];
    if(c.warm >= 0) continue;
    const ida = c.a.id, idb = c.b ? c.b.id : -1;
    let bk = -1, bd = WARM_R * WARM_R;
    for(let k = 0; k < nPrev; k++){
      if(prevUsed[k] || prevA[k] !== ida || prevB[k] !== idb) continue;
      const dx = c.px - prevPX[k], dy = c.py - prevPY[k];
      const d = dx * dx + dy * dy;
      if(d < bd){ bd = d; bk = k; }
    }
    if(bk >= 0){ c.warm = bk; prevUsed[bk] = 1; }
  }
}

/* one supporting contact reported: remember how wide the base is */
function supAdd(b, px, py){
  const s = px * gPerpX + py * gPerpY;
  if(b.supN === 0){ b.supLo = s; b.supHi = s; }
  else{ if(s < b.supLo) b.supLo = s; if(s > b.supHi) b.supHi = s; }
  b.supN++;
}

/* an impact wakes a sleeper — its whole island with it — but a weak hit
   soon after the island slept keeps everyone's progress, so a gentle
   wake-resettle exchange stays a beat, never a loop */
function wakeHit(b, vn, t){
  const soon = t - b.sleptAt < WAKE_SOON_T * 1000 && -vn < WAKE_V * WAKE_SOON_V;
  wakeIsland(b, soon);
}

/* precompute effective masses + restitution bias, and read every gate off
   the TRUE relative velocity — warm-start impulses are applied afterwards
   in a separate pass (warmContact), never before the measurements. When
   they were interleaved, each contact's approach speed included the warm
   impulses of every earlier contact on the same bodies: under a tall
   stack that read as a phantom impact of hundreds of px/s on a body at
   rest, re-kicking toy tumbles and re-waking sleepers forever. */
function prepContact(c, dt, t){
  const A = c.a, B = c.b;
  A.touch = 1; if(B) B.touch = 1;
  A.cn++; if(B) B.cn++;           // how braced each body is this substep
  c.pen0 = c.pen;                 // the narrowphase truth — solvePos drains
                                  // c.pen as bookkeeping, the medic reads this
  c.rax = c.px - A.x; c.ray = c.py - A.y;
  if(B){ c.rbx = c.px - B.x; c.rby = c.py - B.y; }
  const raN = c.rax * c.ny - c.ray * c.nx;
  const rbN = B ? (c.rbx * c.ny - c.rby * c.nx) : 0;
  const iMb = B ? B.iM : 0, iIb = B ? B.iI : 0;
  const kn = A.iM + iMb + A.iI * raN * raN + iIb * rbN * rbN;
  c.mN = kn > 1e-9 ? 1 / kn : 0;      // two immovables: no impulse, no drama
  const tx = -c.ny, ty = c.nx;
  const raT = c.rax * ty - c.ray * tx;
  const rbT = B ? (c.rbx * ty - c.rby * tx) : 0;
  const kt = A.iM + iMb + A.iI * raT * raT + iIb * rbT * rbT;
  c.mT = kt > 1e-9 ? 1 / kt : 0;

  let rvx = -(A.vx - A.va * c.ray), rvy = -(A.vy + A.va * c.rax);
  if(B){ rvx += B.vx - B.va * c.rby; rvy += B.vy + B.va * c.rbx; }
  const vn = rvx * c.nx + rvy * c.ny;

  // the dt-honest approach speed: against a plane or a sleeper, the
  // gravity integrated THIS frame (g·n̂·dt — 33px/s per 60Hz frame, 67 at
  // the clamp) sits in vn without the body having moved anywhere. Take
  // it back out before deciding whether this is a real impact, or every
  // grounded body re-crosses the gate forever at display-rate dt.
  let comp = 0;
  if(!B || B.sleeping)   comp =  (gravX * c.nx + gravY * c.ny) * dt;
  else if(A.sleeping)    comp = -(gravX * c.nx + gravY * c.ny) * dt;
  if(comp < 0) comp = 0;               // never manufacture approach speed
  const vnb = vn + comp;

  // restitution: only a body that actually flew here may bounce —
  // paper settling on paper never re-arms the gate
  const air = B ? (A.airT > B.airT ? A.airT : B.airT) : A.airT;
  c.bias = (air > REST_AIR && vnb < -REST_MIN)
    ? -(B && B.rest > A.rest ? B.rest : A.rest) * vnb : 0;

  // an arriving impact wakes sleepers (gently-woken ones re-sleep fast)
  if(vn < -WAKE_V){
    if(A.sleeping) wakeHit(A, vn, t);
    if(B && B.sleeping) wakeHit(B, vn, t);
  }
  // a hard-enough hit sends a 3D toy tumbling in depth (it rides the
  // solver's contacts — no collision detection of its own). Only a party
  // that actually FLEW here may kick — R1_KICK_AIR of real flight, not
  // REST_AIR's bounce-worth: a grounded pile shuffling its load is
  // pressure, and a settling slab's own rock-hops are housekeeping;
  // neither may re-spin an almost-finished topple
  if(vn < -R1_KICK_MIN && air > R1_KICK_AIR){
    if(A.tumbles) kickTumble(A, -vn, c.nx, c.ny);
    else if(B && B.tumbles) kickTumble(B, -vn, c.nx, c.ny);
  }

  // who is holding whom up, and on how wide a base — the settle pass
  // leans harder on bodies balanced on a single point
  const gd = (c.nx * gravX + c.ny * gravY) / G;
  if(gd > .6) supAdd(A, c.px, c.py);
  else if(B && gd < -.6) supAdd(B, c.px, c.py);

  // parked deep inside each other: note it — if it persists, a sleeper
  // must wake and yield, an awake body gets walked out by the medic
  // (the position solver can't win a deep jam alone)
  if(c.pen > PEN_DEEP){
    A.penDeep = 1;
    if(B) B.penDeep = 1;
  }
}

/* warm start, its own pass once every contact has been measured: begin
   from the impulse this contact carried last frame (matched by id or
   proximity), applied up front, so the stack holds itself without
   re-impact */
function warmContact(c){
  if(c.warm < 0) return;
  const A = c.a, B = c.b;
  c.jn = prevJn[c.warm]; c.jt = prevJt[c.warm];
  c.jn0 = c.jn; c.jt0 = c.jt;    // the quiet meter reads change AGAINST this
  const tx = -c.ny, ty = c.nx;
  const px = c.jn * c.nx + c.jt * tx, py = c.jn * c.ny + c.jt * ty;
  A.vx -= px * A.iM; A.vy -= py * A.iM;
  A.va -= (c.rax * py - c.ray * px) * A.iI;
  if(B){
    B.vx += px * B.iM; B.vy += py * B.iM;
    B.va += (c.rbx * py - c.rby * px) * B.iI;
  }
}

function solveVel(c){
  const A = c.a, B = c.b;
  let rvx = -(A.vx - A.va * c.ray), rvy = -(A.vy + A.va * c.rax);
  if(B){ rvx += B.vx - B.va * c.rby; rvy += B.vy + B.va * c.rbx; }
  const vn = rvx * c.nx + rvy * c.ny;
  let dj = -(vn - c.bias) * c.mN;
  const oj = c.jn;
  c.jn = Math.max(oj + dj, 0);
  dj = c.jn - oj;
  let px = dj * c.nx, py = dj * c.ny;
  A.vx -= px * A.iM; A.vy -= py * A.iM;
  A.va -= (c.rax * py - c.ray * px) * A.iI;
  if(B){
    B.vx += px * B.iM; B.vy += py * B.iM;
    B.va += (c.rbx * py - c.rby * px) * B.iI;
  }
  // Coulomb-ish friction: tangential impulse clamped to mu * normal
  rvx = -(A.vx - A.va * c.ray); rvy = -(A.vy + A.va * c.rax);
  if(B){ rvx += B.vx - B.va * c.rby; rvy += B.vy + B.va * c.rbx; }
  const tx = -c.ny, ty = c.nx;
  const vt = rvx * tx + rvy * ty;
  let djt = -vt * c.mT;
  const maxF = MU * c.jn, ot = c.jt;
  c.jt = Math.min(Math.max(ot + djt, -maxF), maxF);
  djt = c.jt - ot;
  px = djt * tx; py = djt * ty;
  A.vx -= px * A.iM; A.vy -= py * A.iM;
  A.va -= (c.rax * py - c.ray * px) * A.iI;
  if(B){
    B.vx += px * B.iM; B.vy += py * B.iM;
    B.va += (c.rbx * py - c.rby * px) * B.iI;
  }
}

/* pair position correction — squeeze-aware when the pair is genuinely
   tunneled (pen past PEN_DEEP): a party whose exit direction points
   straight into a plane that pinned it this substep (the pill on the
   floor under a tunneled-in letter) FORFEITS its share — the plane
   pass would take it right back anyway — while the other party keeps
   its own natural share and drains the overlap for real. The forfeited
   share is NOT transferred: handing it over doubled the free party's
   step, and a light letter deep between two heavies got slammed 8px a
   frame between its neighbors, detaching every contact it needed.
   Shallow resting pens keep the plain mass split untouched. */
function solvePos(c){
  if(c.pen <= SLOP) return;
  const A = c.a, B = c.b;
  const iMb = B ? B.iM : 0;
  let wA = A.iM, wB = iMb;
  if(B && c.pen > PEN_DEEP){
    if(-c.nx * A.pinx - c.ny * A.piny > .7) wA = 0;   // A exits through its plane
    if( c.nx * B.pinx + c.ny * B.piny > .7) wB = 0;   // B exits through its plane
    if(wA === 0 && wB === 0){ wA = A.iM; wB = iMb; }  // both trapped: old split
  }
  const total = A.iM + iMb;                 // natural shares, forfeits dropped
  if(total <= 0 || wA + wB <= 0) return;
  const step = Math.min(BAUM * (c.pen - SLOP), POS_CORR);
  const corr = step / total;
  A.x -= c.nx * corr * wA; A.y -= c.ny * corr * wA;
  if(B){ B.x += c.nx * corr * wB; B.y += c.ny * corr * wB; }
  c.pen -= step;
}

/* planes go LAST in every position pass and correct in full. The depth
   is re-measured from the live pose each time (position passes only
   translate, so the stored contact-vertex offset stays exact), because
   the pair corrections above may have pressed a squeezed body back into
   the floor mid-pass: a thin letter under a loaded pill at 33ms dt used
   to lose that fight forever, buzzing at y > H while the capped floor
   step was out-muscled six-to-one. The floor gets the final word, every
   pass, so no frame ever ends with a body past a wall or the floor —
   the capped pair solver then extracts the overlap at the heavy party's
   pace while the load rides up. Position-only, like every correction
   here: the velocities never see it, so there is nothing to bounce. */
function solvePlanePos(c, W, H){
  const A = c.a;
  if(A.iM <= 0) return;
  const off = c.ny > 0 ? H : (c.nx > 0 ? W : 0);
  const d = (A.x + c.rax) * c.nx + (A.y + c.ray) * c.ny - off;
  if(d <= SLOP) return;
  A.x -= c.nx * (d - SLOP);
  A.y -= c.ny * (d - SLOP);
  if(c.nx) A.pinx = c.nx;           // pinned: it was being pressed into this
  if(c.ny) A.piny = c.ny;           // plane — pair passes now hand its share
                                    // to the party that CAN yield (axis-unit
                                    // components; a corner body keeps both)
}

/* ---- the loop ---- */
function start(){
  if(!raf){ lastT = performance.now(); raf = requestAnimationFrame(step); }
}

function simActive(b, t){
  if(b.kind === "toy") return true;          // toys never stop being physical
  if(mode === "live") return t >= b.dropAt || b === held;
  return false;                              // seated / homing letters go elsewhere
}

function floorSnap(b, H){
  // asleep means at rest — put the lowest hull vertex exactly ON the
  // line, but never move more than SNAP_MAX: a settled-looking body
  // teleporting at the sleep frame IS the pop we're killing
  updateWorld(b);
  let maxy = -1e9;
  for(let i = 0; i < b.nv; i++) if(b.wv[i].y > maxy) maxy = b.wv[i].y;
  const d = H - maxy;
  if(d > -SNAP_MAX && d < SNAP_MAX) b.y += d;
}

/* de-penetration by pure position projection: slide b clear of the
   walls and of everything nearby, measuring TRUE overlap with the SAT
   (clip points under-report angled overlaps). Planes go last within
   each pass so the floor always has the final word. (Sleeping bodies
   stay immovable to the position pass, so live bodies are pushed OUT
   of them, never through.) Overlap up to DEP_KISS is tolerated — that
   is inside the solver's own SLOP comfort zone — and `cap` bounds the
   total move: while a body stills toward sleep this runs every frame
   with a small cap, spreading the cleanup over the whole still window
   instead of saving it up for one visible sleep-frame jump. */
const depN = { x:0, y:0 };
function depFaceNormal(A, e){
  const j = (e + 1) % A.nv;
  const ex = A.wv[j].x - A.wv[e].x, ey = A.wv[j].y - A.wv[e].y;
  const il = 1 / (Math.hypot(ex, ey) || 1);
  depN.x = ey * il; depN.y = -ex * il;
}
function depenetrate(b, W, H, cap){
  const x0 = b.x, y0 = b.y;
  for(let pass = 0; pass < 6; pass++){
    updateWorld(b);
    let moved = false;
    for(const o of bodies){
      if(o === b || !o.col) continue;
      if(b.minx > o.maxx || o.minx > b.maxx ||
         b.miny > o.maxy || o.miny > b.maxy) continue;
      maxSeparation(b, o); const sA = satRes.sep, eA = satRes.edge;
      if(sA >= -DEP_KISS) continue;
      maxSeparation(o, b); const sB = satRes.sep, eB = satRes.edge;
      if(sB >= -DEP_KISS) continue;
      // slide b out along the least-overlap axis, leaving a light kiss
      if(sA >= sB){ depFaceNormal(b, eA); b.x -= depN.x * (-sA - DEP_KISS); b.y -= depN.y * (-sA - DEP_KISS); }
      else        { depFaceNormal(o, eB); b.x += depN.x * (-sB - DEP_KISS); b.y += depN.y * (-sB - DEP_KISS); }
      moved = true;
      updateWorld(b);
    }
    // walls and floor, hard: flush is fine, inside is not
    let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    for(let i = 0; i < b.nv; i++){
      const p = b.wv[i];
      if(p.x < minx) minx = p.x; if(p.x > maxx) maxx = p.x;
      if(p.y < miny) miny = p.y; if(p.y > maxy) maxy = p.y;
    }
    if(maxy > H){ b.y -= maxy - H; moved = true; }
    if(minx < 0){ b.x -= minx; moved = true; }
    if(maxx > W){ b.x -= maxx - W; moved = true; }
    if(miny < 0 && !b.entering){ b.y -= miny; moved = true; }
    if(!moved) break;
  }
  let dx = b.x - x0, dy = b.y - y0;
  let d = Math.hypot(dx, dy);
  if(cap && d > cap){                  // clamp the resultant; what's left
    const k = cap / d;                 // bleeds out on the coming frames
    b.x = x0 + dx * k; b.y = y0 + dy * k;
    d = cap;
    updateWorld(b);
  }
  return d;
}

/* deepest true overlap (px) between m and any other collidable body —
   the island clean-sleep gate reads it: a pair frozen visibly inside
   each other is the one artifact a sleep may never bake in */
function pairPen(m){
  let deep = 0;
  for(const o of bodies){
    if(o === m || !o.col) continue;
    if(m.minx > o.maxx || o.minx > m.maxx ||
       m.miny > o.maxy || o.miny > m.maxy) continue;
    maxSeparation(m, o); const s1 = satRes.sep;
    if(s1 >= 0) continue;
    maxSeparation(o, m); const s2 = satRes.sep;
    const s = s1 > s2 ? s1 : s2;
    if(-s > deep) deep = -s;
  }
  return deep;
}

/* the assist's last unlock: a member that is STILL deep in someone
   after ISL_ASSIST of deferring is trapped — and the trap's roof is
   usually a sleeper it merely KISSES (a frozen toy right above it
   blocks the only exit while the deep overlap is with the awake pill
   below, so no depth test on the sleeper itself ever fires). Gently
   wake every sleeper the member touches (progress kept, so a bystander
   re-sleeps in a beat): once the roof can ride up, the squeeze drains
   and the island — the woken neighbor now unioned in — freezes clean
   together. */
function assistWake(m){
  if(pairPen(m) <= SLEEP_PEN) return;
  for(const o of bodies){
    if(o === m || !o.col || !o.sleeping) continue;
    if(m.minx > o.maxx + 1 || o.minx > m.maxx + 1 ||
       m.miny > o.maxy + 1 || o.miny > m.maxy + 1) continue;
    maxSeparation(m, o); const s1 = satRes.sep;
    if(s1 >= .25) continue;
    maxSeparation(o, m); const s2 = satRes.sep;
    if((s1 > s2 ? s1 : s2) < .25) wakeIsland(o, true);
  }
}

/* …and for an AWAKE roof: the mass-split solver lifts a heavy slab off
   a trapped letter at its inverse-mass share — one twentieth of a px a
   pass, forever. Once the island is in assisted deferral, move the
   member's deepest awake partner OUT along their separation axis
   directly: a few px a frame, mass-blind, kept. (When that axis points
   into the partner's own plane the plane pass takes the step back — a
   wasted frame, not a harm: the deepest partner alternates around the
   sandwich and the free-direction frames drain it.) The column
   detightens body by body until the island finally reads clean. */
function roofLift(m){
  let deep = SLEEP_PEN, tgt = null, dirx = 0, diry = 0;
  for(const o of bodies){
    if(o === m || !o.col || o.sleeping || o === held) continue;
    if(m.minx > o.maxx || o.minx > m.maxx ||
       m.miny > o.maxy || o.miny > m.maxy) continue;
    maxSeparation(m, o); const s1 = satRes.sep, e1 = satRes.edge;
    if(s1 >= 0) continue;
    maxSeparation(o, m); const s2 = satRes.sep, e2 = satRes.edge;
    const s = s1 > s2 ? s1 : s2;
    if(-s <= deep) continue;
    deep = -s;
    tgt = o;
    if(s1 >= s2){ depFaceNormal(m, e1); dirx =  depN.x; diry =  depN.y; }
    else        { depFaceNormal(o, e2); dirx = -depN.x; diry = -depN.y; }
  }
  if(!tgt) return;
  const step = Math.min(deep - DEP_KISS, ASSIST_STEP);
  if(step <= 0) return;
  tgt.x += dirx * step; tgt.y += diry * step;
  updateWorld(tgt);
}

/* the moment of sleep — a whole island's at once. Every member of the
   contact island rooted at r has passed its stillness test, so the
   cluster freezes as one, in this same frame, after a single collective
   final de-penetration: floor-snap plus two rounds of overlap bleed,
   each body's TOTAL correction capped at SNAP_MAX (a settled-looking
   body teleporting at the sleep instant was the single most visible
   pop). The island only sleeps clean — clean now means BOTH ways: a
   member the cap left more than SLEEP_PEN inside a wall or the floor,
   OR more than SLEEP_PEN inside any neighbor, defers the whole freeze,
   the poses revert untouched, and the ordinary pre-sleep bleed keeps
   working the overlap down. A pair the capped bleed cannot clean within
   ISL_ASSIST ms of deferring (sandwiched, its every resultant cancels)
   graduates to assisted separation: the recap loosens to ASSIST_STEP
   and each frame's progress is KEPT instead of reverted — a few px a
   frame, until the island really is clean. A truly jammed island stops
   deferring after ISL_DEFER frames and freezes as-is rather than churn
   forever. No one outside the island moves, so there is no snap for a
   sleeping cluster to pop its neighbors with — the old sleep-wake
   metronome has nothing left to tick. Returns true when poses changed
   for good — a freeze or a kept assist step — so the caller repaints
   rather than stopping on a stale frame. */
function islandSleep(r, W, H, t){
  let assist = false;
  for(const m of bodies){
    if(!m.sim || m.sleeping || islFind(m.bi) !== r) continue;
    if(m.defN > 0 && t - m.defT > ISL_ASSIST){ assist = true; break; }
  }
  const cap = assist ? ASSIST_STEP : SNAP_MAX;
  for(let round = 0; round < 2; round++){
    for(const m of bodies){
      if(!m.sim || m.sleeping || islFind(m.bi) !== r) continue;
      if(round === 0){ m.kx = m.x; m.ky = m.y; floorSnap(m, H); }
      depenetrate(m, W, H, 0);            // round 2 clears what round 1 shuffled
      const dx = m.x - m.kx, dy = m.y - m.ky;
      const d = Math.hypot(dx, dy);
      if(d > cap){
        const k = cap / d;
        m.x = m.kx + dx * k; m.y = m.ky + dy * k;
      }
      updateWorld(m);
    }
  }
  let dirty = false, jammed = false;
  for(const m of bodies){
    if(!m.sim || m.sleeping || islFind(m.bi) !== r) continue;
    if(m.maxy > H + SLEEP_PEN || m.minx < -SLEEP_PEN || m.maxx > W + SLEEP_PEN ||
       (!m.entering && m.miny < -SLEEP_PEN)) dirty = true;
    if(!dirty && pairPen(m) > SLEEP_PEN) dirty = true;
    if(m.defN > ISL_DEFER) jammed = true;
  }
  if(dirty && !jammed){
    for(const m of bodies){
      if(!m.sim || m.sleeping || islFind(m.bi) !== r) continue;
      if(!assist){                        // a deferred frame shows no nudge —
        m.x = m.kx; m.y = m.ky;           // until ISL_ASSIST, when kept steps
        updateWorld(m);                   // ARE the cure
      } else { assistWake(m); roofLift(m); }
      if(m.defN === 0) m.defT = t;
      m.defN++;
    }
    return assist;
  }
  for(const m of bodies){
    if(!m.sim || m.sleeping || islFind(m.bi) !== r) continue;
    m.sleeping = true;
    m.vx = m.vy = m.va = 0;
    m.sleptAt = t;
    m.penT = 0;
    m.defN = 0;
    m.isl = islandSeq;
  }
  islandSeq++;
  return true;
}

/* wake a sleeper the audit is unhappy about (its island with it) — but a
   body that keeps re-freezing in the same spot is truly wedged: poke it
   a few times, then leave it in peace rather than tick forever */
function auditWake(b){
  if(Math.abs(b.x - b.awX) + Math.abs(b.y - b.awY) > 2) b.awN = 0;
  if(b.awN >= 3) return 0;
  b.awN++; b.awX = b.x; b.awY = b.y;
  wakeIsland(b, false);
  return 1;
}

/* every AUDIT_N frames (and after any sleep-frame snap): no sleeper may
   float — support gone means wake up and finish the fall — and no two
   sleepers may stay frozen deep inside each other: wake the lighter one
   so the pair can resolve while the page is already animating */
function supportAudit(W, H){
  let woke = 0;
  for(const b of bodies){
    if(!b.sleeping || !b.col) continue;
    let gap = Math.min(H - b.maxy, b.minx, W - b.maxx);
    for(const o of bodies){
      if(o === b || !o.col) continue;
      if(b.minx > o.maxx + 4 || o.minx > b.maxx + 4 ||
         b.miny > o.maxy + 4 || o.miny > b.maxy + 4) continue;
      maxSeparation(b, o); const s1 = satRes.sep;
      maxSeparation(o, b); const s2 = satRes.sep;
      const s = s1 > s2 ? s1 : s2;
      if(s < gap) gap = s;
      if(o.sleeping && b.id < o.id && s < -AUDIT_PEN)
        woke += auditWake(b.m <= o.m ? b : o);
    }
    if(gap > FLOAT_GAP) woke += auditWake(b);
  }
  return woke;
}

function step(t){
  raf = 0;
  const dtF = Math.min(Math.max((t - lastT) / 1000, .0005), 1 / 30);
  lastT = t;
  const W = innerWidth, H = innerHeight;

  gPerpX = -gravY / G; gPerpY = gravX / G;   // across-gravity unit axis

  // every display frame splits into substeps of at most MAX_STEP: the
  // solver sees the same few px/s of injected gravity per pass at 60Hz
  // as at 30, at G = 4200 as it did at 2000 — one physics world on
  // every display, and no 33ms frame tunneling a letter through a pill
  const nSub = Math.min(MAX_SUB, Math.ceil(dtF / MAX_STEP));
  for(let sub = 0; sub < nSub; sub++) subStep(dtF / nSub, t, W, H, sub === 0);
  finishStep(dtF, t, W, H);
}

function subStep(dt, t, W, H, first){
  // gravity + drag on everything awake — the held body included: it
  // stays fully dynamic, and the pin below is what carries it.
  // touch and penDeep clear only on the FIRST substep: they are what
  // the frame-rate code (airT, the pen-wake clock, the sleep window)
  // reads, and sampling just the last substep silently dropped every
  // touch the first one saw — at sustained 30Hz that re-armed the
  // restitution gate on grounded bodies and starved the pen-wake
  // clock, and the pile churned for minutes instead of settling
  for(const b of bodies){
    b.sim = simActive(b, t);
    if(first){ b.touch = 0; b.penDeep = 0; b.qj = 0; }  // qj sums all substeps
    b.supN = 0;
    b.cn = 0;                 // contact count, like supN, is a per-substep fact
    b.pinx = 0; b.piny = 0;   // plane-pin flags are per-substep facts
    // held is never immovable — just modestly heavier to the pile, so a
    // shove nudges it in the hand instead of knocking it off the finger
    b.iM = b.sleeping ? 0 : (b === held ? b.invM / HOLD_MASS : b.invM);
    b.iI = b.sleeping ? 0 : (b === held ? b.invI / HOLD_MASS : b.invI);
    if(!b.sim || b.sleeping) continue;
    b.vx += gravX * dt;
    b.vy += gravY * dt;
    const dmp = 1 - LIN_DAMP * dt;
    b.vx *= dmp; b.vy *= dmp;
    b.va *= 1 - ANG_DAMP * dt;
    const sp = Math.hypot(b.vx, b.vy);
    if(sp > MAXV * 1.8){ b.vx *= MAXV * 1.8 / sp; b.vy *= MAXV * 1.8 / sp; }
  }

  // the grip is a pin: a stiff critically-damped spring at the exact
  // caught point. Grabbed by the end of a stem, gravity torques the
  // letter to hang and swing below the finger; grabbed at the centroid
  // it carries with almost no turn. Velocity-substepped so the
  // stiffness stays stable even at the 30fps dt clamp.
  if(held){
    const hb = held;
    const c0 = Math.cos(hb.a), s0 = Math.sin(hb.a);
    const rx = c0 * grabLX - s0 * grabLY;      // r = R(angle) · anchor
    const ry = s0 * grabLX + c0 * grabLY;
    let px = hb.x + rx, py = hb.y + ry;        // world anchor, advanced below
    const mi = hb.invI / hb.invM;              // m/I — force at r into spin
    const K2 = HOLD_WN * HOLD_WN, DD = 2 * HOLD_ZETA * HOLD_WN;
    const h = dt / HOLD_SUB;
    for(let s = 0; s < HOLD_SUB; s++){
      let ex = target.x - px, ey = target.y - py;
      const el = Math.hypot(ex, ey);           // yank guard: a pointer teleport
      if(el > HOLD_ERR){ ex *= HOLD_ERR / el; ey *= HOLD_ERR / el; }
      const vax = hb.vx - hb.va * ry;          // velocity of the anchor point
      const vay = hb.vy + hb.va * rx;
      const ax = K2 * ex - DD * vax;           // F/m at the anchor
      const ay = K2 * ey - DD * vay;
      hb.vx += ax * h;
      hb.vy += ay * h;
      hb.va += (rx * ay - ry * ax) * mi * h;   // (r × F)/I
      px += (hb.vx - hb.va * ry) * h;          // virtual anchor keeps the spring
      py += (hb.vy + hb.va * rx) * h;          // pointed right within the frame
    }
    // damp the swing ABOUT THE GRIP: shed the paired linear velocity too,
    // or the pin just converts it back into spin — pendulums die politely
    {
      const dw = -HOLD_ADAMP * dt * hb.va;
      hb.va += dw;
      hb.vx += dw * ry;
      hb.vy -= dw * rx;
      if(hb.va >  HOLD_WMAX) hb.va =  HOLD_WMAX;
      if(hb.va < -HOLD_WMAX) hb.va = -HOLD_WMAX;
    }
    if(hb.tumbles){
      // in hand the device turns to face the viewer — screen out, the
      // showcase pose (the flood, the centred caption and this screen are
      // the point) — and holds there while the grip pendulum above keeps
      // the in-plane dangle. Critically damped, closed form, so the turn
      // is exact and stable at any dt; a knock from the pile dips the
      // pose a degree or two and the spring takes it straight back.
      faceSpring(hb, dt);
    }
  }

  // homing letters: simple kinematic springs to their seats, no collision —
  // the toys keep their ordinary physics underneath
  if(mode === "homing"){
    let allHome = true;
    for(const b of bodies){
      if(b.kind === "toy" || b.homed) continue;
      if(t < b.homeDelay){ allHome = false; continue; }
      const s = seatRect(b.i);
      const hx = s.left + b.cx, hy = s.top + b.cy;
      const K = 170, D = 20;
      b.vx += (-K * (b.x - hx) - D * b.vx) * dt;
      b.vy += (-K * (b.y - hy) - D * b.vy) * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.a += (0 - b.a) * Math.min(1, dt * 9);   // untwist on the way home
      if(Math.hypot(b.x - hx, b.y - hy) < 1 && Math.hypot(b.vx, b.vy) < 30
         && Math.abs(b.a) < .02){
        b.x = hx; b.y = hy; b.vx = b.vy = 0; b.a = 0; b.va = 0; b.homed = true;
      } else allHome = false;
    }
    if(allHome) seatAll();       // letters return to text; toys carry on below
  }

  // broadphase + narrowphase
  nContacts = 0;
  for(const b of bodies){
    b.col = b.sim && !(b.kind !== "toy" && mode === "homing");
    if(b.col) updateWorld(b);
  }
  for(let i = 0; i < bodies.length; i++){
    const A = bodies[i];
    if(!A.col) continue;
    for(let j = i + 1; j < bodies.length; j++){
      const B = bodies[j];
      if(!B.col) continue;
      if(A.sleeping && B.sleeping) continue;
      if(A.minx > B.maxx || B.minx > A.maxx || A.miny > B.maxy || B.miny > A.maxy) continue;
      if(A === held && B.sleeping) wakeIsland(B, false);   // the hand shoves
      if(B === held && A.sleeping) wakeIsland(A, false);   // sleepers awake
      collidePoly(A, B);
    }
    if(!A.sleeping || A === held) planeContacts(A, W, H);
  }

  matchWarm();
  for(let i = 0; i < nContacts; i++) prepContact(contacts[i], dt, t);
  for(let i = 0; i < nContacts; i++) warmContact(contacts[i]);
  for(let it = 0; it < VEL_ITERS; it++)
    for(let i = 0; i < nContacts; i++) solveVel(contacts[i]);

  // a body that is slow AND touching something is trying to settle:
  // bleed off the residual rock so thin letters stop teetering — and
  // lean SETTLE_1PT times harder on one balanced on a single vertex,
  // where gravity torque against point impulses rocks forever
  for(const b of bodies){
    if(!b.sim || b === held || b.sleeping || !b.touch) continue;
    if(Math.hypot(b.vx, b.vy) < SETTLE_V){
      const onePt = b.supN === 1 ||
                    (b.supN > 1 && b.supHi - b.supLo < SUP_W);
      b.va *= Math.max(0, 1 - (onePt ? SETTLE_ANG * SETTLE_1PT
                                     : SETTLE_ANG) * dt);
      b.vx *= Math.max(0, 1 - SETTLE_LIN * dt);
    }
  }

  // integrate positions — the held body too: the pin is a force, not a
  // hand of god, so the grab point tracks the finger through real motion
  for(const b of bodies){
    if(!b.sim || b.sleeping) continue;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.a += b.va * dt;
    if(b.tumbles && b !== held) tumbleStep(b, dt);  // held tumble damps above
    if(b.entering && b.y > b.rad + 6) b.entering = false;  // fully inside now
  }

  // pairs first, planes last within each pass — see solvePlanePos
  for(let it = 0; it < POS_ITERS; it++){
    for(let i = 0; i < nContacts; i++) if(contacts[i].b)  solvePos(contacts[i]);
    for(let i = 0; i < nContacts; i++) if(!contacts[i].b) solvePlanePos(contacts[i], W, H);
  }

  // remember this pass's impulses for the next one's warm start — and bank
  // each contact's |change| against its warm start into both parties' quiet
  // meters: at rest the warm impulses carry the whole load and the solver
  // adds ~nothing, so a resting body reads near-zero however deeply it is
  // buried, while a strike or a shove (or a brand-new contact) reads loud
  nPrev = nContacts;
  for(let i = 0; i < nContacts; i++){
    const c = contacts[i];
    prevA[i] = c.a.id; prevB[i] = c.b ? c.b.id : -1;
    prevF[i] = c.fid; prevJn[i] = c.jn; prevJt[i] = c.jt;
    prevPX[i] = c.px; prevPY[i] = c.py;
    const dn = c.jn - c.jn0, dtj = c.jt - c.jt0;
    const dq = (dn < 0 ? -dn : dn) + (dtj < 0 ? -dtj : dtj);
    c.a.qj += dq; if(c.b) c.b.qj += dq;
  }

  // last of all, a 3D toy's collider is re-cut from the pose this substep
  // just integrated — the exact pose the frame is about to paint, and the
  // one the next narrowphase will measure. Last, because a hull re-cut in
  // the middle of a substep would leave the position passes correcting
  // contact points the hull no longer has: they would hoist the body back
  // up by the very daylight the re-cut was closing.
  for(const b of bodies) if(b.tumbles) r1TrackHull(b, dt);
}

function finishStep(dt, t, W, H){
  const fCap = Math.max(1, dt * 60);   // px-per-frame budgets, dt-honest
  /* nothing may ever be lost */
  for(const b of bodies){
    if(!isFinite(b.x + b.y + b.vx + b.vy + b.a + b.va)){
      if(b.kind !== "toy"){
        const s = seatRect(b.i);
        b.x = s.left + b.cx; b.y = s.top + b.cy;
      } else {
        b.x = W / 2; b.y = H - b.rad - 2;
      }
      b.vx = b.vy = b.a = b.va = 0;
    }
    if(b.tumbles && !isFinite(b.rx + b.ry + b.wx + b.wy + b.hullW + b.hullH)){
      b.rx = b.ry = b.wx = b.wy = 0;      // level the pose, forget the growth
      b.tgtRx = NaN; b.tgtRy = NaN;       // (and any committed topple with it)
      b.poseCalm = true;                  // owed to sleepers, and re-cut the
      b.hullGrow = 0;                     // face-on hull the pose now claims
      r1TrackHull(b, dt);                 // (the NaN pose never matches, so it cuts)
    }
    if(b.sim && b !== held){
      // lost-body guards only — a body fully outside a wall or wholly
      // under the floor is put back in play. (These were hard 2px clamps
      // once: a thin letter buried under a corner pile had its centroid
      // pinned at y = H−2, teleported against the solver every frame,
      // and the whole pile churned instead of settling.)
      if(b.x < -b.rad) b.x = b.rad;
      if(b.x > W + b.rad) b.x = W - b.rad;
      if(b.y > H + b.rad) b.y = H - b.rad;
      if(!b.entering && b.y < -b.rad * 2) b.y = -b.rad * 2;
    }
    if(b.sim){
      // time since last contact — the restitution gate only opens for
      // bodies that actually flew (asleep counts as resting, not flying)
      if(b.sleeping || b.touch) b.airT = 0; else b.airT += dt;
      // deep in someone all frame: give the position solver PEN_WAKE_T
      // to win. Then a sleeper wakes to yield; a slow awake body is
      // walked out by the capped medic — a tunneled trio can otherwise
      // jam churning just fast enough that the stillness bleed never
      // runs while the capped position solver never gains ground.
      // MEDIC_T of that with no cure — or MEDIC_T pinned in one spot
      // while vibrating past BUZZ_V — escalates: a 3× walk-out, and any
      // sleeper this body is still jammed deep against is woken so the
      // load above can ride up out of the squeeze instead of pressing
      // the fight closed from above
      if(b.penDeep){
        b.penT += dt;
        b.penF = 0;
        if(b.penT > PEN_WAKE_T){
          if(b.sleeping) wakeIsland(b, false);
          else if(b !== held && b.vx * b.vx + b.vy * b.vy < WEDGE_V * WEDGE_V){
            const deep = pairPen(b);
            const buzz = b.wstill > MEDIC_T &&
                         b.vx * b.vx + b.vy * b.vy > BUZZ_V * BUZZ_V;
            // the medic only handles real WOUNDS: tunnels past WEDGE_PEN,
            // or a proven pinned buzz. Chronic 2-5px sandwich jams belong
            // to the solver's squeeze-aware drain and the island assist —
            // walking those every frame just shuffled three bodies in
            // conflicting directions, migrated the pile sideways, and
            // kiss-woke the neighborhood into 12s of churn
            if(deep > WEDGE_PEN || buzz){
              const esc = b.penT > MEDIC_T || buzz;
              if(esc){
                // ~2s proven stuck: ONE decisive poke, then stand back for
                // another MEDIC_T (poking every frame was itself a churn
                // engine that kept corner piles from stilling). A letter
                // buried tip-first past WEDGE_PEN gets pulled straight out
                // along its deepest CONTACT normal — the wound axis — in
                // one move: the SAT-least-axis walk kept choosing sideways
                // exits the surrounding pile blocks. Anything shallower
                // takes the ordinary uncapped walk-out. Either way every
                // sleeping CONTACT partner is woken (the roof of a squeeze
                // is usually a frozen kiss, not the deep pair itself;
                // kisses wake gently, deep partners hard) so the load can
                // ride up rather than press the wound closed again
                let bc = null, bp = WEDGE_PEN;
                for(let ci = 0; ci < nContacts; ci++){
                  const c = contacts[ci];
                  if(c.b && (c.a === b || c.b === b) && c.pen0 > bp){
                    bp = c.pen0; bc = c;
                  }
                }
                if(bc){
                  const dir = bc.a === b ? -1 : 1;
                  b.x += dir * bc.nx * (bp - DEP_KISS);
                  b.y += dir * bc.ny * (bp - DEP_KISS);
                  depenetrate(b, W, H, 0);   // settle the pop: clear of walls,
                } else                       // floor, and fresh grazes
                  depenetrate(b, W, H, 0);
                for(let ci = 0; ci < nContacts; ci++){
                  const c = contacts[ci];
                  if(!c.b) continue;
                  const dp = c.pen0 > PEN_DEEP;
                  if(c.a === b && c.b.sleeping) wakeIsland(c.b, !dp);
                  else if(c.b === b && c.a.sleeping) wakeIsland(c.a, !dp);
                }
                b.penT = PEN_WAKE_T;
                b.wstill = 0;
              } else
                // the walk-out cap scales with the wound: a 10px tunnel
                // must drain faster than gravity re-sinks the load above
                depenetrate(b, W, H,
                  Math.max(WEDGE_FIX, deep * WEDGE_DRAIN) * fCap);
            }
          }
        }
      } else if(b.penT > 0){
        // deep pens FLICKER at alternating dt (a sandwiched pair reads
        // deep on the long frame, clean on the short one): the stuck
        // clock forgives only after a genuinely clean half second, so
        // the one body whose walk-out would free the column still gets
        // its turn instead of being reset every other frame
        b.penF += dt;
        if(b.penF > .5) b.penT = 0;
      }
    }
  }

  // static friction — grip, don't glide. A grounded, unheld body stops
  // DEAD (velocities zeroed outright, this frame) the moment all three
  // hold: every point of it is under its kind's grip speed (|v|+|ω|·rad
  // bounds the fastest contact point); its frame was QUIET (summed
  // contact-impulse change under QUIET_J·m·G·dt — steady support, not a
  // strike or a shove: a body still being pushed reads loud and keeps
  // moving); and it is BRACED by STOP_MIN_C contacts (a letter tipping
  // over its lone corner is falling, not settling — friction cannot hold
  // a body against rotation about its only support). Positions never
  // move, so nothing pops; tilt gravity with real in-plane lean stands
  // the whole stop down, so tilted piles keep their creep. The sleep
  // gates stay the final authority — bodies simply reach them already
  // still instead of drifting the last few px/s for a second-plus.
  if(gravX < STOP_TILT * G && gravX > -STOP_TILT * G){
    for(const b of bodies){
      if(!b.sim || b.sleeping || b === held || !b.touch || b.entering ||
         b.cn < STOP_MIN_C) continue;
      if(b.qj > QUIET_J * b.m * G * dt) continue;
      const gripV = b.kind === "letter" ? STOP_LTR
                  : b.kind === "pill"   ? STOP_PILL : STOP_TOY;
      if(Math.hypot(b.vx, b.vy) + Math.abs(b.va) * b.rad >= gripV) continue;
      b.vx = 0; b.vy = 0; b.va = 0;
    }
  }

  render(t);

  // sleep, in two acts. Act one, per body: genuinely still for a beat —
  // a throw's apex (speed ~0 for a frame) never counts. Two clocks run.
  // The instantaneous gates catch clean rests; the drift window catches
  // what they never will: a decaying rock or a wedged pair whose fight
  // keeps the per-frame numbers spiky while the body hovers in one spot
  // — hovering in one spot IS settled. While either clock runs, true
  // overlap is bled a little every frame (dt-scaled, so a 30Hz display
  // bleeds as many px/s as a 60Hz one), and the sleep frame itself has
  // nothing left to snap. Passing here only marks the body ready.
  let anyAwake = false, anyWaiting = false, justSnapped = false;
  for(const b of bodies){
    b.canSleep = 0;
    if(!b.sim){
      if(b.kind !== "toy" && mode === "live" && t < b.dropAt) anyWaiting = true;
      continue;
    }
    if(b === held || b.sleeping) continue;
    const spd = Math.hypot(b.vx, b.vy);
    const fmv = Math.hypot(b.x - b.fpx, b.y - b.fpy);   // this frame's true move
    b.fpx = b.x; b.fpy = b.y;
    const slowV = spd < SLEEP_LIN && Math.abs(b.va) < SLEEP_ANG;
    const nearAnchor = Math.abs(b.x - b.sx) < SLEEP_DX &&
                       Math.abs(b.y - b.sy) < SLEEP_DX &&
                       Math.abs(b.a - b.sa) < SLEEP_DA;
    // (the r1 also may not sleep while its pose spring is still rocking)
    const settleable = !b.entering && (!b.tumbles || b.poseCalm);
    if(settleable && b.touch && spd < WIN_V && Math.abs(b.va) < WIN_A &&
       Math.abs(b.x - b.qx) < WIN_DX && Math.abs(b.y - b.qy) < WIN_DX &&
       Math.abs(b.a - b.qa) < WIN_DA){
      b.wstill += dt;
    } else {
      b.qx = b.x; b.qy = b.y; b.qa = b.a;
      b.wstill = 0;
    }
    if(settleable && (slowV || nearAnchor)){
      // resting bodies still show spiky per-frame speeds (the solver's
      // heartbeat), so "hasn't actually gone anywhere" also counts as still
      b.still += dt;
    } else {
      b.sx = b.x; b.sy = b.y; b.sa = b.a;
      b.still = 0;
    }
    if(b.still > 0 || b.wstill > SLEEP_T)
      depenetrate(b, W, H, PRESLEEP_FIX * fCap);
    // the move gate defers readiness off a position-solver jump frame —
    // but only defers: a body the solver ping-pongs every single frame
    // while its velocity reads still is a wedged fight, and freezing it
    // IS the fix, so after 3× the normal wait it counts ready regardless
    if((fmv < SLEEP_MV * fCap || b.still > SLEEP_T * 3) &&
       (b.still > SLEEP_T || (b.wstill > SLEEP_WT && spd < WIN_STOP)))
      b.canSleep = 1;
  }

  // act two, per island: union-find over this frame's awake contact
  // graph (sleeping bodies stay out — they are frozen scenery, and
  // routing islands through them would chain strangers together). An
  // island sleeps only when EVERY member is ready, all in one frame,
  // through one collective capped de-penetration — so no member can
  // sleep out of phase with a neighbor and pop it awake. A held member
  // (or any unready one) keeps its whole island up.
  const nB = bodies.length;
  for(let i = 0; i < nB; i++){
    bodies[i].bi = i;
    islP[i] = i; islStill[i] = 1; islTried[i] = 0;
  }
  for(let i = 0; i < nContacts; i++){
    const c = contacts[i];
    if(!c.b || c.a.sleeping || c.b.sleeping) continue;
    const ra = islFind(c.a.bi), rb = islFind(c.b.bi);
    if(ra !== rb) islP[rb] = ra;
  }
  for(const b of bodies){
    if(!b.sim || b.sleeping) continue;
    if(b === held || !b.canSleep) islStill[islFind(b.bi)] = 0;
  }
  for(let i = 0; i < nB; i++){
    const b = bodies[i];
    if(!b.sim || b.sleeping || b === held || !b.canSleep) continue;
    const r = islFind(i);
    if(islTried[r]) continue;
    islTried[r] = 1;
    if(islStill[r] && islandSleep(r, W, H, t)) justSnapped = true;
  }
  for(const b of bodies)
    if(b.sim && !b.sleeping) anyAwake = true;

  // a body snapped flush this frame was already painted pre-snap;
  // repaint so the loop never stops on a stale, ~1px-off frame
  if(justSnapped) render(t);

  // no sleeper may float, none may stay frozen deep inside another
  frameN++;
  if((justSnapped || frameN % AUDIT_N === 0) && supportAudit(W, H))
    anyAwake = true;

  const busy = held || mode === "homing" || anyAwake || anyWaiting ||
               any3DBusy();            // a 3D toy's pose may still be settling
  if(busy) raf = requestAnimationFrame(step);
}

function render(t){
  for(const b of bodies){
    if(b.kind !== "toy"){
      if(mode === "seated") continue;
      if(mode === "live" && t < b.dropAt && b !== held){
        // waiting letters (and pills) hold their seat, pixel-perfect
        b.el.style.transform = "translate3d(" + (b.x - b.cx).toFixed(2) + "px," +
                               (b.y - b.cy).toFixed(2) + "px,0)";
        continue;
      }
    }
    // place the centroid, rotate about it, then offset back to the box corner
    b.el.style.transform = "translate3d(" + b.x.toFixed(2) + "px," + b.y.toFixed(2) +
      "px,0) rotate(" + b.a.toFixed(3) + "rad)" + " translate(" +
      (-b.cx).toFixed(2) + "px," + (-b.cy).toFixed(2) + "px)";
    if(b.draw3d) b.draw3d(t, b);   // repaint the canvas sprite if it changed
  }
}

/* ================================================================
   The toys — a rabbit r1 and an iPhone 17 Pro, each rendering its
   real baked mesh through WebGL. The r1 degrades to flat divs when
   it can't; the iPhone simply stays home. They crash the pile a
   beat after the first spill and then live on this page forever:
   reassembly ignores them, re-spills rain letters onto them, and
   they drag and fling like everything else.
   ================================================================ */
/* a rounded-slab octagon about the centroid — shared by the toys and
   the pills. w/h/cut describe the HULL; bw/bh (default w/h) are the
   element box the centroid sits in, because the iPhone draws on a
   square canvas wider than the slab it actually is. */
function setSlabGeometry(b, w, h, cut, dens, bw, bh){
  const w2 = w / 2, h2 = h / 2, c = cut;
  const oct = [
    {x:-w2 + c, y:-h2}, {x:w2 - c, y:-h2}, {x:w2, y:-h2 + c}, {x:w2, y:h2 - c},
    {x:w2 - c, y:h2}, {x:-w2 + c, y:h2}, {x:-w2, y:h2 - c}, {x:-w2, y:-h2 + c},
  ];
  const g = polyProps(oct, 8, dens);
  b.nv = 8;
  b.cx = (bw || w) / 2; b.cy = (bh || h) / 2;   // symmetric: centroid = box centre
  b.m = Math.max(60, g.area * dens); b.invM = 1 / b.m;
  b.I = g.I; b.invI = 1 / b.I;
  let r = 0;
  for(let i = 0; i < 8; i++){
    b.lv[i].x = oct[i].x; b.lv[i].y = oct[i].y;
    r = Math.max(r, Math.hypot(oct[i].x, oct[i].y));
  }
  b.rad = r;
  b.toyW = w; b.toyH = h; b.toyCut = cut;   // the depth-aware hull re-cuts from these
  b.hullW = w; b.hullH = h; b.hullGrow = 0;
}
function toyBody(el, w, h, cut, bw, bh){
  const b = mkBody(el, "toy");
  setSlabGeometry(b, w, h, cut, TOY_DENS, bw, bh);
  return b;
}

/* ---- the 3D toys' depth tumble --------------------------------------
   Real angular state in depth: pitch rx and yaw ry (rad) with angular
   velocities wx, wy — while the solver's in-plane angle b.a stays
   untouched. Flings and impacts kick it, air and ground drag calm it,
   and once the body is down and slow a lightly under-damped spring
   rocks it onto the nearest stable pose: face (0), back (±PI), or
   standing edge-on like a coin (±PI/2). The collision hull narrows to
   match the silhouette as it turns. Only the WebGL toys set b.tumbles —
   the flat CSS r1 fallback has no depth to tumble through. */
function dAng(d){          // wrap any angle difference into [-PI, PI)
  d = (d + Math.PI) % (2 * Math.PI);
  if(d < 0) d += 2 * Math.PI;
  return d - Math.PI;
}
function rspin(){ return Math.random() < .5 ? -1 : 1; }
function clampW(v){ return Math.max(-R1_W_MAX, Math.min(R1_W_MAX, v)); }

/* an impact converts approach speed into tumble; the contact normal
   picks the axis mix (floors mostly pitch, walls mostly yaw), a little
   randomness keeps repeats from looking mechanical, and part of the
   old spin is scrubbed the way a real hit would. Rate-limited so a
   two-point landing kicks once, not twice. Momentum-committed, like
   everything grounded: an axis already visibly turning keeps its
   direction (a slam reinforces the rotation it came from — the old
   coin-flip re-randomized an in-progress topple, which read as the
   object snapping to a new angle mid-turn), and a result below
   R1_COMMIT on a touching body is gripped to zero outright — a strike
   either really flips the slab or the slab shudders and stays. */
function kickTumble(b, speed, nx, ny){
  const now = performance.now();
  if(now - b.lastKick < 70) return;
  b.lastKick = now;
  b.poseCalm = false;
  b.tgtRx = NaN; b.tgtRy = NaN;   // a strike is new momentum: the topple re-decides
  const k = Math.min(R1_W_MAX, speed * R1_KICK_HIT);
  const sx = b.wx > .3 ? 1 : b.wx < -.3 ? -1 : rspin();
  const sy = b.wy > .3 ? 1 : b.wy < -.3 ? -1 : rspin();
  b.wx = clampW(b.wx * .6 + sx * k * (.25 + .75 * Math.abs(ny)) * (.6 + Math.random() * .4));
  b.wy = clampW(b.wy * .6 + sy * k * (.25 + .75 * Math.abs(nx)) * (.6 + Math.random() * .4));
  if(b.touch){                    // grounded grip: no sub-commit wobble survives
    if(b.wx < R1_COMMIT && b.wx > -R1_COMMIT && b.wx !== 0){ b.wx = 0; b.dwX = R1_GRIP_T; }
    if(b.wy < R1_COMMIT && b.wy > -R1_COMMIT && b.wy !== 0){ b.wy = 0; b.dwY = R1_GRIP_T; }
  }
}


/* a held toy faces the viewer: both depth axes ease to exactly 0 on a
   critically damped spring (FACE_WN), integrated in closed form — for
   ζ = 1, from (φ, w) the true solution over dt is
     φ' = (φ + (w + ωφ)·dt)·e^(−ω·dt),   w' = (w − ω(w + ωφ)·dt)·e^(−ω·dt)
   — exact at any dt, so the turn cannot go unstable at the 30fps clamp
   and never overshoots. dAng picks the short way around from a back-on
   catch. On release the pose is face-on and the throw's tumble kick
   takes it from there. */
function faceSpring(b, dt){
  const e = Math.exp(-FACE_WN * dt);
  let p = dAng(b.rx), w = b.wx, k = (w + FACE_WN * p) * dt;
  b.rx = (p + k) * e;
  b.wx = (w - FACE_WN * k) * e;
  p = dAng(b.ry); w = b.wy; k = (w + FACE_WN * p) * dt;
  b.ry = (p + k) * e;
  b.wy = (w - FACE_WN * k) * e;
  b.poseCalm = false;              // it re-settles (or re-kicks) after release
  b.tgtRx = NaN; b.tgtRy = NaN;    // the hand overrode any committed topple
  b.gnd = 0;                       // …so the release landing runs a fresh census
}

/* integrate the tumble each awake frame (the held case lives in step).
   Fully organic: no target poses, no settle spring — spin just damps
   away and the r1 stays at whatever angle it stopped at. It lands
   where it lands. */
const flatOf = th => Math.round(th / Math.PI) * Math.PI;          // square to us
const HPI2 = Math.PI / 2;
const faceOf = th => Math.round((th - HPI2) / Math.PI) * Math.PI + HPI2;  // flat on the floor
/* the face AHEAD of angle th moving at w: the nearest rest angle when the
   motion already points at it, otherwise the next one along the spin.
   `near` is the axis's own nearest (faceOf for rx, flatOf for ry) — faces
   stay the only destinations either way; this only ever changes WHICH. */
function aheadOf(th, w, near){
  const d = dAng(near - th);
  return ((d > 0) === (w > 0) && d !== 0) ? near
       : near + (w > 0 ? Math.PI : -Math.PI);
}
/* one axis's momentum census: spin past R1_COMMIT earns a commit to the
   face ahead — scaled by the journey that commit implies. An axis already
   over the ridge commits at the plain threshold (its travel is short and
   the field strong the whole way); one barely off its old face would ride
   ~180° from a standing start through the field's antipodal null — a
   two-second crawl that destabilized the body — so a full flip must be
   PAID FOR with proportionally more spin. Returns the target, or NaN for
   "this is not real motion" (the caller grips or brakes it). */
function commitOf(th, w, near){
  const aw = w < 0 ? -w : w;
  if(aw <= R1_COMMIT) return NaN;
  const tgt = aheadOf(th, w, near);
  const trav = Math.abs(dAng(tgt - th));
  return aw >= R1_COMMIT * (trav > HPI2 ? trav / HPI2 : 1) ? tgt : NaN;
}
function tumbleStep(b, dt){
  if(b.poseCalm) return;                 // frozen mid-pose until the next kick
  if(!b.touch){ b.tgtRx = NaN; b.tgtRy = NaN;     // left the ground: the next
                b.dwX = 0; b.dwY = 0; }           // landing decides afresh
  const grounded = b.touch && Math.hypot(b.vx, b.vy) < R1_GND_V;
  // THE ENGAGE EDGE runs the momentum census FIRST, on the raw skid-carried
  // spin — before grounded damping takes its first bite. (It used to run
  // after: a landing carrying 1.7 rad/s measured 1.3 by census time, missed
  // the commit, was gripped, and tipped back the other way — the snap, one
  // layer deeper.) Sub-threshold spin is not real motion and is GRIPPED to
  // zero on the spot — the depth twin of the static-friction stop — so every
  // grounded turn is either a committed ride or a from-rest tip: no reversals.
  if(grounded && !b.gnd){
    if(isNaN(b.tgtRx)){
      b.tgtRx = commitOf(b.rx, b.wx, faceOf(b.rx));
      if(isNaN(b.tgtRx) && b.wx !== 0){ b.wx = 0; b.dwX = R1_GRIP_T; }
    }
    if(isNaN(b.tgtRy)){
      b.tgtRy = commitOf(b.ry, b.wy, flatOf(b.ry));
      if(isNaN(b.tgtRy) && b.wy !== 0){ b.wy = 0; b.dwY = R1_GRIP_T; }
    }
  }
  b.gnd = grounded ? 1 : 0;
  const dk = Math.exp(-(grounded ? R1_DAMP_SET
                       : b.touch ? R1_DAMP_GND : R1_DAMP_AIR) * dt);
  b.wx *= dk; b.wy *= dk;

  if(grounded){
    // weight decides which way it topples: rx wants ±90° (the device flat on
    // the floor, screen-down or back-down, so we see its profile), ry wants
    // 0 or π (square to us, not turned onto a side edge). WHICH ±90°, which
    // of 0/π, is momentum's call: an axis that lands with real spin (past
    // R1_COMMIT) commits once to the face ahead of its motion, and the
    // committed field 2K·sin(target − angle) walks it the whole way there —
    // one sign the entire route, so a topple can never stall and reverse,
    // and the same 2K stiffness at the face as the nearest-face pull, so
    // the arrival stays exactly critically damped against R1_DAMP_SET.
    // The old always-nearest pull flipped targets on landings that crossed
    // the halfway ridge — the visible snap back.
    // An axis the nearest pull has since accelerated past the threshold
    // commits to where it was already going (the same face), so later
    // grounded-edge flickers can never re-audit a topple in flight; the
    // journey scale in commitOf leaves post-kick outbound spin uncommitted,
    // and the nearest field brakes it the way a real slab's edge would
    if(isNaN(b.tgtRx) && (b.wx > R1_COMMIT || b.wx < -R1_COMMIT))
      b.tgtRx = commitOf(b.rx, b.wx, faceOf(b.rx));
    if(isNaN(b.tgtRy) && (b.wy > R1_COMMIT || b.wy < -R1_COMMIT))
      b.tgtRy = commitOf(b.ry, b.wy, flatOf(b.ry));
    if(b.dwX > 0) b.dwX -= dt;             // a gripped axis holds its pose a
    else if(isNaN(b.tgtRx)){               // beat before weight may tip it
      b.wx += R1_FLAT_K * Math.sin(2 * b.rx) * dt;
      // stood perfectly upright it has nowhere to fall — give it a reason
      // (committed axes already know their way down and get no nudges)
      if(Math.cos(2 * b.rx) > .985 && Math.abs(b.wx) < .06)
        b.wx += (Math.cos(b.rx) >= 0 ? 1 : -1) * R1_FLAT_NUDGE * dt;
    } else
      b.wx += 2 * R1_FLAT_K * Math.sin(dAng(b.tgtRx - b.rx)) * dt;
    if(b.dwY > 0) b.dwY -= dt;
    else if(isNaN(b.tgtRy)){
      b.wy += -R1_FLAT_K * Math.sin(2 * b.ry) * dt;
      if(Math.cos(2 * b.ry) < -.985 && Math.abs(b.wy) < .06)
        b.wy += (b.ry >= 0 ? -1 : 1) * R1_FLAT_NUDGE * dt;
    } else
      b.wy += 2 * R1_FLAT_K * Math.sin(dAng(b.tgtRy - b.ry)) * dt;
    b.wx = clampW(b.wx); b.wy = clampW(b.wy);   // committed fields honor the
  }                                             // same top speed the kicks do

  const fx = faceOf(b.rx), dx0 = dAng(b.rx - fx);   // face-relative side, before
  const fy = flatOf(b.ry), dy0 = dAng(b.ry - fy);
  b.rx = dAng(b.rx + b.wx * dt);
  b.ry = dAng(b.ry + b.wy * dt);

  // an axis IN CONTACT that crosses its face has put that face ON the
  // floor — the slap ends the turn: land exactly there, dead, at any speed,
  // sliding or not (a skidding slab slaps flat and keeps sliding). Toppling
  // past flat, overshooting R1_FLAT_EPS and being pulled back was always an
  // artifact — the shimmy at the end of an otherwise decisive topple; and a
  // commit whose crossing fell in a fast skid sailed degrees past its own
  // target and got yanked back. The few degrees the fastest slap forfeits
  // are under the eye's floor. Airborne crossings tumble on, untouched.
  if(b.touch){
    if(dx0 !== 0 && (dAng(b.rx - fx) > 0) !== (dx0 > 0)){
      b.rx = dAng(fx); b.wx = 0; b.tgtRx = NaN;
    }
    if(dy0 !== 0 && (dAng(b.ry - fy) > 0) !== (dy0 > 0)){
      b.ry = dAng(fy); b.wy = 0; b.tgtRy = NaN;
    }
  }

  // each axis may rest the moment IT is square to a face and done turning —
  // independently: the old both-axes gate let one slow axis hold the other
  // a fraction off its face, visibly hunting. Both down: the pose is calm.
  if(grounded){
    const rxIn = Math.abs(b.wx) < .04 &&
                 Math.abs(dAng(b.rx - faceOf(b.rx))) < R1_FLAT_EPS;
    const ryIn = Math.abs(b.wy) < .04 &&
                 Math.abs(dAng(b.ry - flatOf(b.ry))) < R1_FLAT_EPS;
    if(rxIn){ b.rx = dAng(faceOf(b.rx)); b.wx = 0; b.tgtRx = NaN; }
    if(ryIn){ b.ry = dAng(flatOf(b.ry)); b.wy = 0; b.tgtRy = NaN; }
    if(rxIn && ryIn) b.poseCalm = true;  // sleep may proceed; rAF may stop
    // (the last 2° per axis land under the eye's floor. The collider takes
    // the exact profile at the end of this same substep, where the tracker
    // runs for every pose — the old explicit re-cut here was the rate
    // limiter's exemption, and a hull cut in the middle of a substep is
    // the one thing the tracker must not do)
  }
}

/* the new silhouette is on record: remember its box and, if the hull
   GREW, keep the tally. Only a fattening hull can shove anyone, so only
   then are sleepers within reach woken rather than teleported through —
   a narrowing hull disturbs no one. And because the cut now happens
   every frame, the growth ACCUMULATES and the neighbourhood is told
   once it adds up to R1_WAKE_DW: the pile feels the same shove it
   always did, in one notification instead of sixty a second. */
function r1NoteHull(b, w, h){
  b.hullGrow += Math.max(0, w - b.hullW) + Math.max(0, h - b.hullH);
  b.hullW = w; b.hullH = h;
  if(b.hullGrow < R1_WAKE_DW) return;
  b.hullGrow = 0;
  for(const o of bodies){
    if(o === b || !o.sleeping) continue;
    if(Math.hypot(o.x - b.x, o.y - b.y) < o.rad + b.rad + 6) wakeIsland(o, false);
  }
}

/* world y of the lowest hull vertex — where the silhouette's foot is */
function hullLowY(b){
  const s = Math.sin(b.a), c = Math.cos(b.a);
  let maxy = -1e9;
  for(let i = 0; i < b.nv; i++){
    const wy = b.y + b.lv[i].x * s + b.lv[i].y * c;
    if(wy > maxy) maxy = wy;
  }
  return maxy;
}

/* generator scratch for the cut below — reused, never reallocated */
const zgX = [0, 0, 0], zgY = [0, 0, 0];
const zvX = [0, 0, 0, 0, 0, 0], zvY = [0, 0, 0, 0, 0, 0];
function zPush(n, x, y){
  if(y < 0 || (y === 0 && x < 0)){ x = -x; y = -y; }   // into the y >= 0 half-plane
  if(x * x + y * y < 1e-9) return n;                   // this axis is exactly edge-on
  zgX[n] = x; zgY[n] = y;
  return n + 1;
}
function zSwap(i, j){
  let t = zgX[i]; zgX[i] = zgX[j]; zgX[j] = t;
  t = zgY[i]; zgY[i] = zgY[j]; zgY[j] = t;
}

/* THE COLLIDER IS THE SILHOUETTE — re-cut from the pose every frame.
   A slab turned by pitch rx and yaw ry projects to the zonogon spanned
   by its three half-axes: four sides seen square-on, six at any angle
   between, and its corners chamfered by the same fraction of each edge
   the face-on octagon always used, so a toy at rest wears precisely the
   hull it wore before. The outline itself, note — not the outline's
   bounding box, which is what a width-and-height collider really is: an
   r1 balanced on a diagonal edge paints a thin band across a nearly
   square box, and the box held it 37px above the floor for a quarter
   second while it toppled. Together with the deadband, the rate limit
   and the grounded freeze that used to sit here — a toy landing on a
   hull cut for its mid-air pose, tumbling around inside it, dropping
   only at the end — that was the whole of the container.

   The box of that outline is still worth naming, because growth is what
   the sleepers care about:

     tall = toyH·|cos rx| + thick·|sin rx|
     wide = toyW·|cos ry| + |sin ry|·(toyH·|sin rx| + thick·|cos rx|)

   Twelve verts a frame cost nothing; only the waking is rationed. And
   while it is grounded, a shrinking silhouette PIVOTS on its contact
   rather than lifting off it. */
function r1TrackHull(b, dt){
  if(b.rx === b.hullRx && b.ry === b.hullRy) return;   // the pose has not moved
  b.hullRx = b.rx; b.hullRy = b.ry;
  const thick = b.toyH * (b.thick3d || R1_THICK);      // never thinner than it is deep
  const cx = Math.cos(b.rx), sx = Math.sin(b.rx);
  const cy = Math.cos(b.ry), sy = Math.sin(b.ry);
  const hx = b.toyW * .5, hy = b.toyH * .5, hz = thick * .5;
  // the three half-axes as the screen sees them (the model's +y is up)
  let n = zPush(0, hx * cy, 0);
  n = zPush(n, hy * sy * sx, -hy * cx);
  n = zPush(n, hz * sy * cx, hz * sx);
  if(n < 2) return;                                    // degenerate: keep the hull
  // order them by angle — inside one half-plane the cross product suffices
  if(zgX[0] * zgY[1] - zgY[0] * zgX[1] < 0) zSwap(0, 1);
  if(n === 3){
    if(zgX[1] * zgY[2] - zgY[1] * zgX[2] < 0) zSwap(1, 2);
    if(zgX[0] * zgY[1] - zgY[0] * zgX[1] < 0) zSwap(0, 1);
  }
  let sumx = 0, sumy = 0, ex = 0, ey = 0;
  for(let i = 0; i < n; i++){
    sumx += zgX[i]; sumy += zgY[i];
    ex += Math.abs(zgX[i]); ey += Math.abs(zgY[i]);    // …the outline's box
  }
  // walk it: from the far corner, out along each generator in turn, back
  let px = -sumx, py = -sumy, m = 0;
  zvX[m] = px; zvY[m] = py; m++;
  for(let i = 0; i < n; i++){
    px += 2 * zgX[i]; py += 2 * zgY[i];
    zvX[m] = px; zvY[m] = py; m++;
  }
  for(let i = 0; i < n - 1; i++){
    px -= 2 * zgX[i]; py -= 2 * zgY[i];
    zvX[m] = px; zvY[m] = py; m++;
  }
  const pivot = b.airT === 0 && b !== held;            // it was resting on something
  const low0 = pivot ? hullLowY(b) : 0;
  // chamfer every corner into the collider — no toy balances on a point
  const v = b.lv;
  let k = 0, r2 = 0;
  for(let i = 0; i < m; i++){
    const qx = zvX[i], qy = zvY[i];
    let dx = zvX[(i + m - 1) % m] - qx, dy = zvY[(i + m - 1) % m] - qy;
    let t = Math.min(b.toyCut / (Math.hypot(dx, dy) || 1), R1_CHAMFER);
    let vx = qx + dx * t, vy = qy + dy * t;
    v[k].x = vx; v[k].y = vy; k++;
    if(vx * vx + vy * vy > r2) r2 = vx * vx + vy * vy;
    dx = zvX[(i + 1) % m] - qx; dy = zvY[(i + 1) % m] - qy;
    t = Math.min(b.toyCut / (Math.hypot(dx, dy) || 1), R1_CHAMFER);
    vx = qx + dx * t; vy = qy + dy * t;
    v[k].x = vx; v[k].y = vy; k++;
    if(vx * vx + vy * vy > r2) r2 = vx * vx + vy * vy;
  }
  b.nv = k;
  b.rad = Math.sqrt(r2);
  r1NoteHull(b, 2 * ex, 2 * ey);
  if(pivot){
    const rise = low0 - hullLowY(b);                   // the foot came off the floor…
    if(rise > 0) b.y += Math.min(rise, R1_PIVOT_MAX * Math.max(1, dt * 60));
  }                                                    // …so put the body back on it
}

function capHeightPx(F){
  const h = HULLS["h"];               // the 'h' ascender stands in for cap height
  if(!h) return F * .72;
  let top = 0;
  for(const p of h) top = Math.min(top, p.y);
  return Math.max(F * .3, -top * F);
}

function makeRabbit(side){
  const el = document.createElement("div");
  el.className = "toy";
  el.setAttribute("aria-hidden", "true");
  const rr = Math.round(side * .16);
  el.style.cssText = "width:" + side + "px;height:" + side + "px;" +
    "background:#ff4d06;border-radius:" + rr + "px;";
  const screen = document.createElement("div");
  screen.style.cssText = "left:" + Math.round(side * .10) + "px;top:" +
    Math.round(side * .16) + "px;width:" + Math.round(side * .46) + "px;height:" +
    Math.round(side * .68) + "px;background:#141416;border-radius:" +
    Math.max(2, Math.round(side * .05)) + "px;";
  const wheel = document.createElement("div");
  const wd = Math.round(side * .30);
  wheel.style.cssText = "right:" + Math.round(side * .11) + "px;top:" +
    Math.round((side - wd) / 2) + "px;width:" + wd + "px;height:" + wd + "px;" +
    "background:#d83c00;border-radius:50%;";
  el.append(screen, wheel);
  return { el, w:side, h:side, cut:rr * .75 };
}

/* ================================================================
   The 3D toys — baked meshes drawn by a tiny hand-rolled WebGL1
   renderer, one shader family, two paths: a textured path (the
   r1's baseColor skin, the iPhone's runtime-drawn OLED) and a
   vertex-colored path (the iPhone's body, whose 17 materials were
   baked to per-vertex sRGB). Two-light lambert plus a soft rim so
   black faces still read. The solver's in-plane angle is untouched
   — each canvas is CSS-positioned and CSS-rotated by the body
   angle exactly like the flat toy it replaces. Depth, though, is
   real state: the body carries pitch/yaw (b.rx, b.ry) with angular
   velocity, kicked by flings and impacts, damping out wherever it
   stops, while the collision hull narrows to match (all of that
   lives up in the physics section; these painters just draw
   whatever pose the body holds). A second matrix folds the body
   angle back into the normals so the lights stay fixed on the page
   while the model tumbles. Missing mesh, no WebGL, or any failure
   at all: return null — the r1 then ships its flat CSS stand-in,
   the iPhone simply stays home.
   ================================================================ */
const busy3D = [];         // step() asks every 3D toy whether its pose settled
function any3DBusy(){
  for(let i = 0; i < busy3D.length; i++) if(busy3D[i]()) return true;
  return false;
}

/* the furthest any vertex can be flung from the centre by a tumble. The
   pose matrix is RotY·RotX, and for a vertex p the projected |x| reaches
   exactly |p| at some (rx, ry) — max |cos ry·px + sin ry·(sin rx·py +
   cos rx·pz)| = hypot(px, py, pz) — so the worst case across every pose
   any model can strike is simply its furthest vertex, the half-diagonal
   of its own bake. Measured here rather than assumed: the r1 reaches
   1.330 and the phone 1.055 model units, against the 1.0 a face-on
   canvas covers. */
function modelRadius(batches){
  let r2 = 1;
  for(const bt of batches){
    const p = bt.pos;
    for(let i = 0; i < p.length; i += 3){
      const d = p[i] * p[i] + p[i + 1] * p[i + 1] + p[i + 2] * p[i + 2];
      if(d > r2) r2 = d;
    }
  }
  return Math.sqrt(r2);
}

function makeModelGL(batches, side, opts){
  const el = document.createElement("canvas");
  el.className = "toy";
  el.setAttribute("aria-hidden", "true");
  // headroom: `side` is the size the MODEL draws at, and it never changes.
  // The canvas around it grows to hold the worst pose plus a margin, and
  // the ortho scale is divided by exactly the same factor — same pixels
  // per model unit, same picture, just more transparent glass around it,
  // so no tumble can ever have its corners shaved by the canvas edge.
  const ppu = side * .985 / 2;                          // px per model unit — fixed
  const box = Math.ceil(2 * (modelRadius(batches) * ppu + MODEL_PAD));
  const mScale = side * .985 / box;                     // …which this preserves
  el.style.width = box + "px";
  el.style.height = box + "px";
  const glOpts = { alpha:true, antialias:true, premultipliedAlpha:true };
  let gl = null;
  try{
    gl = el.getContext("webgl", glOpts) || el.getContext("experimental-webgl", glOpts);
  }catch(err){ gl = null; }
  if(!gl) return null;

  function sh(kind, src){
    const s = gl.createShader(kind);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
  }
  function mkProg(vsSrc, fsSrc){
    const vs = sh(gl.VERTEX_SHADER, vsSrc), fs = sh(gl.FRAGMENT_SHADER, fsSrc);
    if(!vs || !fs) return null;
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    return gl.getProgramParameter(p, gl.LINK_STATUS) ? p : null;
  }
  // the same lambert+rim tail for both paths; only where c comes from differs
  const LIGHT =
    "float ka=max(dot(n,vec3(-.42,.61,.67)),0.);" +      // key light, upper left front
    "float kb=max(dot(n,vec3(.79,-.33,.52)),0.);" +      // fill, lower right
    "float rim=pow(max(1.-abs(n.z),0.),2.6)*.3;" +       // fresnel-ish edge (max: no NaN on mediump rounding)
    "gl_FragColor=vec4(c*(.34+.66*ka+.2*kb)+rim,1.);";
  let progTex = null, locTex = null;
  if(batches.some(bt => bt.uv)){
    // uZB nudges a batch toward the viewer: the iPhone's OLED sits behind
    // its own cover glass, baked opaque black — without the nudge the
    // wallpaper loses the depth test to it. The r1 passes 0 (a no-op).
    progTex = mkProg(
      "attribute vec3 aP;attribute vec3 aN;attribute vec2 aT;" +
      "uniform mat3 uM;uniform mat3 uL;uniform float uZB;" +
      "varying vec3 vN;varying vec2 vT;" +
      "void main(){vec3 p=uM*aP;gl_Position=vec4(p.xy,-p.z*.35-uZB,1.);vN=uL*aN;vT=aT;}",
      "precision mediump float;uniform sampler2D uT;varying vec3 vN;varying vec2 vT;" +
      "void main(){vec3 n=normalize(vN);vec3 c=texture2D(uT,vT).rgb;" + LIGHT + "}");
    if(!progTex) return null;
    gl.useProgram(progTex);
    gl.uniform1i(gl.getUniformLocation(progTex, "uT"), 0);
    locTex = { prog:progTex,
               aP:gl.getAttribLocation(progTex, "aP"),
               aN:gl.getAttribLocation(progTex, "aN"),
               aX:gl.getAttribLocation(progTex, "aT"), xSize:2,
               uM:gl.getUniformLocation(progTex, "uM"),
               uL:gl.getUniformLocation(progTex, "uL"),
               uZB:gl.getUniformLocation(progTex, "uZB") };
  }
  let progCol = null, locCol = null;
  if(batches.some(bt => bt.rgb)){
    progCol = mkProg(
      "attribute vec3 aP;attribute vec3 aN;attribute vec3 aVertexColor;" +
      "uniform mat3 uM;uniform mat3 uL;varying vec3 vN;varying vec3 vC;" +
      "void main(){vec3 p=uM*aP;gl_Position=vec4(p.xy,-p.z*.35,1.);vN=uL*aN;vC=aVertexColor;}",
      "precision mediump float;varying vec3 vN;varying vec3 vC;" +
      "void main(){vec3 n=normalize(vN);vec3 c=vC;" + LIGHT + "}");
    if(!progCol) return null;
    locCol = { prog:progCol,
               aP:gl.getAttribLocation(progCol, "aP"),
               aN:gl.getAttribLocation(progCol, "aN"),
               aX:gl.getAttribLocation(progCol, "aVertexColor"), xSize:3,
               uM:gl.getUniformLocation(progCol, "uM"),
               uL:gl.getUniformLocation(progCol, "uL") };
  }

  /* painter state — the tumble itself lives on the body (b.rx, b.ry) */
  const mM = new Float32Array(9), mL = new Float32Array(9);
  let dirty = true, dead = false;
  let dpr0 = 0, lastA = 1e9, lastRx = 1e9, lastRy = 1e9;

  function vbo(data){
    const bo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bo);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    return bo;
  }
  const draws = batches.map(bt => {
    const d = { loc:bt.uv ? locTex : locCol,
                pos:vbo(bt.pos), nrm:vbo(bt.nrm), ext:vbo(bt.uv || bt.rgb),
                ibo:gl.createBuffer(), n:bt.idx.length, tex:null, img:null,
                zb:bt.zb || 0 };
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, bt.idx, gl.STATIC_DRAW);
    // every textured batch owns a texture, even if its source never
    // arrives — the sampler must never read whatever happens to be bound
    if(bt.uv){
      // 1px stand-in: the r1's embedded JPEG takes ms to decode, and a
      // runtime-drawn canvas is uploaded on the very first paint
      d.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, d.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE,
                    new Uint8Array(bt.fill || [255, 255, 255]));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      if(bt.canvas){
        d.img = bt.canvas;            // already drawn: no decode to wait on
      } else if(bt.tex){
        const img = new Image();
        img.onload = () => { d.img = img; dirty = true; start(); };
        img.src = bt.tex;
      }
    }
    return d;
  });
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 0);

  el.addEventListener("webglcontextlost", e => {
    e.preventDefault();
    dead = true;
    if(opts.onLost) opts.onLost(el);   // each model knows its own way down
  });

  function m3yx(ry, rx, s, out){      // column-major s · RotY(ry) · RotX(rx)
    const cy = Math.cos(ry), sy = Math.sin(ry);
    const cx = Math.cos(rx), sx = Math.sin(rx);
    out[0] = cy * s;      out[1] = 0;       out[2] = -sy * s;
    out[3] = sy * sx * s; out[4] = cx * s;  out[5] = cy * sx * s;
    out[6] = sy * cx * s; out[7] = -sx * s; out[8] = cy * cx * s;
  }
  function m3z(phi, m){               // m ← RotZ(phi) · m, in place
    const c = Math.cos(phi), s = Math.sin(phi);
    for(let j = 0; j < 9; j += 3){
      const x = m[j], y = m[j + 1];
      m[j]     = c * x - s * y;
      m[j + 1] = s * x + c * y;
    }
  }
  function bindAttr(loc, bo, size){
    gl.bindBuffer(gl.ARRAY_BUFFER, bo);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  }
  function draw3d(t, b){
    if(dead) return;
    // repaint only when what the canvas shows would actually change
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if(!dirty && dpr === dpr0 && b.a === lastA && b.rx === lastRx && b.ry === lastRy)
      return;
    if(dpr !== dpr0){
      dpr0 = dpr;
      el.width = el.height = Math.max(2, Math.round(box * dpr));
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    }
    m3yx(b.ry, b.rx, mScale, mM);     // positions: the tumble — CSS spins the box
    m3yx(b.ry, b.rx, 1, mL);
    m3z(-b.a, mL);                    // normals: lights stay fixed on the page
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    for(const d of draws){
      const L = d.loc;
      gl.useProgram(L.prog);
      if(d.img){                      // the real skin arrived: upload once
        gl.bindTexture(gl.TEXTURE_2D, d.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, d.img);
        if(!(d.img.width & (d.img.width - 1)) &&
           !(d.img.height & (d.img.height - 1))){
          // both real skins are power-of-two and mipmap — the 512² r1
          // baseColor and the 512×1024 phone screen. Anything NPOT would
          // have to stay LINEAR + CLAMP in WebGL1, which the 1px stand-in
          // parameters above already are.
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        }
        d.img = null;
      }
      gl.uniformMatrix3fv(L.uM, false, mM);
      gl.uniformMatrix3fv(L.uL, false, mL);
      if(L.uZB) gl.uniform1f(L.uZB, d.zb);
      bindAttr(L.aP, d.pos, 3);
      bindAttr(L.aN, d.nrm, 3);
      bindAttr(L.aX, d.ext, L.xSize);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.ibo);
      if(d.tex){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, d.tex); }
      gl.drawElements(gl.TRIANGLES, d.n, gl.UNSIGNED_SHORT, 0);
    }
    lastA = b.a; lastRx = b.rx; lastRy = b.ry;
    dirty = false;
  }

  // the hull stays the model's own slab (w/h); the ELEMENT is the padded
  // canvas, and the centroid sits at its centre — so the physics box is
  // unchanged and only the grab halo grows
  return { el, w:opts.w, h:opts.h, cut:opts.cut, boxW:box, boxH:box,
           thick:opts.thick, draw3d,
           busy:bb => !dead && !bb.poseCalm };
}

function makeRabbitGL(side){
  const MSH = window.R1_MESH;
  if(!MSH || !MSH.pos || !MSH.nrm || !MSH.uv || !MSH.idx || !MSH.idx.length)
    return null;
  const rr = Math.round(side * .16);
  return makeModelGL(
    [{ pos:MSH.pos, nrm:MSH.nrm, uv:MSH.uv, idx:MSH.idx, tex:MSH.tex,
       fill:[255, 77, 6] }],          // shell orange until the JPEG lands
    side,
    { w:side, h:side, cut:rr * .75, thick:R1_THICK,
      onLost:el => {
        el.style.background = "#ff4d06";   // degrade to the flat look, which is
        el.style.width = side + "px";      // the model's own size again — the
        el.style.height = side + "px";     // tumble headroom has nothing to hold
        el.style.borderRadius = rr + "px";
        const bb = bodyByEl.get(el);       // a flat square has no depth: level
        if(bb){                            // the pose, cut the face-on hull it
          bb.rx = bb.ry = bb.wx = bb.wy = 0;   // now has, and stop tumbling
          bb.tgtRx = bb.tgtRy = NaN;
          bb.poseCalm = true;
          r1TrackHull(bb, 0);
          bb.tumbles = false;
          bb.cx = bb.cy = side / 2;        // …and re-centre the shrunken box
          wakeIsland(bb, false);
          start();
        }
      } });
}

/* ================================================================
   The phone's screen — drawn, not photographed.

   The OLED used to sample the wallpaper JPEG baked into the mesh
   (window.IPHONE_MESH.screen.tex). It now samples a screen we draw
   ourselves at runtime, so the object in the pile shows Michael's own
   work: a stylized Ramble capture sheet, built out of rectangles and
   circles. It is deliberately NOT a pixel-copy of a real screenshot —
   no type, no logotype, just the shapes you'd recognize it by from
   across a room, which is the only distance this thing is ever seen at.

   TO SWAP IN THE REAL EXPORT: replace drawRambleScreen() — this one
   function — with something that paints a loaded PNG into the same
   512×1024 canvas and returns it. Nothing else moves: the screen
   geometry, the UV convention (top-left origin V, no UNPACK_FLIP_Y),
   the .008 depth nudge past the cover glass and the texture parameters
   all stay exactly as they are. Keep the canvas power-of-two if you
   want the mipmaps — at the size this phone renders, they are what
   stops the whole screen from shimmering as it tumbles.

   The baked wallpaper is left in iphone-mesh.js untouched (that file is
   generated, do not edit); it simply isn't sampled any more.
   ================================================================ */
const SCR_W = 512, SCR_H = 1024;   // power-of-two both ways: uploads mipmap
const SCR_ASPECT = 1.0845;   // screen quad height ÷ texture height
const SCR_PAPER  = "#fdfdfb";      // app ground — the site's own paper
const SCR_CHROME = "#e6e6e1";      // status strip marks
const SCR_TITLE  = "#2a2a28";      // the title line
const SCR_ROW    = "#dcdcd7";      // task text bars
const SCR_RING   = "#c9c9c3";      // task check outlines, home indicator
const SCR_RED    = "#e44332";      // Todoist red — waveform + record button

/* fill a rounded rect by hand — ctx.roundRect is too new to lean on */
function scrRRect(c, x, y, w, h, r){
  const k = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + k, y);
  c.arcTo(x + w, y,     x + w, y + h, k);
  c.arcTo(x + w, y + h, x,     y + h, k);
  c.arcTo(x,     y + h, x,     y,     k);
  c.arcTo(x,     y,     x + w, y,     k);
  c.closePath();
  c.fill();
}
